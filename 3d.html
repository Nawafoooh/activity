<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عارض الواقع المعزز الذكي - وكيل المعلم</title>
    <!-- استدعاء مكتبة Google Model Viewer الرسمية للواقع المعزز والثلاثي الأبعاد -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #38bdf8; text-align: center; }
        p { color: #94a3b8; text-align: center; margin-bottom: 20px; }
        model-viewer { width: 100%; max-width: 500px; height: 400px; background-color: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        /* زر الواقع المعزز المدمج من جوجل */
        #ar-button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); transition: 0.3s; }
        #ar-button:hover { background: #1d4ed8; }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        .btn-control { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-control:hover { background: #475569; }
    </style>
</head>
<body>

    <h1>⚛️ عارض النواة والذرة (AR & 3D)</h1>
    <p>قم بتدوير المجسم بإصبعك، أو اضغط زر الواقع المعزز لإسقاطه في غرفتك عبر الكاميرا!</p>

    <!-- عنصر العرض ثلاثي الأبعاد والواقع المعزز -->
    <model-viewer 
        id="ar-model"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        alt="نموذج ثلاثي الأبعاد تعليمي">
        
        <!-- زر الواقع المعزز التلقائي المدمج -->
        <button slot="ar-button" id="ar-button">
            📱 عرض في غرفتك (AR)
        </button>
    </model-viewer>

    <div class="controls">
        <button class="btn-control" onclick="changeModel('atom')">نموذج الذرة</button>
        <button class="btn-control" onclick="changeModel('dna')">شريط الـ DNA</button>
        <button class="btn-control" onclick="changeModel('brain')">الدماغ البشري</button>
    </div>

    <script>
        const viewer = document.getElementById('ar-model');
        
        // نماذج تعليمية جاهزة للاختبار الفوري
        const models = {
            atom: "https://modelviewer.dev/shared-assets/models/Astronaut.glb", // استبدله لاحقاً برابط نموذج ذرة بصيغة glb
            dna: "https://modelviewer.dev/shared-assets/models/NeilArmstrong.glb",
            brain: "https://modelviewer.dev/shared-assets/models/RobotExpressive.glb"
        };

        function changeModel(type) {
            if(models[type]) {
                viewer.src = models[type];
            }
        }
    </script>

</body>
</html>
