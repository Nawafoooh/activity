<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الصور إلى 3D و AR (مفتوح المصدر)</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; }
        button { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; text-align: center; color: #94a3b8; }
        model-viewer { width: 100%; height: 420px; background: #020617; border-radius: 8px; margin-top: 20px; display: none; }
        #ar-btn { position: absolute; bottom: 15px; right: 15px; background: #10b981; padding: 10px 18px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>⚛️ منصة المعلم المعزز (HuggingFace TripoSR)</h1>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <p id="fileLabel">اضغط لاختيار صورة (أشكال، أجهزة، خلايا...)</p>
        </div>

        <button id="submitBtn" disabled>تحويل الصورة بالذكاء الاصطناعي</button>
        <div id="status"></div>

        <div style="position: relative;">
            <model-viewer id="viewer" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look">
                <button slot="ar-button" id="ar-btn">📱 عرض في غرفتك (AR)</button>
            </model-viewer>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const submitBtn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        const viewer = document.getElementById('viewer');

        let selectedFile = null;

        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileLabel.innerText = `تم اختيار: ${selectedFile.name}`;
                submitBtn.disabled = false;
            }
        };

        submitBtn.onclick = async () => {
            if (!selectedFile) return;

            submitBtn.disabled = true;
            status.style.color = "#38bdf8";
            status.innerText = "جاري إرسال الصورة ومعالجتها عبر TripoSR (قد يستغرق 30-60 ثانية)...";
            viewer.style.display = "none";

            const formData = new FormData();
            formData.append("image", selectedFile);

            try {
                const response = await fetch("http://localhost:8000/api/convert", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "فشل التوليد");

                status.style.color = "#4ade80";
                status.innerText = "تم التوليد بنجاح! يمكنك الآن تدوير المجسم أو استخدام AR.";
                viewer.src = data.model_url;
                viewer.style.display = "block";

            } catch (err) {
                status.style.color = "#f87171";
                status.innerText = "خطأ: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
