<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مختبر النواة والواقع المعزز التفاعلي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f4f8; color: #333; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; }
        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background: { #1d4ed8; } }
        .output { background: #e2e8f0; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚛️ مختبر النواة الذرية (3D & AR Simulation)</h2>
        <p>اختر أحد المكونات لاختبار خصائصه وتفعيل المشهد الافتراضي:</p>
        <button onclick="showInfo('proton')">🔴 البروتون (+)</button>
        <button onclick="showInfo('neutron')">🔵 النيوترون (متعادل)</button>
        <button onclick="showInfo('electron')">🟢 الإلكترون (-)</button>
        <div id="infoBox" class="output">اضغط على أحد الزرين أعلاه لعرض الخصائص الافتراضية.</div>
    </div>

    <div class="card">
        <h2>📱 عارض الواقع المعزز (AR View)</h2>
        <p>لتشغيل نموذج الـ 3D مباشرة أمامك عبر الكاميرا، اضغط الزر أدناه:</p>
        <button style="background: #10b981;" onclick="alert('جاري تشغيل كاميرا الواقع المعزز لعرض نموذج الذرة ثلاثي الأبعاد...')">تشغيل الكاميرا (AR)</button>
    </div>

    <script>
        function showInfo(type) {
            const box = document.getElementById('infoBox');
            if(type === 'proton') {
                box.innerHTML = "البرتون: جسيم موجب الشحنة يوجد داخل النواة، ويحدد العدد الذري للعنصر.";
            } else if(type === 'neutron') {
                box.innerHTML = "النيوترون: جسيم متعادل الشحنة، يساعد في استقرار النواة وربط البروتونات.";
            } else if(type === 'electron') {
                box.innerHTML = "الإلكترون: جسيم سالب الشحنة يدور حول النواة في مدارات بسرعات هائلة.";
            }
        }
    </script>
</body>
</html>
