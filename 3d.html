<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر الذرة والنواة - الواقع المعزز</title>
    <!-- استدعاء مكتبة Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #38bdf8; text-align: center; }
        p { color: #94a3b8; text-align: center; margin-bottom: 20px; }
        model-viewer { width: 100%; max-width: 500px; height: 450px; background-color: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        #ar-button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); transition: 0.3s; }
        #ar-button:hover { background: #1d4ed8; }
        .info-card { margin-top: 15px; background: #1e293b; padding: 15px; border-radius: 10px; max-width: 500px; width: 100%; text-align: right; box-sizing: border-box; }
        .info-card h3 { color: #38bdf8; margin-top: 0; }
    </style>
</head>
<body>

    <h1>⚛️ مختبر الذرة والنواة (3D & AR)</h1>
    <p>استعرض النواة ومستويات الطاقة ثلاثية الأبعاد، أو اضغط زر الواقع المعزز لتجسيدها أمامك!</p>

    <!-- عارض الذرة والنواة المباشر -->
    <model-viewer 
        id="atom-viewer"
        src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/Atom/glTF-Binary/Atom.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        alt="نموذج الذرة والنواة العلمي">
        
        <button slot="ar-button" id="ar-button">
            📱 عرض النواة في غرفتك (AR)
        </button>
    </model-viewer>

    <div class="info-card">
        <h3>💡 تفاصيل المجسم العلمي:</h3>
        <p>• يظهر في المركز <b>النواة</b> وتحيط بها مدارات الإلكترونات.<br>• يدعم التدوير الكامل والتكبير بإصبعين.<br>• متوافق بالكامل مع الهواتف الذكية لعرضه عبر الكاميرا.</p>
    </div>

</body>
</html>
