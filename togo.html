<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>استئذان الطالب</title>
<meta name="description" content="منصة رقمية لإدارة طلبات استئذان الطلاب بين ولي الأمر والمدرسة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --green-900:#0B4A38;
  --green-700:#0E6B4F;
  --green-600:#128A62;
  --green-100:#E4F3EC;
  --green-050:#F3FAF7;

  --ink-900:#14201C;
  --ink-700:#3C4A45;
  --ink-500:#6B7873;
  --ink-300:#A6AFAB;
  --ink-100:#E4E8E6;

  --white:#FFFFFF;
  --bg:#F7F9F8;

  --amber-600:#B9740A;
  --amber-100:#FBEBD2;
  --red-600:#C23B33;
  --red-100:#FBE4E2;
  --blue-600:#245FA6;
  --blue-100:#E3ECFA;

  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --radius-pill:999px;

  --shadow-1: 0 1px 2px rgba(20,32,28,.06), 0 1px 1px rgba(20,32,28,.04);
  --shadow-2: 0 8px 24px rgba(11,74,56,.10);

  --tap:52px;
  --maxw:480px;

  --font: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

#app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100vh;
  background:var(--white);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow: var(--shadow-2);
}
@media (min-width:520px){
  body{ background: linear-gradient(180deg,var(--green-050),var(--bg) 240px); }
  #app{ margin-top:24px; min-height:calc(100vh - 48px); border-radius:24px; overflow:hidden; }
}

.screen{ display:flex; flex-direction:column; flex:1; animation:fadeIn .22s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.scroll{ flex:1; overflow-y:auto; padding:20px 20px 28px; }

.topbar{
  display:flex; align-items:center; gap:12px;
  padding:16px 16px;
  background:var(--white);
  border-bottom:1px solid var(--ink-100);
  position:sticky; top:0; z-index:5;
}
.topbar .back{
  width:40px; height:40px; border-radius:var(--radius-pill);
  border:none; background:var(--green-050); color:var(--green-700);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:18px; flex-shrink:0;
}
.topbar .back:active{ background:var(--green-100); }
.topbar h1{ font-size:17px; font-weight:600; margin:0; color:var(--ink-900); }
.topbar .sub{ font-size:12px; color:var(--ink-500); margin-top:1px; }

.btn{
  width:100%; min-height:var(--tap);
  border-radius:var(--radius-md);
  border:none;
  font-size:16px; font-weight:600;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .08s ease, background .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--green-700); color:var(--white); }
.btn-primary:not(:disabled):hover{ background:var(--green-900); }
.btn-outline{ background:var(--white); color:var(--green-700); border:1.5px solid var(--green-700); }
.btn-ghost{ background:transparent; color:var(--ink-700); }
.btn-danger{ background:var(--white); color:var(--red-600); border:1.5px solid var(--red-600); }
.btn-sm{ min-height:40px; font-size:14px; padding:0 14px; width:auto; }

.card{
  background:var(--white);
  border:1px solid var(--ink-100);
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-1);
}
.card + .card{ margin-top:12px; }

.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13px; color:var(--ink-700); margin-bottom:6px; font-weight:600; }
.field input, .field textarea, .field select{
  width:100%; min-height:var(--tap);
  border:1.5px solid var(--ink-100); border-radius:var(--radius-md);
  padding:0 16px; font-size:16px; color:var(--ink-900);
  background:var(--white);
  outline:none;
  appearance:none;
  -webkit-appearance:none;
}
.field select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%236B7873' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;
  background-position:left 16px center;
  padding-left:36px;
}
.field textarea{ padding:12px 16px; min-height:80px; resize:vertical; }
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--green-600); }
.field .hint{ font-size:12px; color:var(--ink-500); margin-top:6px; }
.field-row{ display:flex; gap:12px; }
.field-row .field{ flex:1; min-width:0; }

.chip-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.chip{
  border:1.5px solid var(--ink-100); background:var(--white); color:var(--ink-900);
  border-radius:var(--radius-md); padding:12px 16px; font-size:15px; font-weight:500;
  cursor:pointer; display:flex; align-items:center; gap:8px; min-height:48px;
  flex:1 1 calc(50% - 5px);
  justify-content:center;
  transition:border-color .12s ease, background .12s ease;
}
.chip.selected{ border-color:var(--green-700); background:var(--green-050); color:var(--green-900); font-weight:600; }
.chip .ico{ font-size:18px; }

.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:600; padding:6px 12px; border-radius:var(--radius-pill);
}
.badge-pending{ background:var(--amber-100); color:var(--amber-600); }
.badge-approved{ background:var(--green-100); color:var(--green-700); }
.badge-rejected{ background:var(--red-100); color:var(--red-600); }
.badge-delivered{ background:var(--blue-100); color:var(--blue-600); }
.badge-cancelled{ background:var(--ink-100); color:var(--ink-500); }

.hero{
  padding:52px 24px 28px;
  text-align:center;
  background:
    radial-gradient(120% 100% at 50% -10%, var(--green-100) 0%, var(--green-050) 42%, var(--white) 78%);
  position:relative;
  overflow:hidden;
}
.logo-mark{
  width:76px; height:76px; margin:0 auto 18px; border-radius:22px;
  background:var(--green-700);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-2);
  position:relative; z-index:1;
}
.hero h1{ font-size:26px; margin:0 0 8px; color:var(--ink-900); position:relative; z-index:1; }
.hero p{ font-size:15px; color:var(--ink-700); margin:0; line-height:1.7; position:relative; z-index:1; }

.home-actions{ padding:20px 20px 8px; display:flex; flex-direction:column; gap:12px; }
.role-btn{
  display:flex; align-items:center; gap:14px; width:100%;
  padding:16px; border-radius:var(--radius-lg);
  border:1.5px solid var(--ink-100); background:var(--white);
  cursor:pointer; text-align:start;
  min-height:64px;
}
.role-btn:active{ background:var(--green-050); }
.role-btn .ricon{
  width:44px; height:44px; border-radius:var(--radius-md); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  background:var(--green-050); color:var(--green-700);
}
.role-btn .rtext strong{ display:block; font-size:15px; }
.role-btn .rtext span{ display:block; font-size:12.5px; color:var(--ink-500); margin-top:2px; }
.role-btn .rarrow{ margin-inline-start:auto; color:var(--ink-300); }

.foot-note{ text-align:center; font-size:12px; color:var(--ink-300); padding:24px 16px 8px; }
.track-link{ text-align:center; padding:0 16px 20px; }

.summary-row{ display:flex; justify-content:space-between; gap:10px; padding:10px 0; font-size:14.5px; border-bottom:1px solid var(--ink-100); }
.summary-row:last-child{ border-bottom:none; }
.summary-row .k{ color:var(--ink-500); flex-shrink:0; }
.summary-row .v{ font-weight:600; color:var(--ink-900); text-align:end; }

.result-hero{ text-align:center; padding:40px 24px 20px; }
.result-icon{
  width:84px; height:84px; border-radius:50%; margin:0 auto 18px;
  display:flex; align-items:center; justify-content:center; font-size:38px;
}
.ri-pending{ background:var(--amber-100); color:var(--amber-600); }
.result-hero h2{ font-size:20px; margin:0 0 6px; }
.result-hero p{ font-size:14px; color:var(--ink-500); margin:0; }
.req-number{ font-size:28px; font-weight:700; letter-spacing:1px; color:var(--green-900); margin:14px 0 4px; direction:ltr; }

#toast-host{ position:fixed; inset-inline:0; bottom:16px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:999; pointer-events:none; }
.toast{
  background:var(--ink-900); color:var(--white); padding:12px 18px; border-radius:var(--radius-pill);
  font-size:13.5px; box-shadow:var(--shadow-2); max-width:88%; text-align:center;
  animation:toastIn .18s ease;
}
.toast.warn{ background:var(--amber-600); }
.toast.err{ background:var(--red-600); }
.toast.ok{ background:var(--green-700); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.empty{ text-align:center; padding:48px 20px; color:var(--ink-500); }
.empty .eicon{ font-size:34px; margin-bottom:10px; }
.empty p{ font-size:14px; margin:0; }

.stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:16px 20px 4px; }
.stat-card{ background:var(--white); border:1px solid var(--ink-100); border-radius:var(--radius-md); padding:14px; }
.stat-card .num{ font-size:24px; font-weight:700; }
.stat-card .lbl{ font-size:12.5px; color:var(--ink-500); margin-top:2px; }
.stat-card.c-new .num{ color:var(--amber-600); }
.stat-card.c-approved .num{ color:var(--green-700); }
.stat-card.c-delivered .num{ color:var(--blue-600); }
.stat-card.c-rejected .num{ color:var(--red-600); }

.section-title{ font-size:14px; font-weight:700; color:var(--ink-700); margin:22px 0 10px; }
.scroll .section-title:first-child{ margin-top:0; }

.req-item{ padding:14px; border:1px solid var(--ink-100); border-radius:var(--radius-lg); background:var(--white); cursor:pointer; box-shadow:var(--shadow-1); }
.req-item + .req-item{ margin-top:10px; }
.req-item .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.req-item .name{ font-weight:700; font-size:15.5px; }
.req-item .meta{ font-size:12.5px; color:var(--ink-500); margin-top:3px; }
.req-item .reason{ font-size:13px; color:var(--ink-700); margin-top:8px; }

.id-value{ direction:ltr; display:inline-block; font-weight:700; letter-spacing:.5px; }

.action-bar{ display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--ink-100); background:var(--white); position:sticky; bottom:0; }

.verify-box{ border:1.5px dashed var(--ink-100); border-radius:var(--radius-lg); padding:16px; margin-top:16px; }
.verify-result{ margin-top:12px; padding:12px 14px; border-radius:var(--radius-md); font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.verify-match{ background:var(--green-100); color:var(--green-900); }
.verify-mismatch{ background:var(--red-100); color:var(--red-600); }

.link-btn{ background:none; border:none; color:var(--green-700); font-weight:600; font-size:13.5px; cursor:pointer; padding:8px; }
.small-note{ font-size:12px; color:var(--ink-500); text-align:center; line-height:1.7; padding:0 8px; }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast-host"></div>

<script type="module">
/* =====================================================================
   استئذان الطالب — Student Leave Request Platform
   Single Page Application — HTML5 / CSS3 / JavaScript (ES Modules)
   Backend: Firebase (Firestore for data, Auth for the school-staff login)

   FLOW (updated per latest request):
   - ولي الأمر: بدون تسجيل دخول أو رمز تحقق. يدخل الموقع مباشرة، يكتب
     اسم ابنه، ويختار الصف والفصل من قائمة، ثم يرسل طلب الاستئذان.
   - عند حضور ولي الأمر لاستلام الطالب، يتم التحقق من هويته عبر مطابقة
     رقم الهوية الذي أدخله عند تقديم الطلب مع رقم الهوية الذي يعرضه
     فعليًا عند البوابة (بطاقة الهوية / الإقامة).
   ===================================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore, collection, doc, addDoc, getDoc, getDocs, updateDoc,
  query, where, orderBy, serverTimestamp, runTransaction, limit
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import {
  getAuth, signInWithEmailAndPassword, signOut
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDxKQY8jxZwJz5YOjRQvLq7Mb2NxQvRq1s",
  authDomain: "nawafalsubhi3-f4abf.firebaseapp.com",
  projectId: "nawafalsubhi3-f4abf",
  storageBucket: "nawafalsubhi3-f4abf.firebasestorage.app",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl"
};

let app, db, auth, firebaseReady = false;
try{
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
  firebaseReady = true;
}catch(e){
  console.warn('Firebase init failed — running in local demo-data mode.', e);
  firebaseReady = false;
}

// In-memory state only — no localStorage/sessionStorage is used.
const state = {
  route: 'home',
  params: {},
  staff: null,           // {id, name, role} — school-side session only
  requestDraft: null,
  lastRequest: null,
  submitting: false,
};

const GRADES = ['أول متوسط', 'ثاني متوسط', 'ثالث متوسط'];
const SECTIONS = ['1', '2', '3', '4', '5', '6', '7', '8'];

const REASONS = [
  { id:'medical',   label:'موعد طبي',    icon:'🩺' },
  { id:'family',    label:'ظرف عائلي',   icon:'🏠' },
  { id:'official',  label:'موعد رسمي',   icon:'📄' },
  { id:'emergency', label:'حالة طارئة',  icon:'⚠️' },
  { id:'other',     label:'أخرى',        icon:'✏️' },
];
const WINDOWS = [
  { id:'10', label:'خلال 10 دقائق' },
  { id:'20', label:'خلال 20 دقيقة' },
  { id:'30', label:'خلال 30 دقيقة' },
  { id:'30+', label:'أكثر من 30 دقيقة' },
];
const STATUS_META = {
  pending:   { label:'قيد المراجعة',      dot:'🟡', badge:'badge-pending' },
  approved:  { label:'تمت الموافقة',      dot:'🟢', badge:'badge-approved' },
  rejected:  { label:'مرفوض',             dot:'🔴', badge:'badge-rejected' },
  delivered: { label:'تم استلام الطالب',  dot:'🔵', badge:'badge-delivered' },
  cancelled: { label:'ملغي',              dot:'⚫', badge:'badge-cancelled' },
};

// Local demo-data fallback (used only if Firestore is unreachable).
const LOCAL = {
  staff: { 'staff-demo': { id:'staff-demo', name:'موظف الإدارة', role:'staff' } },
  requests: {},
  seq: 10481,
};

// ---------------------------------------------------------------------
// School staff accounts (username + password).
// NOTE ON SECURITY: this list lives inside the HTML/JS that ships to the
// browser, so anyone who views the page source can read these
// credentials — this is only safe for a small internal/testing setup on
// a private link, not for a publicly reachable production site. For a
// real deployment, move staff accounts into Firebase Authentication
// (real accounts created from the Firebase console) and remove this
// list entirely; the code below already falls back to Firebase Auth
// automatically once that is set up.
// ---------------------------------------------------------------------
const STAFF_ACCOUNTS = {
  'Nawaf': { password: 'nawaf2030', name: 'Nawaf', role: 'admin' },
};
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

// ---------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------
function go(route, params={}){
  state.route = route;
  state.params = params;
  render();
  const scroller = document.querySelector('.scroll');
  if(scroller) scroller.scrollTop = 0;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const map = {
    home: renderHome,
    parentRequestForm: renderParentRequestForm,
    leaveSummary: renderLeaveSummary,
    leaveSuccess: renderLeaveSuccess,
    trackRequest: renderTrackRequest,
    staffLogin: renderStaffLogin,
    staffDashboard: renderStaffDashboard,
    staffRequestDetail: renderStaffRequestDetail,
  };
  (map[state.route] || renderHome)(app);
}

function toast(msg, type=''){
  const host = document.getElementById('toast-host');
  const elx = document.createElement('div');
  elx.className = 'toast' + (type ? ' '+type : '');
  elx.textContent = msg;
  host.appendChild(elx);
  setTimeout(()=>{ elx.remove(); }, 3200);
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function formatDate(ts){
  try{
    const dt = ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date());
    return dt.toLocaleDateString('ar-SA-u-nu-latn', { day:'2-digit', month:'long', year:'numeric' });
  }catch(e){ return ''; }
}

function topbar(title, sub, onBack){
  const bar = el(`
    <div class="topbar">
      ${onBack ? `<button class="back" aria-label="رجوع">→</button>` : `<div style="width:40px"></div>`}
      <div>
        <h1>${title}</h1>
        ${sub ? `<div class="sub">${sub}</div>` : ''}
      </div>
    </div>`);
  if(onBack) bar.querySelector('.back').addEventListener('click', onBack);
  return bar;
}

function selectOptions(list, placeholder){
  return `<option value="" disabled selected hidden>${placeholder}</option>` +
    list.map(v=>`<option value="${v}">${v}</option>`).join('');
}

// =====================================================================
// Screen: Home
// =====================================================================
function renderHome(root){
  const screen = el(`
    <div class="screen">
      <div class="hero">
        <div class="logo-mark">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
            <path d="M12 3 3 8l9 5 7-3.9V16h2V8L12 3Z" fill="#fff"/>
            <path d="M6 12.2V16c0 1.9 2.7 3.5 6 3.5s6-1.6 6-3.5v-3.8l-6 3.3-6-3.3Z" fill="#fff" opacity=".85"/>
          </svg>
        </div>
        <h1>استئذان الطالب</h1>
        <p>قدّم طلب استئذان ابنك وتابع حالته بسهولة.</p>
      </div>
      <div class="home-actions">
        <button class="role-btn" id="btn-parent">
          <span class="ricon">👪</span>
          <span class="rtext"><strong>تقديم طلب استئذان</strong><span>اكتب اسم ابنك واختر الصف والفصل</span></span>
          <span class="rarrow">‹</span>
        </button>
        <button class="role-btn" id="btn-school">
          <span class="ricon">🏫</span>
          <span class="rtext"><strong>دخول المدرسة</strong><span>مراجعة الطلبات وتسليم الطلاب</span></span>
          <span class="rarrow">‹</span>
        </button>
      </div>
      <div class="track-link">
        <button class="link-btn" id="btn-track">لديك طلب سابق؟ تتبّع حالته برقم الطلب</button>
      </div>
      <div class="foot-note" style="margin-top:auto;">جميع الحقوق محفوظة للمدرسة</div>
    </div>`);
  screen.querySelector('#btn-parent').addEventListener('click', ()=>{
    state.requestDraft = { studentName:'', grade:'', section:'', guardianName:'', guardianId:'', reason:null, reasonNote:'', windowId:null };
    go('parentRequestForm');
  });
  screen.querySelector('#btn-school').addEventListener('click', ()=> go('staffLogin'));
  screen.querySelector('#btn-track').addEventListener('click', ()=> go('trackRequest'));
  root.appendChild(screen);
}

// =====================================================================
// Parent: single quick request form (no login)
// =====================================================================
function renderParentRequestForm(root){
  const d = state.requestDraft;
  const screen = el(`
    <div class="screen">
      ${topbar('طلب استئذان', 'بيانات الطالب', ()=>go('home')).outerHTML}
      <div class="scroll">
        <div class="field">
          <label>اسم الطالب</label>
          <input type="text" id="studentName" placeholder="اسم الطالب الثلاثي" value="${escapeHtml(d.studentName)}">
        </div>
        <div class="field-row">
          <div class="field">
            <label>الصف</label>

async function submitLeaveRequest(){
  if(state.submitting) return; // prevent duplicate double-tap submits
  state.submitting = true;
  const d = state.requestDraft;
  const reason = REASONS.find(r=>r.id===d.reason);
  const win = WINDOWS.find(w=>w.id===d.windowId);

  try{
    if(firebaseReady){
      const result = await runTransaction(db, async (tx)=>{
        const dupQ = query(collection(db,'leaveRequests'),
          where('studentName','==', d.studentName),
          where('grade','==', d.grade),
          where('section','==', d.section),
          where('status','==','pending'));
        const dupSnap = await getDocs(dupQ);
        if(!dupSnap.empty){ throw new Error('duplicate-open-request'); }

        const counterRef = doc(db,'counters','leaveRequests');
        const counterSnap = await tx.get(counterRef);
        const nextNum = (counterSnap.exists() ? counterSnap.data().value : 10480) + 1;
        tx.set(counterRef, { value: nextNum }, { merge:true });

        const reqRef = doc(collection(db,'leaveRequests'));
        tx.set(reqRef, {
          requestNumber: nextNum,
          studentName: d.studentName,
          grade: d.grade,
          section: d.section,
          guardianName: d.guardianName,
          guardianId: d.guardianId,
          reason: reason.id,
          reasonLabel: reason.label,
          reasonNote: d.reasonNote || '',
          arrivalWindow: win.label,
          status: 'pending',
          createdAt: serverTimestamp(),
        });
        tx.set(doc(collection(db,'auditLogs')), {
          action:'create_request', requestId: reqRef.id, actor: d.guardianId,
          timestamp: serverTimestamp(),
        });
        return { id: reqRef.id, requestNumber: nextNum };
      });
      state.lastRequest = { ...d, reason, win, requestNumber: result.requestNumber, id: result.id, status:'pending' };
    }else{
      const openDup = Object.values(LOCAL.requests).some(r=>
        r.studentName===d.studentName && r.grade===d.grade && r.section===d.section && r.status==='pending');
      if(openDup) throw new Error('duplicate-open-request');
      LOCAL.seq += 1;
      const id = uid('req');
      LOCAL.requests[id] = {
        id, requestNumber: LOCAL.seq, studentName:d.studentName, grade:d.grade, section:d.section,
        guardianName: d.guardianName, guardianId: d.guardianId,
        reason: reason.id, reasonLabel: reason.label, reasonNote: d.reasonNote||'', arrivalWindow: win.label,
        status:'pending', createdAt: new Date(),
      };
      state.lastRequest = { ...LOCAL.requests[id] };
    }
    toast('تم إرسال طلبك.');
    go('leaveSuccess');
  }catch(e){
    if(e.message === 'duplicate-open-request'){
      toast('يوجد طلب استئذان قيد المراجعة بالفعل لهذا الطالب.', 'warn');
      go('home');
    }else{
      console.error(e);
      toast('تعذر إرسال الطلب، حاول مرة أخرى.', 'err');
    }
  }finally{
    state.submitting = false;
  }
}

async function findRequestByNumber(num){
  if(firebaseReady){
    try{
      const q = query(collection(db,'leaveRequests'), where('requestNumber','==', num), limit(1));
      const snap = await getDocs(q);
      if(!snap.empty) return { id:snap.docs[0].id, ...snap.docs[0].data() };
      return null;
    }catch(e){ console.warn(e); return null; }
  }
  return Object.values(LOCAL.requests).find(r=>r.requestNumber===num) || null;
}

async function fetchAllRequests(){

    try{
      const q = query(collection(db,'leaveRequests'), orderBy('createdAt','desc'), limit(100));

      return snap.docs.map(d=>({id:d.id, ...d.data()}));

        </div>
        <div id="verify-slot"></div>
      </div>
      <div class="action-bar" id="actions"></div>
    </div>`);

  const actions = screen.querySelector('#actions');
  if(r.status === 'pending'){
    actions.innerHTML = `
      <button class="btn btn-danger" id="reject">رفض</button>
      <button class="btn btn-primary" id="approve">الموافقة</button>`;
    actions.querySelector('#approve').addEventListener('click', ()=> decideRequest(id, r, 'approved'));
    actions.querySelector('#reject').addEventListener('click', ()=> decideRequest(id, r, 'rejected'));
  }else if(r.status === 'approved'){
    // Identity verification at pickup: match the national ID entered when
    // the request was submitted against the physical ID card presented.
    const verifySlot = screen.querySelector('#verify-slot');
    verifySlot.appendChild(el(`
      <div class="verify-box">
        <div class="field" style="margin-bottom:10px;">
          <label>أدخل رقم الهوية الظاهر على بطاقة المستلم للتحقق</label>
          <input type="text" id="checkId" inputmode="numeric" maxlength="10" style="direction:ltr;" placeholder="10 أرقام">
        </div>
        <button class="btn btn-outline btn-sm" id="checkBtn">تحقق من المطابقة</button>
        <div id="verifyResult"></div>
      </div>`));
    verifySlot.querySelector('#checkId').addEventListener('input', (e)=>{
      e.target.value = e.target.value.replace(/\D/g,'').slice(0,10);
    });
    verifySlot.querySelector('#checkBtn').addEventListener('click', ()=>{
      const typed = verifySlot.querySelector('#checkId').value.trim();
      const resBox = verifySlot.querySelector('#verifyResult');
      resBox.innerHTML = '';
      if(typed.length !== 10){ toast('أدخل رقم هوية مكوّن من 10 أرقام.', 'warn'); return; }
      const verified = (typed === r.guardianId);
      resBox.appendChild(el(verified
        ? `<div class="verify-result verify-match">✅ الرقم مطابق لبيانات الطلب</div>`
        : `<div class="verify-result verify-mismatch">⚠️ الرقم غير مطابق لبيانات الطلب — لا يمكن التسليم</div>`));
      deliverBtn.disabled = !verified;
    });

    actions.innerHTML = `<button class="btn btn-primary" id="deliver" disabled>تم تسليم الطالب</button>`;
    const deliverBtn = actions.querySelector('#deliver');
    deliverBtn.addEventListener('click', ()=> deliverStudent(id, r));
  }else{
    actions.remove();
  }
  root.appendChild(screen);
}

async function decideRequest(id, r, decision){
  try{
    if(firebaseReady){
      await updateDoc(doc(db,'leaveRequests', id), {
        status: decision, decidedAt: serverTimestamp(), decidedBy: state.staff.id,
      });
      await addDoc(collection(db,'auditLogs'), {
        action: decision==='approved'?'approve_request':'reject_request', requestId:id,
        actor: state.staff.id, timestamp: serverTimestamp(),
      });
    }else{
      LOCAL.requests[id].status = decision;
    }
    toast(decision==='approved' ? 'تمت الموافقة على الطلب.' : 'تم رفض الطلب.');
    go('staffDashboard');
  }catch(e){ console.error(e); toast('تعذر تنفيذ الإجراء.', 'err'); }
}

async function deliverStudent(id, r){
  try{
    if(firebaseReady){
      await runTransaction(db, async (tx)=>{
        const reqRef = doc(db,'leaveRequests', id);
        const reqSnap = await tx.get(reqRef);
        if(reqSnap.data().status !== 'approved') throw new Error('not-approved');
        tx.update(reqRef, { status:'delivered', deliveredAt: serverTimestamp(), deliveredBy: state.staff.id });
      });
      await addDoc(collection(db,'auditLogs'), { action:'deliver_student', requestId:id, actor:state.staff.id, timestamp:serverTimestamp() });
    }else{
      LOCAL.requests[id].status = 'delivered';
    }
    toast('تم تسجيل استلام الطالب بنجاح.', 'ok');
    go('staffDashboard');
  }catch(e){ console.error(e); toast('تعذر تسجيل التسليم.', 'err'); }
