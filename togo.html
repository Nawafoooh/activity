<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>استئذان الطالب</title>
<meta name="description" content="منصة رقمية لإدارة طلبات استئذان الطلاب بين ولي الأمر والمدرسة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =====================================================
   استئذان الطالب — Design tokens
   الأخضر السعودي الحديث + خلفية بيضاء + رمادي هادئ
   ===================================================== */
:root{
  --green-900:#0B4A38;
  --green-700:#0E6B4F;
  --green-600:#128A62;
  --green-100:#E4F3EC;
  --green-050:#F3FAF7;

  --ink-900:#14201C;
  --ink-700:#3C4A45;
  --ink-500:#6B7873;
  --ink-300:#A6AFAB;
  --ink-100:#E4E8E6;

  --white:#FFFFFF;
  --bg:#F7F9F8;

  --amber-600:#B9740A;
  --amber-100:#FBEBD2;
  --red-600:#C23B33;
  --red-100:#FBE4E2;
  --blue-600:#245FA6;
  --blue-100:#E3ECFA;

  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --radius-pill:999px;

  --shadow-1: 0 1px 2px rgba(20,32,28,.06), 0 1px 1px rgba(20,32,28,.04);
  --shadow-2: 0 8px 24px rgba(11,74,56,.10);

  --tap:52px;
  --maxw:480px;

  --font: 'IBM Plex Sans Arabic', 'Tajawal', sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- Shell ---------- */
#app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100vh;
  background:var(--white);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow: var(--shadow-2);
}
@media (min-width:520px){
  body{ background: linear-gradient(180deg,var(--green-050),var(--bg) 240px); }
  #app{ margin-top:24px; min-height:calc(100vh - 48px); border-radius:24px; overflow:hidden; }
}

.screen{ display:flex; flex-direction:column; flex:1; animation:fadeIn .22s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.scroll{ flex:1; overflow-y:auto; padding:20px 20px 28px; }

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; gap:12px;
  padding:16px 16px;
  background:var(--white);
  border-bottom:1px solid var(--ink-100);
  position:sticky; top:0; z-index:5;
}
.topbar .back{
  width:40px; height:40px; border-radius:var(--radius-pill);
  border:none; background:var(--green-050); color:var(--green-700);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:18px; flex-shrink:0;
}
.topbar .back:active{ background:var(--green-100); }
.topbar h1{ font-size:17px; font-weight:600; margin:0; color:var(--ink-900); }
.topbar .sub{ font-size:12px; color:var(--ink-500); margin-top:1px; }

/* ---------- Buttons ---------- */
.btn{
  width:100%; min-height:var(--tap);
  border-radius:var(--radius-md);
  border:none;
  font-size:16px; font-weight:600;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .08s ease, background .15s ease, opacity .15s ease;
}
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-primary{ background:var(--green-700); color:var(--white); }
.btn-primary:not(:disabled):hover{ background:var(--green-900); }
.btn-outline{ background:var(--white); color:var(--green-700); border:1.5px solid var(--green-700); }
.btn-ghost{ background:transparent; color:var(--ink-700); }
.btn-danger{ background:var(--white); color:var(--red-600); border:1.5px solid var(--red-600); }
.btn-danger-solid{ background:var(--red-600); color:var(--white); }
.btn-sm{ min-height:40px; font-size:14px; padding:0 14px; width:auto; }

/* ---------- Cards ---------- */
.card{
  background:var(--white);
  border:1px solid var(--ink-100);
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow-1);
}
.card + .card{ margin-top:12px; }

/* ---------- Inputs ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13px; color:var(--ink-700); margin-bottom:6px; font-weight:600; }
.field input, .field textarea{
  width:100%; min-height:var(--tap);
  border:1.5px solid var(--ink-100); border-radius:var(--radius-md);
  padding:0 16px; font-size:16px; color:var(--ink-900);
  background:var(--white);
  outline:none;
}
.field textarea{ padding:12px 16px; min-height:80px; resize:vertical; }
.field input:focus, .field textarea:focus{ border-color:var(--green-600); }
.field .hint{ font-size:12px; color:var(--ink-500); margin-top:6px; }

/* OTP boxes */
.otp-row{ display:flex; gap:10px; justify-content:center; direction:ltr; margin:8px 0 4px; }
.otp-row input{
  width:46px; height:56px; text-align:center; font-size:22px; font-weight:700;
  border:1.5px solid var(--ink-100); border-radius:var(--radius-sm);
}
.otp-row input:focus{ border-color:var(--green-600); outline:none; }

/* ---------- Choice chips ---------- */
.chip-grid{ display:flex; flex-wrap:wrap; gap:10px; }
.chip{
  border:1.5px solid var(--ink-100); background:var(--white); color:var(--ink-900);
  border-radius:var(--radius-md); padding:12px 16px; font-size:15px; font-weight:500;
  cursor:pointer; display:flex; align-items:center; gap:8px; min-height:48px;
  flex:1 1 calc(50% - 5px);
  justify-content:center;
  transition:border-color .12s ease, background .12s ease;
}
.chip.selected{ border-color:var(--green-700); background:var(--green-050); color:var(--green-900); font-weight:600; }
.chip .ico{ font-size:18px; }

/* ---------- Student card ---------- */
.student-card{
  display:flex; align-items:center; gap:14px;
  background:var(--white); border:1px solid var(--ink-100); border-radius:var(--radius-lg);
  padding:14px; box-shadow:var(--shadow-1);
}
.student-card + .student-card{ margin-top:12px; }
.avatar{
  width:48px; height:48px; border-radius:var(--radius-pill);
  background:var(--green-100); color:var(--green-900);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:17px; flex-shrink:0;
}
.student-info{ flex:1; min-width:0; }
.student-info .name{ font-weight:700; font-size:16px; }
.student-info .meta{ font-size:13px; color:var(--ink-500); margin-top:2px; }
.status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-inline-end:5px; }
.dot-present{ background:var(--green-600); }
.dot-out{ background:var(--ink-300); }

/* ---------- Status badge ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:600; padding:6px 12px; border-radius:var(--radius-pill);
}
.badge-pending{ background:var(--amber-100); color:var(--amber-600); }
.badge-approved{ background:var(--green-100); color:var(--green-700); }
.badge-rejected{ background:var(--red-100); color:var(--red-600); }
.badge-delivered{ background:var(--blue-100); color:var(--blue-600); }
.badge-cancelled{ background:var(--ink-100); color:var(--ink-500); }

/* ---------- Home hero ---------- */
.hero{
  padding:52px 24px 28px;
  text-align:center;
  background:
    radial-gradient(120% 100% at 50% -10%, var(--green-100) 0%, var(--green-050) 42%, var(--white) 78%);
  position:relative;
  overflow:hidden;
}
.hero .motif{ position:absolute; inset:0; opacity:.5; pointer-events:none; }
.logo-mark{
  width:76px; height:76px; margin:0 auto 18px; border-radius:22px;
  background:var(--green-700);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-2);
  position:relative; z-index:1;
}
.hero h1{ font-size:26px; margin:0 0 8px; color:var(--ink-900); position:relative; z-index:1; }
.hero p{ font-size:15px; color:var(--ink-700); margin:0; line-height:1.7; position:relative; z-index:1; }

.home-actions{ padding:20px 20px 8px; display:flex; flex-direction:column; gap:12px; }
.role-btn{
  display:flex; align-items:center; gap:14px; width:100%;
  padding:16px; border-radius:var(--radius-lg);
  border:1.5px solid var(--ink-100); background:var(--white);
  cursor:pointer; text-align:start;
  min-height:64px;
}
.role-btn:active{ background:var(--green-050); }
.role-btn .ricon{
  width:44px; height:44px; border-radius:var(--radius-md); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:20px;
  background:var(--green-050); color:var(--green-700);
}
.role-btn .rtext strong{ display:block; font-size:15px; }
.role-btn .rtext span{ display:block; font-size:12.5px; color:var(--ink-500); margin-top:2px; }
.role-btn .rarrow{ margin-inline-start:auto; color:var(--ink-300); }

.foot-note{ text-align:center; font-size:12px; color:var(--ink-300); padding:24px 16px; margin-top:auto; }

/* ---------- Summary rows ---------- */
.summary-row{ display:flex; justify-content:space-between; padding:10px 0; font-size:14.5px; border-bottom:1px solid var(--ink-100); }
.summary-row:last-child{ border-bottom:none; }
.summary-row .k{ color:var(--ink-500); }
.summary-row .v{ font-weight:600; color:var(--ink-900); }

/* ---------- Success screen ---------- */
.result-hero{ text-align:center; padding:40px 24px 20px; }
.result-icon{
  width:84px; height:84px; border-radius:50%; margin:0 auto 18px;
  display:flex; align-items:center; justify-content:center; font-size:38px;
}
.ri-success{ background:var(--green-100); color:var(--green-700); }
.ri-pending{ background:var(--amber-100); color:var(--amber-600); }
.ri-rejected{ background:var(--red-100); color:var(--red-600); }
.result-hero h2{ font-size:20px; margin:0 0 6px; }
.result-hero p{ font-size:14px; color:var(--ink-500); margin:0; }
.req-number{ font-size:28px; font-weight:700; letter-spacing:1px; color:var(--green-900); margin:14px 0 4px; direction:ltr; }

.qr-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 0 6px; }
.qr-box{ width:180px; height:180px; background:var(--white); border:1px solid var(--ink-100); border-radius:var(--radius-md); padding:10px; }

/* ---------- Toast ---------- */
#toast-host{ position:fixed; inset-inline:0; bottom:16px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:999; pointer-events:none; }
.toast{
  background:var(--ink-900); color:var(--white); padding:12px 18px; border-radius:var(--radius-pill);
  font-size:13.5px; box-shadow:var(--shadow-2); max-width:88%; text-align:center;
  animation:toastIn .18s ease;
}
.toast.warn{ background:var(--amber-600); }
.toast.err{ background:var(--red-600); }
@keyframes toastIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

/* ---------- Empty state ---------- */
.empty{ text-align:center; padding:48px 20px; color:var(--ink-500); }
.empty .eicon{ font-size:34px; margin-bottom:10px; }
.empty p{ font-size:14px; margin:0; }

/* ---------- Staff stat grid ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:16px 20px 4px; }
.stat-card{ background:var(--white); border:1px solid var(--ink-100); border-radius:var(--radius-md); padding:14px; }
.stat-card .num{ font-size:24px; font-weight:700; }
.stat-card .lbl{ font-size:12.5px; color:var(--ink-500); margin-top:2px; }
.stat-card.c-new .num{ color:var(--amber-600); }
.stat-card.c-approved .num{ color:var(--green-700); }
.stat-card.c-delivered .num{ color:var(--blue-600); }
.stat-card.c-rejected .num{ color:var(--red-600); }

/* ---------- Section title ---------- */
.section-title{ font-size:14px; font-weight:700; color:var(--ink-700); margin:22px 0 10px; }
.scroll .section-title:first-child{ margin-top:0; }

/* ---------- Request list item (staff) ---------- */
.req-item{ padding:14px; border:1px solid var(--ink-100); border-radius:var(--radius-lg); background:var(--white); cursor:pointer; box-shadow:var(--shadow-1); }
.req-item + .req-item{ margin-top:10px; }
.req-item .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.req-item .name{ font-weight:700; font-size:15.5px; }
.req-item .meta{ font-size:12.5px; color:var(--ink-500); margin-top:3px; }
.req-item .reason{ font-size:13px; color:var(--ink-700); margin-top:8px; }

/* ---------- Detail block ---------- */
.detail-grid .summary-row .v{ text-align:end; }
.masked{ direction:ltr; display:inline-block; }

.action-bar{ display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--ink-100); background:var(--white); position:sticky; bottom:0; }

/* ---------- Bottom sheet-ish modal ---------- */
.overlay{ position:fixed; inset:0; background:rgba(20,32,28,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.overlay .sheet{ background:var(--white); width:100%; max-width:var(--maxw); border-radius:20px 20px 0 0; padding:20px; animation:sheetUp .18s ease; }
@keyframes sheetUp{ from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet h3{ margin:0 0 12px; font-size:16px; }

/* ---------- Login segmented ---------- */
.seg{ display:flex; background:var(--ink-100); border-radius:var(--radius-pill); padding:4px; margin-bottom:20px; }
.seg button{ flex:1; border:none; background:transparent; padding:9px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600; color:var(--ink-500); cursor:pointer; }
.seg button.active{ background:var(--white); color:var(--green-900); box-shadow:var(--shadow-1); }

.tel-input{ display:flex; align-items:center; border:1.5px solid var(--ink-100); border-radius:var(--radius-md); overflow:hidden; }
.tel-input .cc{ padding:0 14px; background:var(--green-050); color:var(--green-900); font-weight:600; height:var(--tap); display:flex; align-items:center; direction:ltr; }
.tel-input input{ border:none; height:var(--tap); flex:1; padding:0 12px; font-size:16px; direction:ltr; text-align:right; }
.tel-input input:focus{ outline:none; }

.link-btn{ background:none; border:none; color:var(--green-700); font-weight:600; font-size:13.5px; cursor:pointer; padding:8px; }

#recaptcha-container{ display:none; }

.small-note{ font-size:12px; color:var(--ink-500); text-align:center; line-height:1.7; padding:0 8px; }
</style>
</head>

<script type="module">
/* =====================================================================
   استئذان الطالب — Student Leave Request Platform
   Single Page Application — HTML5 / CSS3 / JavaScript (ES Modules)
   Backend: Firebase (Auth + Firestore)
   =====================================================================

   NOTE ON PHONE AUTH (OTP):
   Real SMS one-time codes require Firebase Phone Authentication, which
   needs the Blaze billing plan + an App Check / reCAPTCHA setup on the

   (signInWithPhoneNumber + invisible RecaptchaVerifier). If phone auth
   is not enabled yet on the Firebase project, the app automatically
   falls back to a clearly-labeled DEMO OTP mode (a 6-digit code is
   generated locally and shown in a toast) so the flow can still be
   tested end-to-end before phone auth is turned on in production.
   ===================================================================== */

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

  query, where, orderBy, onSnapshot, serverTimestamp, runTransaction, limit
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  getAuth, RecaptchaVerifier, signInWithPhoneNumber,
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ---------------------------------------------------------------------
// Firebase configuration
// ---------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDxKQY8jxZwJz5YOjRQvLq7Mb2NxQvRq1s",
  authDomain: "nawafalsubhi3-f4abf.firebaseapp.com",
  projectId: "nawafalsubhi3-f4abf",
  storageBucket: "nawafalsubhi3-f4abf.firebasestorage.app",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456ghi789jkl"
};

let app, db, auth, firebaseReady = false;
try{
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
  firebaseReady = true;
}catch(e){
  console.warn('Firebase init failed — running in local demo-data mode.', e);
  firebaseReady = false;

// ---------------------------------------------------------------------
// In-memory session state (never persisted to localStorage/sessionStorage
// inside this client — real deployments should rely on Firebase Auth's
// own session persistence, not raw browser storage APIs).
// ---------------------------------------------------------------------
const state = {
  route: 'home',
  params: {},
  // parent session
  parent: null,          // {id, name, phone}
  confirmationResult: null,
  demoOtp: null,
  pendingPhone: null,

  staff: null,           // {id, name, role}

  children: [],

  submitting: false,

const REASONS = [
  { id:'medical',   label:'موعد طبي',    icon:'🩺' },
  { id:'family',    label:'ظرف عائلي',   icon:'🏠' },
  { id:'official',  label:'موعد رسمي',   icon:'📄' },
  { id:'emergency', label:'حالة طارئة',  icon:'⚠️' },

];
const STATUS_META = {
  pending:   { label:'قيد المراجعة',      dot:'🟡', badge:'badge-pending' },
  approved:  { label:'تمت الموافقة',      dot:'🟢', badge:'badge-approved' },
  rejected:  { label:'مرفوض',             dot:'🔴', badge:'badge-rejected' },
  delivered: { label:'تم استلام الطالب',  dot:'🔵', badge:'badge-delivered' },
  cancelled: { label:'ملغي',              dot:'⚫', badge:'badge-cancelled' },
};

// ---------------------------------------------------------------------
// Local demo-data fallback (used only if Firestore is unreachable, e.g.
// while previewing this file offline). Mirrors the real collections.
// ---------------------------------------------------------------------
const LOCAL = {
  parents: { 'parent-demo': { id:'parent-demo', name:'محمد أحمد', phone:'+966501234567' } },
  students: {
    'st-1': { id:'st-1', name:'أحمد محمد', grade:'ثاني متوسط — 3', parentId:'parent-demo', status:'present' },
    'st-2': { id:'st-2', name:'خالد محمد', grade:'أول متوسط — 5', parentId:'parent-demo', status:'present' },
  },

  requests: {},

};

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

// =====================================================================
// Router
// =====================================================================
function go(route, params={}){
  state.route = route;
  state.params = params;
  render();
  const scroller = document.querySelector('.scroll');
  if(scroller) scroller.scrollTop = 0;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const map = {
    home: renderHome,
    parentPhone: renderParentPhone,
    parentOtp: renderParentOtp,
    parentDashboard: renderParentDashboard,
    leaveForm: renderLeaveForm,
    leaveSummary: renderLeaveSummary,
    leaveSuccess: renderLeaveSuccess,
    parentHistory: renderParentHistory,
    parentRequestDetail: renderParentRequestDetail,
    staffLogin: renderStaffLogin,
    staffDashboard: renderStaffDashboard,
    staffRequestDetail: renderStaffRequestDetail,
    gateVerify: renderGateVerify,
  };
  (map[state.route] || renderHome)(app);
}

function toast(msg, type=''){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function topbar(title, sub, onBack){
  const bar = el(`
    <div class="topbar">
      ${onBack ? `<button class="back" aria-label="رجوع">→</button>` : `<div style="width:40px"></div>`}
      <div>
        <h1>${title}</h1>
        ${sub ? `<div class="sub">${sub}</div>` : ''}
      </div>
    </div>`);
  if(onBack) bar.querySelector('.back').addEventListener('click', onBack);
  return bar;
}

// =====================================================================
// Screen: Home
// =====================================================================
function renderHome(root){
  const screen = el(`
    <div class="screen">
      <div class="hero">
        <div class="logo-mark">

async function sendOtp(fullPhone){
  state.pendingPhone = fullPhone;
  if(firebaseReady){
    try{
      if(!window.__recaptchaVerifier){
        window.__recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size:'invisible' });
      }
      const confirmation = await signInWithPhoneNumber(auth, fullPhone, window.__recaptchaVerifier);
      state.confirmationResult = confirmation;
      state.demoOtp = null;
      toast('تم إرسال رمز التحقق عبر رسالة نصية.');
      go('parentOtp');
      return;
    }catch(e){
      console.warn('Phone auth unavailable, switching to demo OTP mode.', e);
    }
  }
  // Demo fallback — clearly labeled, for environments without live phone auth.
  state.confirmationResult = null;
  state.demoOtp = String(Math.floor(100000 + Math.random()*900000));
  toast('وضع تجريبي: رمز التحقق هو ' + state.demoOtp, 'warn');
  go('parentOtp');
}

function renderParentOtp(root){
  const screen = el(`
    <div class="screen">
      ${topbar('رمز التحقق','خطوة 2 من 2', ()=>go('parentPhone')).outerHTML}
      <div class="scroll">
        <p class="small-note" style="margin-bottom:18px;">أدخل الرمز المرسل إلى<br><strong style="direction:ltr;display:inline-block;color:var(--ink-900)">${state.pendingPhone||''}</strong></p>
        <div class="otp-row">
          ${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" data-i="${i}">`).join('')}
        </div>
        ${state.demoOtp ? `<p class="small-note" style="color:var(--amber-600)">وضع تجريبي — الرمز الحالي: ${state.demoOtp}</p>` : ''}
        <button class="btn btn-primary" id="verify" style="margin-top:20px;">تأكيد الرمز</button>
        <button class="link-btn" id="resend" style="display:block;margin:14px auto 0;">إعادة إرسال الرمز</button>
      </div>
    </div>`);
  root.appendChild(screen);

  const boxes = [...screen.querySelectorAll('.otp-row input')];
  boxes[0].focus();
  boxes.forEach((b,idx)=>{
    b.addEventListener('input', ()=>{
      b.value = b.value.replace(/\D/g,'');
      if(b.value && idx < boxes.length-1) boxes[idx+1].focus();
    });
    b.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !b.value && idx>0) boxes[idx-1].focus();
    });
  });

  screen.querySelector('#resend').addEventListener('click', ()=> sendOtp(state.pendingPhone));

  screen.querySelector('#verify').addEventListener('click', async ()=>{
    const code = boxes.map(b=>b.value).join('');
    if(code.length !== 6){ toast('أدخل الرمز المكوّن من 6 أرقام.', 'warn'); return; }
    const btn = screen.querySelector('#verify');
    btn.disabled = true; btn.textContent = 'جارٍ التحقق…';
    try{
      let uidResolved = null;
      if(state.confirmationResult){
        const cred = await state.confirmationResult.confirm(code);
        uidResolved = cred.user.uid;
      }else if(state.demoOtp){
        if(code !== state.demoOtp) throw new Error('bad-code');
        uidResolved = 'demo-' + state.pendingPhone;
      }
      await loadParentByPhone(state.pendingPhone, uidResolved);
      go('parentDashboard');
    }catch(e){
      toast('الرمز غير صحيح، حاول مرة أخرى.', 'err');
      boxes.forEach(b=>b.value='');
      boxes[0].focus();
    }finally{
      btn.disabled = false; btn.textContent = 'تأكيد الرمز';
    }
  });
}

async function loadParentByPhone(phone, authUid){
  if(firebaseReady){
    try{
      const q = query(collection(db,'parents'), where('phone','==',phone), limit(1));
      const snap = await getDocs(q);
      let parentDoc;
      if(!snap.empty){
        parentDoc = { id:snap.docs[0].id, ...snap.docs[0].data() };
      }else{
        const ref = await addDoc(collection(db,'parents'), { phone, authUid, name:'', createdAt: serverTimestamp() });
        parentDoc = { id:ref.id, phone, name:'' };
      }
      state.parent = parentDoc;
      const cq = query(collection(db,'students'), where('parentId','==',parentDoc.id));
      const csnap = await getDocs(cq);
      state.children = csnap.docs.map(d=>({id:d.id, ...d.data()}));
      return;
    }catch(e){ console.warn('Firestore lookup failed, using local demo data.', e); }
  }
  // local fallback
  const p = Object.values(LOCAL.parents).find(p=>p.phone===phone) || LOCAL.parents['parent-demo'];
  state.parent = p;
  state.children = Object.values(LOCAL.students).filter(s=>s.parentId===p.id);
}

async function submitLeaveRequest(){
  if(state.submitting) return; // prevent duplicate double-tap submits
  state.submitting = true;
  const d = state.requestDraft;
  const reason = REASONS.find(r=>r.id===d.reason);
  const win = WINDOWS.find(w=>w.id===d.windowId);

  try{
    if(firebaseReady){
      const result = await runTransaction(db, async (tx)=>{
        // Re-check student is still present (not already checked out) to
        // prevent a leave request for an absent/already-departed student,
        // and block duplicate open requests for the same student.
        const studentRef = doc(db,'students', d.student.id);
        const studentSnap = await tx.get(studentRef);
        const studentData = studentSnap.data();
        if(!studentData || studentData.status !== 'present'){
          throw new Error('student-not-present');
        }
        const dupQ = query(collection(db,'leaveRequests'),
          where('studentId','==', d.student.id), where('status','==','pending'));
        const dupSnap = await getDocs(dupQ);
        if(!dupSnap.empty){ throw new Error('duplicate-open-request'); }

        const counterRef = doc(db,'counters','leaveRequests');
        const counterSnap = await tx.get(counterRef);
        const nextNum = (counterSnap.exists() ? counterSnap.data().value : 10480) + 1;
        tx.set(counterRef, { value: nextNum }, { merge:true });

        const reqRef = doc(collection(db,'leaveRequests'));
        tx.set(reqRef, {
          requestNumber: nextNum,
          studentId: d.student.id,
          studentName: d.student.name,
          grade: d.student.grade,
          parentId: state.parent.id,
          parentName: state.parent.name || '',
          parentPhone: state.parent.phone || '',
          reason: reason.id,
          reasonLabel: reason.label,
          reasonNote: d.reasonNote || '',
          arrivalWindow: win.label,
          status: 'pending',
          createdAt: serverTimestamp(),
        });
        tx.set(doc(collection(db,'auditLogs')), {
          action:'create_request', requestId: reqRef.id, actor: state.parent.id,
          timestamp: serverTimestamp(),
        });
        return { id: reqRef.id, requestNumber: nextNum };
      });
      state.lastRequest = { ...d, reason, win, requestNumber: result.requestNumber, id: result.id, status:'pending' };
    }else{
      // local demo fallback
      const openDup = Object.values(LOCAL.requests).some(r=>r.studentId===d.student.id && r.status==='pending');
      if(openDup) throw new Error('duplicate-open-request');
      LOCAL.seq += 1;
      const id = uid('req');
      LOCAL.requests[id] = {
        id, requestNumber: LOCAL.seq, studentId:d.student.id, studentName:d.student.name, grade:d.student.grade,
        parentId: state.parent.id, parentName: state.parent.name||'محمد أحمد', parentPhone: state.parent.phone,
        reason: reason.id, reasonLabel: reason.label, reasonNote: d.reasonNote||'', arrivalWindow: win.label,
        status:'pending', createdAt: new Date(),
      };
      state.lastRequest = { ...LOCAL.requests[id] };
    }
    toast('تم إرسال طلبك.');
    go('leaveSuccess');
  }catch(e){
    if(e.message === 'duplicate-open-request'){
      toast('يوجد طلب استئذان قيد المراجعة بالفعل لهذا الطالب.', 'warn');
      go('parentDashboard');
    }else if(e.message === 'student-not-present'){
      toast('لا يمكن تقديم طلب استئذان لطالب غائب أو تم استلامه مسبقًا.', 'err');
      go('parentDashboard');
    }else{
      console.error(e);
      toast('تعذر إرسال الطلب، حاول مرة أخرى.', 'err');
    }
  }finally{
    state.submitting = false;
  }
}

// Minimal dependency-free QR-like placeholder renderer.
// Renders a scannable-looking modular grid encoding is out of scope for
// a offline demo file without a bundler; production should use a QR
// library (e.g. qrcode.js) loaded from the project's own asset pipeline.
function renderQr(container, text){
  container.innerHTML = '';
  const size = 21;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('width','100%'); svg.setAttribute('height','100%');
  let seed = 0; for(const ch of text) seed = (seed*31 + ch.charCodeAt(0)) >>> 0;
  function rand(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const inFinder = (x<7&&y<7)||(x>size-8&&y<7)||(x<7&&y>size-8);
      const on = inFinder ? finderPattern(x,y,size) : rand() > 0.55;
      if(on){
        const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
        rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',1); rect.setAttribute('height',1);
        rect.setAttribute('fill','#14201C');
        svg.appendChild(rect);
      }
    }
  }
  container.appendChild(svg);
}
function finderPattern(x,y,size){
  const local = (bx,by,lx,ly)=> lx>=bx&&lx<bx+7&&ly>=by&&ly<by+7;
  let ox=0, oy=0;
  if(x<7&&y<7){ ox=0; oy=0; } else if(x>size-8&&y<7){ ox=size-7; oy=0; } else { ox=0; oy=size-7; }
  const lx = x-ox, ly = y-oy;
  const border = lx===0||lx===6||ly===0||ly===6;
  const core = lx>=2&&lx<=4&&ly>=2&&ly<=4;
  return border||core;
}

function renderStaffLogin(root){
  const screen = el(`
    <div class="screen">
      ${topbar('دخول المدرسة', 'حساب الموظف', ()=>go('home')).outerHTML}
      <div class="scroll">
        <div class="field">
          <label>البريد الإلكتروني للموظف</label>
          <input type="email" id="email" placeholder="name@school.sa">
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" id="login">دخول</button>
        <p class="small-note" style="margin-top:16px;">حسابات الموظفين تُنشأ من قبل إدارة المدرسة عبر لوحة التحكم، ولا يوجد تسجيل ذاتي.</p>
      </div>
    </div>`);
  root.appendChild(screen);

  screen.querySelector('#login').addEventListener('click', async ()=>{
    const email = screen.querySelector('#email').value.trim();
    const pw = screen.querySelector('#password').value;
    if(!email || !pw){ toast('أدخل البريد الإلكتروني وكلمة المرور.', 'warn'); return; }
    const btn = screen.querySelector('#login');
    btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
    try{
      if(firebaseReady){
        const cred = await signInWithEmailAndPassword(auth, email, pw);
        const staffSnap = await getDoc(doc(db,'staff', cred.user.uid));
        state.staff = staffSnap.exists() ? { id:cred.user.uid, ...staffSnap.data() } : { id:cred.user.uid, name: email, role:'staff' };
      }else{
        state.staff = LOCAL.staff['staff-demo'];
      }
      go('staffDashboard');
    }catch(e){
      console.warn(e);
      toast('تعذر تسجيل الدخول، تحقق من البيانات.', 'err');
    }finally{
      btn.disabled = false; btn.textContent = 'دخول';
    }
  });
}

async function fetchTodayRequests(){
  if(firebaseReady){
    try{
      const start = new Date(); start.setHours(0,0,0,0);
      const q = query(collection(db,'leaveRequests'), orderBy('createdAt','desc'), limit(100));
      const snap = await getDocs(q);
      return snap.docs.map(d=>({id:d.id, ...d.data()}));
    }catch(e){ console.warn(e); }
  }
  return Object.values(LOCAL.requests).sort((a,b)=>(b.createdAt?.getTime?.()||0)-(a.createdAt?.getTime?.()||0));
}

function renderStaffDashboard(root){
  const screen = el(`
    <div class="screen">
      ${topbar('طلبات الاستئذان اليوم', state.staff?.name||'', null).outerHTML}
      <div class="scroll" id="staff-body">

      </div>
    </div>`);

  fetchTodayRequests().then(list=>{
    state.requestsCache = list;
    const body = screen.querySelector('#staff-body');
    body.innerHTML = '';

    const counts = { pending:0, approved:0, delivered:0, rejected:0 };
    list.forEach(r=>{ if(counts[r.status]!==undefined) counts[r.status]++; });

    body.appendChild(el(`
      <div class="stat-grid" style="padding:0 0 4px;">
        <div class="stat-card c-new"><div class="num">${counts.pending}</div><div class="lbl">الطلبات الجديدة</div></div>
        <div class="stat-card c-approved"><div class="num">${counts.approved}</div><div class="lbl">تمت الموافقة</div></div>
        <div class="stat-card c-delivered"><div class="num">${counts.delivered}</div><div class="lbl">تم الاستلام</div></div>
        <div class="stat-card c-rejected"><div class="num">${counts.rejected}</div><div class="lbl">المرفوضة</div></div>
      </div>`));

    body.appendChild(el(`
      <button class="role-btn" id="btn-gate" style="margin:18px 0;">
        <span class="ricon">🔳</span>
        <span class="rtext"><strong>التحقق عند البوابة</strong><span>مسح رمز أو إدخال رقم الطلب</span></span>
        <span class="rarrow">‹</span>
      </button>`));
    body.querySelector('#btn-gate').addEventListener('click', ()=> go('gateVerify'));

    body.appendChild(el(`<div class="section-title">الطلبات الحالية</div>`));
    if(!list.length){
      body.appendChild(el(`<div class="empty"><div class="eicon">📭</div><p>لا توجد طلبات حتى الآن.</p></div>`));
    }
    list.forEach(r=>{
      const meta = STATUS_META[r.status] || STATUS_META.pending;
      const item = el(`
        <div class="req-item">
          <div class="top">
            <div>
              <div class="name">${r.studentName} <span style="color:var(--ink-500); font-weight:500; font-size:12.5px;">— ${r.grade}</span></div>
              <div class="meta">ولي الأمر: ${r.parentName||'—'} • ${formatDate(r.createdAt)}</div>
            </div>
            <span class="badge ${meta.badge}">${meta.dot} ${meta.label}</span>
          </div>
          <div class="reason">${r.reasonLabel} • الحضور المتوقع: ${r.arrivalWindow}</div>
        </div>`);
      item.addEventListener('click', ()=> go('staffRequestDetail', {id:r.id, local:r}));
      body.appendChild(item);
    });

    body.appendChild(el(`<button class="btn btn-ghost" id="staff-logout" style="margin-top:20px;">تسجيل الخروج</button>`));
    body.querySelector('#staff-logout').addEventListener('click', ()=>{
      state.staff = null;
      if(firebaseReady) signOut(auth).catch(()=>{});
      go('home');
    });
  });
}

// =====================================================================
// Staff request detail — approve / reject / clarify / deliver
// =====================================================================
function renderStaffRequestDetail(root){
  const { id, local } = state.params;
  const r = local;
  const meta = STATUS_META[r.status] || STATUS_META.pending;
  const maskedPhone = r.parentPhone ? r.parentPhone.replace(/(\+9665)\d{3}(\d{3})/, '$1***$2') : '—';

  const screen = el(`
    <div class="screen">
      ${topbar('تفاصيل الطلب', '#'+r.requestNumber, ()=>go('staffDashboard')).outerHTML}
      <div class="scroll">
        <div class="card detail-grid">
          <div class="summary-row"><span class="k">الحالة</span><span class="v"><span class="badge ${meta.badge}">${meta.dot} ${meta.label}</span></span></div>
          <div class="summary-row"><span class="k">الطالب</span><span class="v">${r.studentName}</span></div>
          <div class="summary-row"><span class="k">الصف والفصل</span><span class="v">${r.grade}</span></div>
          <div class="summary-row"><span class="k">ولي الأمر</span><span class="v">${r.parentName||'—'}</span></div>
          <div class="summary-row"><span class="k">رقم الجوال</span><span class="v masked">${maskedPhone}</span></div>
          <div class="summary-row"><span class="k">سبب الاستئذان</span><span class="v">${r.reasonLabel}${r.reasonNote? ' — '+escapeHtml(r.reasonNote):''}</span></div>
          <div class="summary-row"><span class="k">وقت تقديم الطلب</span><span class="v">${formatDate(r.createdAt)}</span></div>
          <div class="summary-row"><span class="k">وقت الحضور المتوقع</span><span class="v">${r.arrivalWindow}</span></div>
        </div>
      </div>
      <div class="action-bar" id="actions"></div>
    </div>`);

  const actions = screen.querySelector('#actions');
  if(r.status === 'pending'){
    actions.innerHTML = `
      <button class="btn btn-danger" id="reject">رفض</button>
      <button class="btn btn-primary" id="approve">الموافقة</button>`;
    actions.querySelector('#approve').addEventListener('click', ()=> decideRequest(id, r, 'approved'));
    actions.querySelector('#reject').addEventListener('click', ()=> decideRequest(id, r, 'rejected'));
  }else if(r.status === 'approved'){
    actions.innerHTML = `<button class="btn btn-primary" id="deliver">تم تسليم الطالب</button>`;
    actions.querySelector('#deliver').addEventListener('click', ()=> deliverStudent(id, r));
  }else{
    actions.remove();
  }
  root.appendChild(screen);
}

async function decideRequest(id, r, decision){
  try{
    if(firebaseReady){
      await updateDoc(doc(db,'leaveRequests', id), {
        status: decision, decidedAt: serverTimestamp(), decidedBy: state.staff.id,
      });
      await addDoc(collection(db,'auditLogs'), {
        action: decision==='approved'?'approve_request':'reject_request', requestId:id,
        actor: state.staff.id, timestamp: serverTimestamp(),
      });
    }else{
      LOCAL.requests[id].status = decision;
    }
    toast(decision==='approved' ? 'تمت الموافقة على الطلب.' : 'تم رفض الطلب.');
    go('staffDashboard');
  }catch(e){ console.error(e); toast('تعذر تنفيذ الإجراء.', 'err'); }
}

async function deliverStudent(id, r){
  try{
    if(firebaseReady){
      await runTransaction(db, async (tx)=>{
        const reqRef = doc(db,'leaveRequests', id);
        const reqSnap = await tx.get(reqRef);
        if(reqSnap.data().status !== 'approved') throw new Error('not-approved');
        tx.update(reqRef, { status:'delivered', deliveredAt: serverTimestamp(), deliveredBy: state.staff.id });
        tx.update(doc(db,'students', r.studentId), { status:'checked_out' });
      });
      await addDoc(collection(db,'auditLogs'), { action:'deliver_student', requestId:id, actor:state.staff.id, timestamp:serverTimestamp() });
    }else{
      LOCAL.requests[id].status = 'delivered';
      if(LOCAL.students[r.studentId]) LOCAL.students[r.studentId].status = 'checked_out';
    }
    toast('تم تسجيل استلام الطالب بنجاح.');
    go('staffDashboard');
  }catch(e){ console.error(e); toast('تعذر تسجيل التسليم.', 'err'); }
}

// =====================================================================
// Gate verification
// =====================================================================
function renderGateVerify(root){
  const screen = el(`
    <div class="screen">
      ${topbar('التحقق عند البوابة', null, ()=>go('staffDashboard')).outerHTML}
      <div class="scroll">
        <div class="field">
          <label>رقم الطلب</label>
          <input type="text" id="reqnum" inputmode="numeric" placeholder="مثال: 10482" style="direction:ltr;">
        </div>
        <button class="btn btn-outline" id="lookup">بحث</button>
        <p class="small-note" style="margin-top:14px;">يمكن أيضًا مسح رمز QR الظاهر لدى ولي الأمر باستخدام قارئ الجوال، ثم إدخال رقم الطلب هنا للتأكيد اليدوي.</p>
        <div id="result" style="margin-top:18px;"></div>
      </div>
    </div>`);
  root.appendChild(screen);

  screen.querySelector('#lookup').addEventListener('click', async ()=>{
    const num = parseInt(screen.querySelector('#reqnum').value.replace('REQ:',''), 10);
    const box = screen.querySelector('#result');
    box.innerHTML = '';
    if(!num){ toast('أدخل رقم طلب صحيح.', 'warn'); return; }
    let r = null;
    if(firebaseReady){
      try{
        const q = query(collection(db,'leaveRequests'), where('requestNumber','==', num), limit(1));
        const snap = await getDocs(q);
        if(!snap.empty) r = { id:snap.docs[0].id, ...snap.docs[0].data() };
      }catch(e){ console.warn(e); }
    }else{
      r = Object.values(LOCAL.requests).find(x=>x.requestNumber===num) || null;
    }
    if(!r){ toast('لم يتم العثور على الطلب.', 'err'); return; }
    const meta = STATUS_META[r.status] || STATUS_META.pending;
    const card = el(`
      <div class="card">
        <div class="summary-row"><span class="k">الطالب</span><span class="v">${r.studentName}</span></div>
        <div class="summary-row"><span class="k">الصف</span><span class="v">${r.grade}</span></div>
        <div class="summary-row"><span class="k">ولي الأمر</span><span class="v">${r.parentName||'—'}</span></div>
        <div class="summary-row"><span class="k">رقم الطلب</span><span class="v">#${r.requestNumber}</span></div>
        <div class="summary-row"><span class="k">الحالة</span><span class="v"><span class="badge ${meta.badge}">${meta.dot} ${meta.label}</span></span></div>
      </div>`);
    box.appendChild(card);
    if(r.status === 'approved'){
      const btn = el(`<button class="btn btn-primary" style="margin-top:14px;">تسجيل تسليم الطالب</button>`);
      btn.addEventListener('click', async ()=>{
        await deliverStudent(r.id, r);
        screen.querySelector('#reqnum').value='';
        box.innerHTML = `<p class="small-note" style="color:var(--green-700); font-weight:600;">تم تسجيل استلام الطالب بنجاح.</p>`;
      });
      box.appendChild(btn);
    }else if(r.status === 'delivered'){
      box.appendChild(el(`<p class="small-note" style="color:var(--blue-600);">تم استلام هذا الطالب مسبقًا — لا حاجة لإجراء إضافي.</p>`));
    }else if(r.status !== 'approved'){
      box.appendChild(el(`<p class="small-note" style="color:var(--red-600);">لا يمكن تسليم الطالب قبل موافقة الإدارة على الطلب.</p>`));
    }
  });
}
