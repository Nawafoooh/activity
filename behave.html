<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>منصة الاستقصاء المهني للانضباط الصفي | متوسطة المنذر بن عمرو الأنصاري</title>
<style>
:root{--g:#00693E;--g2:#0A8F55;--gd:#04472b;--gold:#C9A24A;--bg:#F3F7F5;--card:#fff;--tx:#14231c;--mu:#5d6f66;--bd:#dbe5df;--bad:#B3261E;--ok:#0A8F55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--card:#16251e;--tx:#e8f1ec;--mu:#9bb0a5;--bd:#27403393;--g:#2bb57a;--gd:#0b3a27}}
:root[data-theme="dark"]{--bg:#0e1a15;--card:#16251e;--tx:#e8f1ec;--mu:#9bb0a5;--bd:#274033;--g:#2bb57a;--gd:#0b3a27}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8;font-size:15.5px;font-weight:400;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:inherit}
header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:18px 16px;border-bottom:4px solid var(--gold)}
.hw{max-width:1000px;margin:auto;display:flex;gap:14px;align-items:center}
.mark{width:54px;height:54px;border-radius:12px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:800;font-size:13px;text-align:center;line-height:1.2;flex:none}
header{box-shadow:0 4px 18px rgba(0,60,35,.25)}header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:0}header p{margin:3px 0 0;font-size:13px;font-weight:500;opacity:.92}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5;overflow-x:auto}
nav div{max-width:1000px;margin:auto;display:flex}
nav button{flex:1;min-width:92px;padding:14px 8px;border:0;background:none;color:var(--mu);font:inherit;font-size:15px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--g);font-weight:700;border-color:var(--g)}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(10,50,30,.05),0 6px 20px rgba(10,50,30,.05)}
h2{margin:0 0 12px;font-size:18px;font-weight:700;color:var(--g);padding-right:12px;border-right:4px solid var(--gold);line-height:1.4}h3{margin:16px 0 4px;font-size:15.5px;font-weight:600}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
label{display:block;font-size:13px;font-weight:500;color:var(--mu);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px}
.btn{padding:12px 20px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,80,45,.2)}.btn.s{box-shadow:none}
.btn.s{background:none;color:var(--g);border:1px solid var(--g)}.btn.d{background:var(--bad)}
.cnt{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 14px}
.cnt b{font-size:28px;min-width:40px;text-align:center}
.cnt button{width:46px;height:46px;border-radius:50%;border:0;font-size:24px;background:var(--g);color:#fff;cursor:pointer}
.cnt button.m{background:var(--mu)}
.snap{display:grid;grid-template-columns:70px 1fr 1fr 60px;gap:8px;align-items:end;margin-bottom:8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}
.warn{background:#fff6e0;color:#6b4e00;border-right:4px solid var(--gold);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3a3115;color:#f1dfa6}}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--bg);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:28px;font-weight:700;color:var(--g)}.kpi span{font-size:12px;color:var(--mu)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}th{background:var(--bg);color:var(--g);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar i{display:block;height:16px;border-radius:5px;background:var(--g2);min-width:2px}.bar em{font-style:normal;width:80px;flex:none}
.hide{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{font-size:16px}
.rc{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rn{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0;font-size:14px}.rn b{color:var(--g)}
@media (max-width:700px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--bd);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}main{padding-bottom:90px}header h1{font-size:16px}.mark{width:44px;height:44px;font-size:11px}.snap{grid-template-columns:44px 1fr 1fr 48px;gap:6px}.btn{flex:1}}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
@media print{nav,header .mark,.row,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header><div class="hw"><div class="mark">وزارة<br>التعليم</div><div><h1>الاستقصاء المهني لتحسين الانضباط الصفي</h1><p>متوسطة المنذر بن عمرو الأنصاري — مدير المدرسة: خالد المطيري</p><p>الصف: أول متوسط – فصل ٥ · <span id="st" class="pill" style="color:#fff;border:0">…</span></p></div></div></header>
<nav><div id="tabs"></div></nav>
<main>
<section id="p-home"></section>
<section id="p-new" class="hide"></section>
<section id="p-log" class="hide"></section>
<section id="p-res" class="hide"></section>
</main>
<footer>وثيقة تشغيلية للفريق — البيانات تُستخدم للتحسين المهني لا للتقييم أو المقارنة بين المعلمين — لا تُسجَّل أسماء الطلاب</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const SUBJ=['الرياضيات','الاجتماعيات','التربية الإسلامية','اللغة الإنجليزية','العلوم'];
const PH={train:'تدريب (لا يُحتسب)',base:'خط الأساس',inter:'التدخل',final:'القياس الختامي'};
const MIN=[5,10,15,20,25];
const TABS=[['home','الدليل'],['new','بطاقة رصد'],['log','السجلات'],['res','النتائج']];
let recs=[],col=null,tab='home';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v)||0,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=x=>(Math.round(x*10)/10).toLocaleString('en');
const pct=r=>avg(r.s.map(p=>p[0]?p[1]/p[0]*100:0)),tot=r=>num(r.side)+num(r.intr)+num(r.move);

function save(){try{localStorage.setItem('obs-v1',JSON.stringify(recs))}catch(e){}}
const FB={apiKey:"AIzaSyAVFtPQyyDtbdt5VlivumLhgI4whVU3FS4",authDomain:"card-4108e.firebaseapp.com",projectId:"card-4108e",storageBucket:"card-4108e.firebasestorage.app",messagingSenderId:"854525747419",appId:"1:854525747419:web:e67a89a74f9cc8d745acfe"};
function setSt(t,ok){const e=$('#st');e.textContent=t;e.style.background=ok?'#0A8F55':'#B3261E'}
const TEAM='a123456';
function init(){
  try{recs=JSON.parse(localStorage.getItem('obs-v1')||'[]')}catch(e){}
  drawTabs();show('home');
  const code=TEAM;
  if(!window.firebase){setSt('غير متصل بالسحابة',false);return}
  try{
    firebase.initializeApp(FB);const db=firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    col=db.collection('projects').doc(code).collection('obs');
    col.onSnapshot(sn=>{recs=sn.docs.map(d=>{const x=d.data();return{...x,id:d.id,s:(x.s||[]).map(q=>[q.p,q.e])}});
      setSt(sn.metadata.fromCache?'دون إنترنت – سيُزامَن لاحقاً':'متصل ومحفوظ ✓',!sn.metadata.fromCache);render()},
      e=>{setSt('خطأ اتصال: '+e.code,false);console.error(e)});
  }catch(e){setSt('تعذّر الاتصال',false)}
}
function drawTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]==tab?'on':''}">${t[1]}</button>`).join('');
  $('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t)show(t)}}
function show(t){tab=t;drawTabs();TABS.forEach(x=>$('#p-'+x[0]).classList.toggle('hide',x[0]!=t));render();scrollTo(0,0)}
function render(){ if(tab=='home')home(); if(tab=='log')log(); if(tab=='res')res(); if(tab=='new'&&!$('#p-new').dataset.b)form(); }

function home(){$('#p-home').innerHTML=`
<div class="card"><h2>ابدأ مباشرة</h2><p>هذه المنصة تحلّ محلّ البطاقة الورقية: يدخل الراصد ما شاهده أثناء الحصة، وتُحسب المتوسطات ونسبة الخفض والتغيّر في الانشغال تلقائياً. السجلات مشتركة بين جميع أعضاء الفريق.</p>
<div class="row"><button class="btn" onclick="show('new')">+ بطاقة رصد جديدة</button><button class="btn s" onclick="show('res')">عرض النتائج</button></div></div>
<div class="card"><h2>مراحل المشروع</h2><p><span class="pill">١</span> التدريب (غير محتسب) ← <span class="pill">٢</span> خط الأساس: ٣ حصص على الأقل ← <span class="pill">٣</span> الميثاق والتعزيز ← <span class="pill">٤</span> القياس الختامي.</p><div class="warn">لا يبدأ الميثاق الصفي أو التعزيز المنظم قبل اكتمال خط الأساس. اختر في البطاقة «تدريب» ليوم التدريب حتى لا تدخل في النتائج.</div></div>
<div class="card"><h2>التعريفات الموحدة (الوقائع)</h2>
<h3>الحديث الجانبي</h3><p>حديث بين طالبين أو أكثر لا يخدم المهمة. <b>لا يُحسب:</b> ما يتعلق بالمهمة، أو بإذن المعلم، أو نقاش تعليمي، أو رد قصير على التعليمات.</p>
<h3>مقاطعة المتحدث</h3><p>تدخّل قبل انتهاء المعلم أو الطالب بما يقطع دوره. <b>لا تُحسب:</b> المشاركة الجماعية المسموحة، أو رفع اليد وانتظار الدور.</p>
<h3>الحركة دون إذن</h3><p>ترك المقعد أو التنقل دون مسوّغ تعليمي أو إذن. <b>لا تُحسب:</b> حركة بطلب المعلم، أو ضمن النشاط، أو لإحضار أداة بإذن.</p>
<h3>الواقعة الواحدة</h3><p>حدوث السلوك مرة مستقلة؛ الحديث المتصل ٢٠ ثانية = واقعة واحدة. تُحسب واقعة جديدة عند توقف واضح ثم عودة، أو تغيّر الموقف/المجموعة. نعدّ الوقائع لا عدد الطلاب.</p>
<h3>الانشغال بالمهمة (٥ لقطات: د٥، ١٠، ١٥، ٢٠، ٢٥)</h3><p>منخرط: يقرأ، يكتب، ينفّذ النشاط، يستخدم أداة التعلم صحيحاً، يناقش تعليمياً، أو يتابع الشرح ظاهرياً. غير منخرط: حديث جانبي، أداة لا علاقة لها، نائم، منتظر دون محاولة، أو يشتت زملاءه.</p></div>
<div class="card"><h2>تنبيهات الراصد</h2><p>لا تتدخل في الحصة · سجّل المشاهدة فقط دون تفسير · لا أسماء طلاب · دوّن أي ظرف استثنائي (اختبار، زيارة، نشاط) · سلّم البيانات لمسؤول الجمع. السلوكيات الأخرى (النوم، الأصوات، الأدوات) تُكتب في الملاحظات فقط.</p></div>`}

function form(){const p=$('#p-new');p.dataset.b=1;
p.innerHTML=`<div class="card"><h2>بطاقة الرصد الصفي (٣٠ دقيقة)</h2>
<div class="grid">
<div><label>التاريخ</label><input type="date" id="f-date"></div>
<div><label>المرحلة</label><select id="f-ph">${Object.entries(PH).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
<div><label>الأسبوع (١–٥)</label><select id="f-wk">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div>
<div><label>المادة</label><select id="f-sub">${SUBJ.map(s=>`<option>${s}</option>`).join('')}</select></div>
<div><label>الحصة</label><select id="f-per">${[1,2,3,4,5,6,7].map(n=>`<option>${n}</option>`).join('')}</select></div>
<div><label>رمز الراصد</label><input id="f-obs" placeholder="مثال: R1"></div></div></div>
<div class="card"><h2>الوقائع المشتتة</h2><div class="grid">
${[['side','الحديث الجانبي'],['intr','مقاطعة المتحدث'],['move','الحركة دون إذن']].map(([k,l])=>`<div><label>${l}</label><div class="cnt"><button class="m" onclick="bump('${k}',-1)">−</button><b id="c-${k}">0</b><button onclick="bump('${k}',1)">+</button></div></div>`).join('')}</div></div>
<div class="card"><h2>لقطات الانشغال بالمهمة</h2>
${MIN.map((m,i)=>`<div class="snap"><div><label>الدقيقة</label><b>${m}</b></div><div><label>الحاضرون</label><input type="number" min="0" inputmode="numeric" id="sp${i}" oninput="calc()"></div><div><label>المنخرطون</label><input type="number" min="0" inputmode="numeric" id="se${i}" oninput="calc()"></div><div><label>النسبة</label><b id="sx${i}">–</b></div></div>`).join('')}
<p>متوسط الانشغال: <b id="savg" style="color:var(--g)">–</b></p></div>
<div class="card"><label>ملاحظات وصفية (دون أسماء أو أحكام)</label><textarea id="f-nt"></textarea>
<label style="margin-top:8px">ظروف استثنائية مؤثرة في المقارنة</label><textarea id="f-ex"></textarea>
<div id="f-msg"></div><div class="row"><button class="btn" onclick="submitRec()">حفظ البطاقة</button><button class="btn s" onclick="resetForm()">مسح</button></div></div>`;
resetForm()}
const cn={side:0,intr:0,move:0};
function bump(k,d){cn[k]=Math.max(0,cn[k]+d);$('#c-'+k).textContent=cn[k]}
function calc(){const v=[];for(let i=0;i<5;i++){const a=num($('#sp'+i).value),b=num($('#se'+i).value);const ok=a>0&&$('#se'+i).value!=='';$('#sx'+i).textContent=ok?Math.round(b/a*100)+'%':'–';if(ok)v.push(b/a*100)}
 $('#savg').textContent=v.length==5?f1(avg(v))+'%':'–'}
function resetForm(){$('#f-date').value=new Date().toISOString().slice(0,10);['side','intr','move'].forEach(k=>{cn[k]=0;$('#c-'+k).textContent=0});
 for(let i=0;i<5;i++){$('#sp'+i).value='';$('#se'+i).value=''}$('#f-nt').value='';$('#f-ex').value='';$('#f-msg').innerHTML='';calc()}
async function submitRec(){
 const m=$('#f-msg'),s=[];
 for(let i=0;i<5;i++){const a=num($('#sp'+i).value),b=num($('#se'+i).value);
  if(!a||$('#se'+i).value===''){m.innerHTML=`<div class="warn">أكمل اللقطة ${i+1} (الحاضرون والمنخرطون).</div>`;return}
  if(b>a){m.innerHTML=`<div class="warn">في اللقطة ${i+1}: المنخرطون أكثر من الحاضرين.</div>`;return}s.push([a,b])}
 if(!$('#f-obs').value.trim()){m.innerHTML='<div class="warn">أدخل رمز الراصد (دون اسم الطالب).</div>';return}
 const id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 const r={date:$('#f-date').value,phase:$('#f-ph').value,week:num($('#f-wk').value),subject:$('#f-sub').value,period:num($('#f-per').value),obs:$('#f-obs').value.trim(),
  side:cn.side,intr:cn.intr,move:cn.move,s,notes:$('#f-nt').value.trim(),exc:$('#f-ex').value.trim(),ts:Date.now()};
 try{ if(col)await col.doc(id).set({...r,s:r.s.map(p=>({p:p[0],e:p[1]}))}); else {recs.push({...r,id});save()} }
 catch(e){m.innerHTML='<div class="warn">تعذّر الحفظ، حاول مجدداً.</div>';return}
 resetForm();m.innerHTML='<div class="warn" style="border-color:var(--ok)">تم حفظ البطاقة ✓</div>';
}

function log(){const L=[...recs].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.ts-a.ts);
$('#p-log').innerHTML=`<div class="card"><h2>السجلات (${L.length})</h2>${L.length?L.map(r=>`<div class="rc"><div class="rt"><b>${esc(r.date)} · ${esc(r.subject)} · حصة ${r.period}</b><span class="pill">${PH[r.phase].split(' ')[0]} · أسبوع ${r.week}</span></div>
<div class="rn"><span>جانبي <b>${r.side}</b></span><span>مقاطعة <b>${r.intr}</b></span><span>حركة <b>${r.move}</b></span><span>انشغال <b>${f1(pct(r))}%</b></span></div>
<small>الراصد: ${esc(r.obs)}${r.notes?' — '+esc(r.notes):''}${r.exc?' — ⚠ '+esc(r.exc):''}</small>
<div><button class="btn d" style="padding:4px 12px;margin-top:6px" onclick="del('${r.id}')">حذف</button></div></div>`).join(''):'<p>لا توجد بطاقات بعد.</p>'}
<div class="row noprint"><button class="btn s" onclick="csv()">تنزيل CSV</button></div></div>`}
async function del(id){if(!confirm('حذف هذه البطاقة نهائياً؟'))return;try{if(col)await col.doc(id).delete();else{recs=recs.filter(r=>r.id!=id);save();render()}}catch(e){alert('لا تملك صلاحية الحذف.')}}
async function csv(){const h=['التاريخ','المرحلة','الأسبوع','المادة','الحصة','الحديث الجانبي','مقاطعة المتحدث','الحركة دون إذن','إجمالي الوقائع','لقطة1%','لقطة2%','لقطة3%','لقطة4%','لقطة5%','متوسط الانشغال%','الراصد','ملاحظات','ظروف استثنائية'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const rows=recs.map(r=>[r.date,PH[r.phase],r.week,r.subject,r.period,r.side,r.intr,r.move,tot(r),...r.s.map(p=>Math.round(p[1]/p[0]*100)),f1(pct(r)),r.obs,r.notes,r.exc].map(q).join(','));
 const data='\ufeff'+[h.map(q).join(','),...rows].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download='observation-data.csv';document.body.appendChild(a);a.click();a.remove()}

let cmp='final';
function grp(ph){const a=recs.filter(r=>r.phase==ph);return{n:a.length,side:avg(a.map(r=>num(r.side))),intr:avg(a.map(r=>num(r.intr))),move:avg(a.map(r=>num(r.move))),tot:avg(a.map(tot)),eng:avg(a.map(pct))}}
function res(){
 const ok=recs.filter(r=>r.phase!='train'),B=grp('base'),I=grp('inter'),F=grp('final');
 if(!grp('final').n&&cmp=='final')cmp='inter';
 const T=cmp=='final'?F:I,has=T.n>0&&B.n>0;
 const red=has&&B.tot?(B.tot-T.tot)/B.tot*100:null,dE=has?T.eng-B.eng:null;
 const ex=(a,b)=>b==null?'–':f1(b);
 let msg='';
 if(B.n<3)msg+=`<div class="warn">خط الأساس يضم ${B.n} حصة فقط؛ المطلوب ٣ حصص قابلة للمقارنة قبل بدء التدخل. إن امتد، وثّق السبب.</div>`;
 if(has){msg+=`<div class="warn" style="border-color:var(--ok)">${red>=30?'بلغ الخفض المستهدف الإرشادي (٣٠٪). ':'لم يبلغ الخفض المستهدف الإرشادي (٣٠٪) بعد. '}راجع قائمة تحقق تنفيذ التدخل قبل الحكم: نتيجة أفضل مع تنفيذ منخفض لا تدل على أثر واضح، ونتيجة ثابتة مع تنفيذ منخفض تعني تحسين التنفيذ أولاً.</div>`}
 const wk={};ok.forEach(r=>{(wk[r.week]=wk[r.week]||[]).push(r)});
 const wr=Object.keys(wk).sort((a,b)=>a-b).map(k=>({k,n:wk[k].length,ph:[...new Set(wk[k].map(r=>PH[r.phase].split(' ')[0]))].join('/'),t:avg(wk[k].map(tot)),e:avg(wk[k].map(pct))}));
 const sb={};ok.forEach(r=>{(sb[r.subject]=sb[r.subject]||[]).push(r)});
 const mx=Math.max(1,...wr.map(w=>w.t));
 $('#p-res').innerHTML=`<div class="card"><h2>مؤشرات القرار</h2>
 <div class="noprint" style="margin-bottom:10px"><label>قارن خط الأساس مع</label><select onchange="cmp=this.value;res()"><option value="final" ${cmp=='final'?'selected':''}>القياس الختامي</option><option value="inter" ${cmp=='inter'?'selected':''}>مرحلة التدخل</option></select></div>
 <div class="kpis"><div class="kpi"><b>${B.n}</b><span>حصص خط الأساس</span></div><div class="kpi"><b>${T.n}</b><span>حصص المقارنة</span></div>
 <div class="kpi"><b>${red==null?'–':f1(red)+'%'}</b><span>نسبة خفض السلوكيات</span></div>
 <div class="kpi"><b>${dE==null?'–':(dE>0?'+':'')+f1(dE)}</b><span>التغير في الانشغال (نقطة مئوية)</span></div></div>${msg}</div>
 <div class="card"><h2>المتوسطات حسب المرحلة (لكل حصة)</h2><div class="tw"><table><tr><th>المرحلة</th><th>حصص</th><th>جانبي</th><th>مقاطعة</th><th>حركة</th><th>الإجمالي</th><th>الانشغال%</th></tr>
 ${[['خط الأساس',B],['التدخل',I],['الختامي',F]].map(([n,g])=>`<tr><td>${n}</td><td>${g.n}</td>${g.n?`<td>${f1(g.side)}</td><td>${f1(g.intr)}</td><td>${f1(g.move)}</td><td><b>${f1(g.tot)}</b></td><td><b>${f1(g.eng)}</b></td>`:'<td colspan="5">لا بيانات</td>'}</tr>`).join('')}</table></div></div>
 <div class="card"><h2>المتوسط الأسبوعي</h2>${wr.length?wr.map(w=>`<div class="bar"><em>أسبوع ${w.k}</em><i style="width:${w.t/mx*60}%"></i><span>${f1(w.t)} واقعة · انشغال ${f1(w.e)}% · ${w.ph} (${w.n})</span></div>`).join(''):'<p>لا بيانات.</p>'}</div>
 <div class="card"><h2>حسب المادة (للتحسين لا للمقارنة بين المعلمين)</h2>${Object.keys(sb).length?`<div class="tw"><table><tr><th>المادة</th><th>حصص</th><th>متوسط الوقائع</th><th>الانشغال%</th></tr>${Object.entries(sb).map(([k,a])=>`<tr><td>${esc(k)}</td><td>${a.length}</td><td>${f1(avg(a.map(tot)))}</td><td>${f1(avg(a.map(pct)))}</td></tr>`).join('')}</table></div>`:'<p>لا بيانات.</p>'}</div>
 <div class="card"><h2>حدود الاستدلال</h2><p>المقارنة قبل/بعد في فصل واحد تدعم قراراً مهنياً لكنها لا تثبت أن الميثاق أو التعزيز هو السبب الوحيد؛ فطبيعة الدرس وتوقيت الحصة والظروف الطارئة قد تؤثر. لا تُعمَّم النتيجة على المدرسة دون أدلة إضافية. بطاقات التدريب مستبعدة (${recs.length-ok.length}).</p>
 <div class="row noprint"><button class="btn" onclick="print()">طباعة / حفظ PDF</button><button class="btn s" onclick="csv()">تنزيل البيانات CSV</button></div></div>`}
init();
</script>
