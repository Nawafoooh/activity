<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فريق التميز المدرسي — متوسطة المنذر بن عمرو الأنصاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC; --bg-soft:#EDEADF; --surface:#FFFFFF; --surface-2:#FAF8F2;
  --ink:#1E2A24; --ink-dim:#5B6660; --border:#E1DCCC;
  --primary:#1F5C4E; --primary-dark:#153E34; --primary-tint:#E4EFEA;
  --accent:#B8862E; --accent-tint:#F5EBD6;
  --success:#2F7D4F; --success-tint:#E6F3EB;
  --warning:#B8862E; --warning-tint:#FBF1DD;
  --danger:#B0433B; --danger-tint:#F8E7E5;
  --radius:14px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(30,42,36,.06), 0 4px 16px rgba(30,42,36,.05);
}
[data-theme="dark"]{
  --bg:#101A16; --bg-soft:#0C1512; --surface:#152019; --surface-2:#182620;
  --ink:#E9EFEA; --ink-dim:#9AAA9F; --border:#22332B;
  --primary:#4FA98A; --primary-dark:#3A8770; --primary-tint:#16281F;
  --accent:#D8AE5C; --accent-tint:#241C0F;
  --success:#5CBF87; --success-tint:#122A1B;
  --warning:#D8AE5C; --warning-tint:#241E0F;
  --danger:#E28178; --danger-tint:#2A1513;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh; transition:background .25s,color .25s;
}
button,input,select,textarea{font-family:inherit; direction:rtl}
a{color:inherit}
.app{display:flex; min-height:100vh}
/* ===== Sidebar ===== */
.sidebar{
  width:264px; flex:none; background:var(--primary-dark); color:#F3F1E7;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar .brand{padding:22px 20px 14px; border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand .eyebrow{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:.3px}
.sidebar .brand h1{font-size:19px; margin:6px 0 2px; font-weight:800; line-height:1.35}
.sidebar .brand p{font-size:12.5px; margin:0; opacity:.75}
.nav-group{padding:10px 10px}
.nav-group .label{font-size:11.5px; opacity:.55; padding:12px 10px 4px; font-weight:700}
.nav-btn{
  display:flex; align-items:center; gap:10px; width:100%; text-align:right; background:none; border:none;
  color:#EAF2ED; padding:10px 12px; border-radius:10px; font-size:14px; cursor:pointer; margin-bottom:2px;
}
.nav-btn .ic{font-size:15px; width:20px; text-align:center; opacity:.85}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-btn.active{background:var(--accent); color:#2B2007; font-weight:700}
/* ===== Topbar ===== */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px;
  padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border);
}
.topbar .search{
  flex:1; max-width:340px; display:flex; align-items:center; gap:8px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:10px; padding:8px 12px;
}
.topbar .search input{border:none; background:none; outline:none; width:100%; color:var(--ink); font-size:13.5px}
.icon-btn{
  background:var(--surface-2); border:1px solid var(--border); border-radius:10px; width:38px; height:38px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--ink);
}
.role-pill{
  display:flex; align-items:center; gap:8px; background:var(--primary-tint); color:var(--primary); border:1px solid var(--border);
  padding:6px 10px; border-radius:20px; font-size:12.5px; font-weight:700; margin-inline-start:auto;
}
.role-pill select{background:none; border:none; color:inherit; font-weight:700; font-size:12.5px; outline:none}
.content{padding:26px 30px 60px; max-width:1180px; width:100%; margin:0 auto}
/* ===== Generic pieces ===== */
.page-head{margin-bottom:20px}
.page-head .kicker{color:var(--primary); font-weight:700; font-size:13px}
.page-head h2{font-size:26px; margin:4px 0 8px; font-weight:800}
.page-head p{color:var(--ink-dim); max-width:74ch; line-height:1.9; margin:0; font-size:14.5px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-pad{padding:20px}
.grid{display:grid; gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr)} .grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.stat{padding:18px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--border)}
.stat .n{font-size:26px; font-weight:800}
.stat .l{font-size:12.5px; color:var(--ink-dim); margin-top:4px}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:20px}
.badge.high{background:var(--danger-tint); color:var(--danger)}
.badge.med{background:var(--warning-tint); color:var(--warning)}
.badge.low{background:var(--success-tint); color:var(--success)}
.badge.done{background:var(--success-tint); color:var(--success)}
.badge.progress{background:var(--warning-tint); color:var(--warning)}
.badge.late{background:var(--danger-tint); color:var(--danger)}
.badge.plan{background:var(--primary-tint); color:var(--primary)}
.btn{
  display:inline-flex; align-items:center; gap:6px; border:none; cursor:pointer; font-weight:700; font-size:13.5px;
  padding:10px 18px; border-radius:10px; background:var(--primary); color:#fff;
}
.btn.secondary{background:var(--surface-2); color:var(--ink); border:1px solid var(--border)}
.btn.ghost{background:none; color:var(--primary); padding:8px 6px}
.btn.sm{padding:6px 12px; font-size:12.5px}
.btn.danger{background:var(--danger)}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-dim)}
.field input,.field select,.field textarea{
  border:1px solid var(--border); border-radius:9px; padding:10px 12px; background:var(--surface-2); color:var(--ink); font-size:14px;
}
.field textarea{resize:vertical; min-height:64px}
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0 16px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
.section-title{font-size:16.5px; font-weight:800; margin:0 0 4px}
.muted{color:var(--ink-dim); font-size:13px}
hr.sep{border:none; border-top:1px solid var(--border); margin:22px 0}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th,td{padding:10px 12px; text-align:right; border-bottom:1px solid var(--border)}
th{color:var(--ink-dim); font-weight:700; font-size:12px}
.tag{display:inline-block; background:var(--primary-tint); color:var(--primary); font-size:12px; padding:3px 9px; border-radius:8px; margin:2px}
.empty{padding:34px 18px; text-align:center; color:var(--ink-dim)}
.empty .big{font-size:30px; margin-bottom:8px}
.flow{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:14px 0}
.flow .step{background:var(--primary-tint); color:var(--primary); padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700}
.flow .arrow{color:var(--ink-dim)}
.progressbar{height:9px; border-radius:6px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border)}
.progressbar > div{height:100%; background:var(--primary)}
.list-row{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.check-row{display:flex; align-items:center; gap:10px; padding:10px 4px}
.check-row input{width:18px; height:18px}
.hero-cycle{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:22px 0}
.hero-cycle button{
  background:var(--surface); border:1px solid var(--border); padding:9px 15px; border-radius:24px; font-size:12.5px; font-weight:700;
  cursor:pointer; color:var(--ink);
}
.hero-cycle button:hover{border-color:var(--primary); color:var(--primary)}
.hero{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary)); color:#F4F2E8; border-radius:20px; padding:40px 34px;
  text-align:center; margin-bottom:26px;
}
.hero .eyebrow{color:var(--accent); font-weight:700; font-size:13px}
.hero h1{font-size:30px; margin:8px 0 4px; font-weight:900}
.hero h2{font-size:16px; margin:0 0 14px; font-weight:500; opacity:.85}
.hero .motto{font-size:15px; font-weight:700; opacity:.95}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:760px){.two-col{grid-template-columns:1fr}}
.numbered{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border)}
.numbered:last-child{border-bottom:none}
.numbered .num{
  flex:none; width:30px; height:30px; border-radius:9px; background:var(--primary-tint); color:var(--primary);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
}
.diff{font-weight:800}
.diff.up{color:var(--success)}
.print-only{display:none}
@media print{
  .sidebar,.topbar,.no-print{display:none !important}
  .content{max-width:100%; padding:0}
  body{background:#fff}
  .print-only{display:block}
}
.pill-toggle{display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:4px}
.pill-toggle button{border:none; background:none; padding:6px 12px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-dim)}
.pill-toggle button.active{background:var(--primary); color:#fff}
::placeholder{color:var(--ink-dim); opacity:.7}
.footer-note{margin-top:40px; padding:28px; text-align:center; border-radius:16px; background:var(--primary-tint); color:var(--primary)}
.footer-note p{margin:6px 0; font-weight:700; font-size:15px}
@media(max-width:900px){
  .sidebar{position:fixed; inset-inline-end:0; height:100vh; transform:translateX(100%); transition:transform .25s; z-index:50}
  .sidebar.open{transform:translateX(0)}
  .content{padding:18px}
}
.menu-toggle{display:none}
@media(max-width:900px){.menu-toggle{display:flex}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
      <div class="search"><span>🔍</span><input id="searchInput" placeholder="ابحث في الأقسام..."></div>
      <div class="role-pill">👤
        <select id="roleSelect">
          <option value="leader">قائد المدرسة</option>
          <option value="team" selected>فريق التميز</option>
          <option value="teacher">المعلم</option>
          <option value="supervisor">المشرف</option>
        </select>
      </div>
      <button class="icon-btn" id="themeToggle">🌙</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
/* ============ DATA LAYER ============ */
const STORE_KEY='ftm_platform_v1';
function defaultData(){
  return {
    baseline:[], results:[], gaps:[], interventions:[], evidences:[], meetings:[],
    checklist:{}, timeline:{
      w1:'', w2:'', w3:'', w46:'', w7:''
    },
    theme:'light', role:'team'
  };
}
let DB = JSON.parse(localStorage.getItem(STORE_KEY) || 'null') || defaultData();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ============ NAV ============ */
const NAV = [
 {group:'البداية', items:[
   {id:'home', ic:'🏠', label:'الرئيسية'},
   {id:'start', ic:'🚀', label:'ابدأ من هنا'},
 ]},
 {group:'التشخيص والتحليل', items:[
   {id:'about', ic:'ℹ️', label:'ما هو فريق التميز؟'},
   {id:'analysis', ic:'🔎', label:'تحليل واقع المدرسة'},
   {id:'sources', ic:'🗂️', label:'مصادر البيانات'},
   {id:'baseline', ic:'📏', label:'خط الأساس'},
   {id:'results', ic:'📊', label:'نتائج الطلاب'},
 ]},
 {group:'الفجوات والتدخلات', items:[
   {id:'gaps', ic:'🧩', label:'بطاقة الفجوة'},
   {id:'interventions', ic:'🛠️', label:'خطة التدخل'},
 ]},
 {group:'الأدوار والمتابعة', items:[
   {id:'teacher-role', ic:'🧑‍🏫', label:'دور المعلم'},
   {id:'team-role', ic:'👥', label:'دور فريق التميز'},
   {id:'dashboard', ic:'📈', label:'لوحة المتابعة'},
   {id:'impact', ic:'🎯', label:'قياس الأثر'},
   {id:'cycle', ic:'🔄', label:'دورة التحسين المستمر'},
 ]},
 {group:'الشواهد والزيارات', items:[
   {id:'evidence', ic:'📁', label:'الشواهد والأدلة'},
   {id:'supervisor', ic:'🧭', label:'زيارة المشرف'},
 ]},
 {group:'التخطيط الزمني', items:[
   {id:'timeline', ic:'🗓️', label:'الخطة الزمنية'},
   {id:'meeting', ic:'📝', label:'الاجتماع الأسبوعي'},
   {id:'reports', ic:'🖨️', label:'التقارير'},
 ]},
 {group:'النظام', items:[
   {id:'roles', ic:'🔐', label:'الصلاحيات'},
   {id:'principle', ic:'✨', label:'مبدأ المنصة'},
 ]},
];
let currentView='home';

function renderSidebar(){
  const el=document.getElementById('sidebar');
  el.innerHTML = `
    <div class="brand">
      <div class="eyebrow">منصة عمل ومرجع موحد</div>
      <h1>فريق التميز المدرسي</h1>
      <p>متوسطة المنذر بن عمرو الأنصاري</p>
    </div>
    ${NAV.map(g=>`
      <div class="nav-group">
        <div class="label">${g.group}</div>
        ${g.items.map(it=>`<button class="nav-btn ${it.id===currentView?'active':''}" data-view="${it.id}"><span class="ic">${it.ic}</span>${it.label}</button>`).join('')}
      </div>
    `).join('')}
  `;
  el.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{ goTo(b.dataset.view); document.getElementById('sidebar').classList.remove('open'); }));
}

function goTo(view){ currentView=view; renderSidebar(); renderContent(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ============ HELPERS ============ */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function priorityBadge(p){ const map={'عالية':'high','متوسطة':'med','منخفضة':'low'}; return `<span class="badge ${map[p]||'med'}">${p}</span>`; }
function statusBadge(s){ const map={'مكتمل':'done','قيد التنفيذ':'progress','متأخر':'late','مخطط':'plan'}; return `<span class="badge ${map[s]||'plan'}">${s}</span>`; }

/* ============ VIEW RENDERERS ============ */
const VIEWS = {};

VIEWS.home = () => `
  <div class="hero">
    <div class="eyebrow">من البيانات نبدأ، وبالأثر نقيس</div>
    <h1>فريق التميز المدرسي</h1>
    <h2>متوسطة المنذر بن عمرو الأنصاري</h2>
    <div class="motto">تحويل بيانات المدرسة إلى قرارات، والقرارات إلى تدخلات، والتدخلات إلى أثر قابل للقياس والتوثيق</div>
  </div>
  <div class="card card-pad">
    <div class="section-title">دورة التحسين</div>
    <p class="muted">اضغط على أي مرحلة للانتقال إلى تفاصيلها</p>
    <div class="hero-cycle">
      ${[['تشخيص الواقع','analysis'],['تحليل البيانات','results'],['تحديد الفجوات','gaps'],['تحديد الأولويات','gaps'],['بناء التدخلات','interventions'],['التنفيذ','interventions'],['المتابعة','dashboard'],['قياس الأثر','impact'],['التحسين المستمر','cycle']]
        .map(([label,v])=>`<button data-view="${v}">${label}</button>`).join('')}
    </div>
  </div>
  <div class="grid grid-4" style="margin-top:18px">
    ${quickStat('عدد الفجوات المسجلة', DB.gaps.length)}
    ${quickStat('التدخلات الجارية', DB.interventions.filter(i=>i.status==='قيد التنفيذ').length)}
    ${quickStat('التدخلات المكتملة', DB.interventions.filter(i=>i.status==='مكتمل').length)}
    ${quickStat('الشواهد الموثقة', DB.evidences.length)}
  </div>
`;
function quickStat(l,n){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

VIEWS.about = () => pageHead('القسم الأول','ما هو فريق التميز؟',
  'فريق يعمل على دعم المدرسة في تشخيص واقعها، وتحليل بياناتها، وتحديد أولويات التحسين، ومتابعة تنفيذ التدخلات، وقياس أثرها على تعلم الطلاب.') + `
  <div class="card card-pad">
    <div class="section-title">دور الفريق لا يقتصر على جمع الأوراق</div>
    <div class="grid grid-3" style="margin-top:12px">
      ${['تحليل البيانات','تحديد الفجوات','دعم المعلمين','متابعة التدخلات','قياس الأثر','توثيق رحلة التحسين']
        .map(t=>`<div class="stat">${t}</div>`).join('')}
    </div>
  </div>`;

VIEWS.analysis = () => pageHead('القسم الثاني','تحليل واقع المدرسة',
  'تحليل واقع المدرسة يعني أن نعرف أين نحن الآن قبل أن نقرر ماذا نريد أن نفعل.') + `
  <div class="card card-pad">
    <div class="section-title">أسئلة يجب أن يجيب عنها التحليل</div>
    <div class="grid grid-2" style="margin-top:10px">
      ${['أين مستوى المدرسة حاليًا؟','ما نقاط القوة؟','أين توجد الفجوات؟ في أي مواد؟','في أي مهارات؟','ما الفئات الأكثر احتياجًا؟','ما العوامل المؤثرة؟','ما الأولويات التي تستحق التدخل؟']
        .map(q=>`<div class="numbered"><div class="num">؟</div><div>${q}</div></div>`).join('')}
    </div>
  </div>
  <div class="card card-pad" style="margin-top:16px">
    <div class="section-title">مثال توضيحي</div>
    <div class="two-col" style="margin-top:10px">
      <div class="stat" style="border-color:var(--danger)">
        <div class="muted" style="margin-bottom:6px">وصف عام (غير كافٍ)</div>
        يوجد ضعف في الرياضيات.
      </div>
      <div class="stat" style="border-color:var(--success)">
        <div class="muted" style="margin-bottom:6px">تحليل دقيق (مطلوب)</div>
        أظهرت النتائج وجود انخفاض في إتقان مهارة محددة لدى نسبة من الطلاب.
      </div>
    </div>
    <div class="flow">
      ${['الفجوة','السبب المحتمل','الطلاب المستهدفون','التدخل','القياس'].map((s,i,arr)=>`<span class="step">${s}</span>${i<arr.length-1?'<span class="arrow">←</span>':''}`).join('')}
    </div>
  </div>`;

VIEWS.sources = () => pageHead('القسم الثالث','مصادر البيانات',
  'لا نبني قرارات التحسين على الانطباعات وحدها، بل على بيانات وأدلة.') + `
  <div class="grid grid-3">
    ${['نتائج التقويم التشخيصي','نتائج التحصيل الدراسي','نتائج نافس','نتائج التقويم المدرسي','الاختبارات القصيرة','الحضور والغياب والتأخر','الملاحظات الصفية','نتائج أدوات التقويم المختلفة','ملاحظات المعلمين','أي بيانات مدرسية موثوقة أخرى']
      .map((s,i)=>`<div class="card card-pad"><div class="numbered" style="border:none;padding:0"><div class="num">${i+1}</div><div>${s}</div></div></div>`).join('')}
  </div>`;

/* ---- Baseline ---- */
VIEWS.baseline = () => pageHead('القسم الرابع','خط الأساس',
  'خط الأساس هو مستوى أداء الطلاب قبل تنفيذ تدخلات التحسين، ومن خلاله نستطيع لاحقًا معرفة مقدار التغير والأثر.') + `
  <div class="card card-pad no-print">
    <div class="section-title">إضافة قياس خط أساس</div>

function printReport(id){
  const map={
    reality:{title:'تقرير واقع المدرسة', body:`<p>عدد الفجوات المسجلة: ${DB.gaps.length}</p><p>عدد نتائج المواد المحللة: ${DB.results.length}</p>`},
    results:{title:'تقرير تحليل النتائج', body: DB.results.map(r=>`<p><b>${esc(r.subject)} (${esc(r.grade)})</b>: متوسط الأداء ${r.avg}% — إتقان ${r.mastery}%</p>`).join('') || '<p>لا توجد بيانات.</p>'},
    gaps:{title:'تقرير الفجوات', body: DB.gaps.map(g=>`<p><b>${esc(g.subject)} — ${esc(g.skill)}</b>: أولوية ${g.priority} — إتقان حالي ${g.mastery||'—'}%</p>`).join('') || '<p>لا توجد فجوات.</p>'},
    plan:{title:'تقرير خطة التحسين', body: DB.interventions.map(i=>`<p><b>${esc(i.goal)}</b>: ${esc(i.action)} — المسؤول ${esc(i.owner||'—')} — الحالة ${i.status}</p>`).join('') || '<p>لا توجد خطط.</p>'},
    followup:{title:'تقرير متابعة التدخلات', body: DB.interventions.map(i=>`<p>${esc(i.goal)} — الحالة: ${i.status}</p>`).join('') || '<p>لا توجد بيانات.</p>'},
    impact:{title:'تقرير قياس الأثر', body: DB.baseline.filter(b=>b.after!=='' && b.after!==undefined && b.after!==null).map(b=>`<p>${esc(b.subject)} — ${esc(b.skill)}: من ${b.before}% إلى ${b.after}%</p>`).join('') || '<p>لا توجد قياسات أثر مكتملة.</p>'},
    leader:{title:'تقرير مختصر للقيادة', body:`<p>الفجوات: ${DB.gaps.length} · التدخلات: ${DB.interventions.length} · المكتملة: ${DB.interventions.filter(i=>i.status==='مكتمل').length}</p>`},
    supervisor:{title:'تقرير مختصر للمشرف', body:`<p>ملخص رحلة التحسين: من التشخيص حتى قياس الأثر، موثقة عبر ${DB.evidences.length} شاهدًا.</p>`},
  };
  const r=map[id];
  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>${r.title}</title>
  <style>body{font-family:'Tajawal',sans-serif;padding:40px;color:#1E2A24} h1{color:#1F5C4E}</style></head>
  <body><h1>${r.title}</h1><p>فريق التميز المدرسي — متوسطة المنذر بن عمرو الأنصاري</p><hr>${r.body}</body></html>`);
  win.document.close(); win.focus();
  setTimeout(()=>win.print(),400);
}

/* ============ SHARED UI PIECES ============ */
function pageHead(kicker,title,desc){
  return `<div class="page-head"><div class="kicker">${kicker}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>`;
}
function emptyState(msg){ return `<div class="empty"><div class="big">🗂️</div>${msg}</div>`; }

/* ============ RENDER + EVENTS ============ */
function renderContent(){
  const el=document.getElementById('content');
  el.innerHTML = (VIEWS[currentView] || VIEWS.home)();
  bindDynamicHandlers();
  applyRoleView();
}
function bindDynamicHandlers(){
  document.querySelectorAll('[data-view]').forEach(b=>{
    if(b.classList.contains('nav-btn')) return;
    b.addEventListener('click',()=>goTo(b.dataset.view));
  });
  const forms={
    baselineForm:(d)=>{ DB.baseline.push({id:uid(), subject:d.subject, skill:d.skill, before:+d.before, after:d.after===''? '': +d.after}); },
    resultsForm:(d)=>{ DB.results.push({id:uid(), ...d, total:+d.total, measured:+d.measured, avg:+d.avg, mastery:+d.mastery}); },
    gapForm:(d)=>{ DB.gaps.push({id:uid(), ...d}); },
    interventionForm:(d)=>{ DB.interventions.push({id:uid(), ...d}); },
    evidenceForm:(d)=>{ DB.evidences.push({id:uid(), ...d}); },
    meetingForm:(d)=>{ DB.meetings.push({id:uid(), ...d}); },
  };
  Object.keys(forms).forEach(fid=>{
    const f=document.getElementById(fid);
    if(!f) return;
    f.addEventListener('submit', e=>{
      e.preventDefault();
      const data=Object.fromEntries(new FormData(f).entries());
      forms[fid](data);
      save(); renderContent();
    });
  });
  const tf=document.getElementById('timelineForm');
  if(tf) tf.addEventListener('submit', e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(tf).entries());
    DB.timeline={...DB.timeline, ...d}; save(); renderContent();
  });
  document.querySelectorAll('.check-row input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{ DB.checklist[cb.dataset.idx]=cb.checked; save(); renderContent(); });
  });
}
function removeItem(key,id){ DB[key]=DB[key].filter(x=>x.id!==id); save(); renderContent(); }

function applyRoleView(){
  const role=DB.role;
  const hideEdits = role==='supervisor';
  document.querySelectorAll('.no-print').forEach(elm=>{
    if(hideEdits && (elm.tagName==='FORM' || elm.querySelector('form'))) elm.style.display='none';
  });
}

/* ============ TOP CONTROLS ============ */
document.getElementById('roleSelect').value = DB.role;
document.getElementById('roleSelect').addEventListener('change', e=>{ DB.role=e.target.value; save(); renderContent(); });
document.documentElement.setAttribute('data-theme', DB.theme);
document.getElementById('themeToggle').textContent = DB.theme==='dark'? '☀️':'🌙';
document.getElementById('themeToggle').addEventListener('click', ()=>{
  DB.theme = DB.theme==='dark'? 'light':'dark';
  document.documentElement.setAttribute('data-theme', DB.theme);
  document.getElementById('themeToggle').textContent = DB.theme==='dark'? '☀️':'🌙';
  save();
});
document.getElementById('menuToggle').addEventListener('click', ()=> document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('searchInput').addEventListener('input', e=>{
  const q=e.target.value.trim();
  if(!q) return;
  const match = NAV.flatMap(g=>g.items).find(it=>it.label.includes(q));
  if(match){ document.querySelectorAll('.nav-btn').forEach(b=>b.style.outline = b.dataset.view===match.id? '2px solid var(--accent)':'none'); }
});

/* ============ INIT ============ */
renderSidebar();
renderContent();
</script>
