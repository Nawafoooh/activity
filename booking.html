<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawaf Pro - Private Market Sessions</title>
    <link rel="stylesheet" href="style.css">
    <!-- استدعاء Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-elements"></div> <!-- خلفية الشارتات المجردة -->
    
    <header class="hero">
        <h1>NAWAF PRO</h1>
        <h2>PRIVATE WYCKOFF & MARKET ANALYSIS SESSIONS</h2>
        <p>احجز جلستك التدريبية الفردية مباشرة.</p>
        
        <div class="session-info">
            <span>🕒 جميع المواعيد بتوقيت السعودية (UTC+3)</span>
            <span>💻 عبر Zoom</span>
            <span>⏱ مدة الجلسة: 75 دقيقة</span>
            <span>🔒 خصوصية كاملة</span>
        </div>
    </header>

    <main class="booking-container">
        <!-- Progress -->
        <div class="progress-bar">
            <span class="active">01 التاريخ</span>
            <span>02 الوقت</span>
            <span>03 البيانات</span>
        </div>

        <!-- Calendar Section -->
        <section id="date-selection" class="step-section">
            <h3>اختر يوم التدريب</h3>
            <input type="date" id="booking-date" min="" onchange="loadAvailableSlots()">
        </section>

        <!-- Time Slots Section -->
        <section id="time-selection" class="step-section hidden">
            <h3>المواعيد المتاحة</h3>
            <div class="slots-grid" id="slots-container">
                <!-- يتم توليد البطاقات عبر JS -->
            </div>
        </section>

        <!-- Booking Form Modal (Hidden by default) -->
        <div id="booking-modal" class="modal hidden">
            <div class="modal-content glass">
                <h3>تأكيد الحجز</h3>
                <p id="selected-slot-info" class="gold-text"></p>
                <form id="booking-form">
                    <input type="text" id="student_name" placeholder="الاسم الكريم (مطلوب)" required>
                    <input type="text" id="contact" placeholder="رقم الجوال أو حساب تيليجرام">
                    <textarea id="note" placeholder="ملاحظة للمدرب (خاصة وسرية)..."></textarea>
                    <button type="submit" class="btn-primary">تأكيد الحجز</button>
                    <button type="button" class="btn-secondary" onclick="closeModal()">إلغاء</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Manage Booking Section -->
    <section class="manage-booking">
        <h3>إدارة حجزي</h3>
        <input type="text" id="manage_code" placeholder="أدخل رمز الحجز (Booking ID)">
        <button class="btn-outline" onclick="fetchMyBooking()">استعراض الحجز</button>
        <div id="my-booking-details" class="hidden"></div>
    </section>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
