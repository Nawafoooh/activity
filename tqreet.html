<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام تقارير النشاط المدرسي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f5;--cd:#fff;--ink:#1c2a23;--mu:#68766f;--bd:#dce4df;--g:#006c35;--g2:#e6f1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--cd:#1b2420;--ink:#e8efeb;--mu:#9aa9a1;--bd:#2d3b34;--g:#2fa866;--g2:#1e3328}}
:root[data-theme="dark"]{--bg:#121815;--cd:#1b2420;--ink:#e8efeb;--mu:#9aa9a1;--bd:#2d3b34;--g:#2fa866;--g2:#1e3328}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.7}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
.top{background:#006c35;color:#fff;text-align:center;padding:22px 12px}
.top small{opacity:.85;letter-spacing:.3px}.top h1{margin:4px 0 2px;font-size:1.7rem;font-weight:800}.top p{margin:0;opacity:.92}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:8px}
.tile{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:22px 16px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tile:hover{border-color:var(--g)}.tile b{font-size:1.15rem;color:var(--g)}.tile span{color:var(--mu);font-size:.92rem}
.card0{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:20px}
h2{margin:0 0 14px;font-size:1.3rem;color:var(--g)}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.95rem}
input,select,textarea{border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
.btn,button.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:700}
button.ghost{background:transparent;color:var(--g);border:1px solid var(--g)}button.dn{background:transparent;color:#b3261e;border:1px solid #b3261e}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}.sp{flex:1}
.stp{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 14px;overflow-x:auto}
.stp li{flex:1;min-width:92px;text-align:center;font-size:.82rem;color:var(--mu);cursor:pointer;border-bottom:3px solid var(--bd);padding-bottom:6px}
.stp i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bd);font-style:normal;font-weight:700;margin-bottom:2px}
.stp li.on{color:var(--g);border-color:var(--g);font-weight:700}.stp li.on i,.stp li.done i{background:var(--g);color:#fff}.stp li.done{border-color:var(--g)}
.goal{display:flex;gap:8px;margin-bottom:8px}
.dz{border:2px dashed var(--g);background:var(--g2);border-radius:12px;padding:30px 14px;text-align:center;cursor:pointer;align-items:center}
.dz b{color:var(--g);font-size:1.1rem}.dz input{display:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.card{border:1px solid var(--bd);background:var(--cd);border-radius:10px;overflow:hidden;cursor:grab}.card.main{border:2px solid var(--g)}
.card .im{height:210px;background:#eef2f0;display:flex}.card img{width:100%;height:100%;object-fit:contain}
.meta{padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.meta em{background:var(--g);color:#fff;border-radius:6px;font-style:normal;font-size:.75rem;padding:0 8px}
.meta small{color:#b25e00;width:100%}.acts{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 10px}
.acts button{border:1px solid var(--bd);background:transparent;border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.85rem}
.rep{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rep .t{flex:1;min-width:200px}.rep small{display:block;color:var(--mu)}.rep button{padding:5px 12px;font-size:.88rem}
#md{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9;padding:12px}
.mb{background:var(--cd);border-radius:12px;padding:16px;max-width:96vw;max-height:94vh;overflow:auto}
.cw{position:relative;display:inline-block;touch-action:none;cursor:crosshair;line-height:0}.cw img{max-width:100%;max-height:62vh;display:block;user-select:none;-webkit-user-drag:none}
#cs{position:absolute;border:2px solid #00c060;background:#00c06030;display:none;pointer-events:none}
#ts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1c2a23;color:#fff;padding:10px 18px;border-radius:10px;z-index:20;max-width:92vw;text-align:center}
/* ---------- report pages ---------- */
#pv{display:none;--w:210mm;--h:296mm}body.pvon #pv{display:block;padding:8px 0}
.pg{width:var(--w);height:var(--h);background:#fff;color:#1c2a23;margin:0 auto 14px;padding:12mm 16mm 9mm;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 14px #0004;font-size:12pt;line-height:1.8;font-family:'Tajawal',sans-serif}
.ph{display:flex;justify-content:space-between;border-bottom:2px solid #006c35;padding-bottom:3mm;font-size:10pt;color:#006c35;font-weight:700}
.pb{flex:1;min-height:0;overflow:hidden;padding:5mm 0}
.pb.col{display:flex;flex-direction:column;gap:5mm}.pb.rw{display:flex;flex-direction:row;gap:5mm;flex-wrap:wrap}.pb.rw>.fr{flex:1 1 0}
.pf{border-top:1px solid #cfd8d3;padding-top:2mm;text-align:center;font-size:9.5pt;color:#66736c}
.blk{margin-bottom:5mm}.blk h3{color:#006c35;font-size:15pt;margin:0 0 2mm;border-right:4px solid #006c35;padding-right:3mm}
.blk h4{margin:2mm 0 0;font-size:12pt;color:#1c2a23}.blk p{margin:0 0 2mm;text-align:justify}.blk ol{margin:0;padding-right:7mm}.blk li{margin-bottom:1mm}
.it{display:grid;grid-template-columns:1fr 1fr;border:1px solid #cfd8d3;border-radius:2mm;overflow:hidden}.it div{padding:2mm 3mm;border-bottom:1px solid #e3e9e5;font-size:11.5pt}
.it b{color:#006c35;display:block;font-size:9.5pt}
.fr{margin:0;display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}.fr .ii{flex:1;min-height:0;background:#f3f6f4;display:flex}.fr img{width:100%;height:100%;object-fit:contain;display:block}
.fr figcaption{text-align:center;font-size:9.5pt;color:#66736c;padding-top:1.5mm}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:8mm;text-align:center}.sg b{display:block;font-size:13pt;margin:1mm 0 8mm}.sg i{font-style:normal;color:#66736c}
.cover{border-top:10mm solid #006c35;padding-top:8mm;text-align:center}.cover .cm{line-height:1.9;font-size:12pt}.cover .cm b{font-size:15pt;color:#006c35}
.cover .ct{margin-top:8mm;font-size:16pt;color:#006c35;font-weight:700}.cover .cn{font-size:26pt;font-weight:800;line-height:1.4;margin:2mm 0}.cover .cd{color:#66736c;margin-bottom:6mm}
.cover hr{border:0;border-top:2px solid #006c35;width:40mm;margin:4mm auto}
@page{size:A4 portrait;margin:0}
@media print{body{background:#fff}#app,#ts,#md{display:none!important}#pv{display:block!important;padding:0!important;zoom:1!important}.pg{margin:0;box-shadow:none;break-after:page}.pg:last-child{break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<style id="pgst"></style>
</head>
<body>
<div id="app">
<div class="top"><small>المملكة العربية السعودية • وزارة التعليم</small><h1>نظام تقارير النشاط المدرسي</h1><p>متوسطة المنذر بن عمرو الأنصاري</p></div>
<div class="wrap">
 <section id="home">
  <div class="tiles">
   <button class="tile" data-a="new"><b>إنشاء تقرير جديد</b><span>ابدأ تقريرًا خطوة بخطوة</span></button>
   <button class="tile" data-a="list"><b>التقارير السابقة</b><span>فتح أو تعديل أو نسخ التقارير المحفوظة</span></button>
   <button class="tile" data-a="pv"><b>معاينة التقرير</b><span>معاينة التقرير الحالي قبل الطباعة</span></button>
   <button class="tile" data-a="prt"><b>طباعة / تصدير PDF</b><span>ملف A4 عالي الجودة للأرشفة</span></button>
  </div>
 </section>
 <section id="list" hidden><div class="card0"><h2>التقارير السابقة</h2><div id="rl"></div><div class="row"><button class="ghost" data-a="home">الرئيسية</button></div></div></section>
 <section id="wiz" hidden><div class="card0"><ol class="stp" id="stp"></ol><div id="wz"></div>
  <div class="row"><button class="ghost" data-a="home">الرئيسية</button><button class="ghost" data-a="sv">حفظ</button><span class="sp"></span><button class="ghost" data-a="pr" id="bp">السابق</button><button class="b" data-a="nx" id="bn">التالي</button></div></div></section>
</div>
</div>
<div id="pv"></div>
<div id="md" hidden></div>
<div id="ts" hidden></div>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const n=v=>(+v).toLocaleString('ar-EG'),SCHOOL='متوسطة المنذر بن عمرو الأنصاري',pv=$('#pv');
const F=[['name','اسم النشاط *'],['type','نوع النشاط'],['field','المجال'],['date','تاريخ التنفيذ *','date'],['day','اليوم'],['audience','الفئة المستهدفة'],['count','عدد الطلاب المشاركين','number'],['place','مكان التنفيذ'],['executor','الجهة المنفذة'],['supervisor','المشرف على النشاط']];
const STEPS=['بيانات النشاط','وصف وأهداف النشاط','رفع الصور','ترتيب التقرير','المعاينة','تصدير PDF'];
let R=null,step=1,db,land=false;
const blank=()=>({id:uid(),name:'',type:'',field:'',date:'',day:'',audience:'',count:'',place:'',executor:'',supervisor:'عبدالله المويعزي',desc:'',goals:[''],impl:'',results:'',impact:'',outputs:'',recs:'',images:[],main:null,orient:'auto',created:Date.now(),updated:Date.now()});
let tt;const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4200)};
/* ---- storage (IndexedDB) ---- */
const openDB=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('activity-reports',1);q.onupgradeneeded=()=>q.result.createObjectStore('r',{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const tx=(m,f)=>new Promise((res,rej)=>{try{const t=db.transaction('r',m),q=f(t.objectStore('r'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}catch(e){rej(e)}});
const strip=r=>({...r,images:r.images.map(({id,src,w,h,low})=>({id,src,w,h,low}))});
async function save(){if(!R||!R.name.trim())return;R.updated=Date.now();try{await tx('readwrite',s=>s.put(strip(R)));return true}catch(e){toast('تعذر حفظ التقرير في المتصفح.')}}
/* ---- images ---- */
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
async function mkTh(x){const i=await loadImg(x.src),s=Math.min(1,900/Math.max(i.width,i.height)),c=E('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);x.th=c.toDataURL('image/jpeg',.85)}
async function setImg(x,c){x.src=c.toDataURL('image/jpeg',.95);x.w=c.width;x.h=c.height;x.low=Math.max(c.width,c.height)<1600;await mkTh(x)}
async function addFiles(files){for(const f of files){if(!f.type.startsWith('image/'))continue;try{const bm=await createImageBitmap(f,{imageOrientation:'from-image'});const m=Math.max(bm.width,bm.height),s=m>4500?4500/m:1,c=E('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const x={id:uid()};await setImg(x,c);R.images.push(x);gal()}catch(e){toast('تعذر قراءة الصورة: '+f.name)}}}
async function rot(i){const x=R.images[i],im=await loadImg(x.src),c=E('canvas');c.width=im.height;c.height=im.width;const g=c.getContext('2d');g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(im,0,0);await setImg(x,c);gal()}
function crop(i){const x=R.images[i],m=$('#md');m.innerHTML=`<div class="mb"><p>اسحب على الصورة لتحديد المنطقة المراد الإبقاء عليها</p><div class="cw"><img id="ci" src="${x.th||x.src}"><div id="cs"></div></div><div class="row"><button class="b" id="cok">تطبيق القص</button><button class="ghost" id="cx">إلغاء</button></div></div>`;m.hidden=false;
const cw=m.querySelector('.cw'),im=$('#ci'),s=$('#cs');let a=null,sel=null;const pt=e=>{const r=im.getBoundingClientRect();return{x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}};
cw.onpointerdown=e=>{a=pt(e);cw.setPointerCapture(e.pointerId)};
cw.onpointermove=e=>{if(!a)return;const p=pt(e);sel={x:Math.min(a.x,p.x),y:Math.min(a.y,p.y),w:Math.abs(a.x-p.x),h:Math.abs(a.y-p.y)};Object.assign(s.style,{display:'block',left:sel.x+'px',top:sel.y+'px',width:sel.w+'px',height:sel.h+'px'})};
cw.onpointerup=()=>a=null;$('#cx').onclick=()=>m.hidden=true;
$('#cok').onclick=async()=>{if(!sel||sel.w<10||sel.h<10){toast('حدد منطقة القص أولًا.');return}const k=x.w/im.clientWidth,src=await loadImg(x.src),c=E('canvas');c.width=Math.round(sel.w*k);c.height=Math.round(sel.h*k);c.getContext('2d').drawImage(src,sel.x*k,sel.y*k,sel.w*k,sel.h*k,0,0,c.width,c.height);await setImg(x,c);m.hidden=true;gal()}}
function gal(){document.querySelectorAll('.gal').forEach(g=>{g.innerHTML=R.images.map((x,i)=>`<div class="card ${x.id==R.main?'main':''}" draggable="true" data-i="${i}"><div class="im"><img src="${x.th||x.src}" alt=""></div><div class="meta"><b>صورة ${n(i+1)}</b>${x.id==R.main?'<em>رئيسية</em>':''}${x.low?'<small>⚠ دقة الصورة منخفضة. يفضّل رفع النسخة الأصلية الأعلى جودة.</small>':''}</div><div class="acts"><button data-a="main" data-i="${i}">رئيسية</button><button data-a="rot" data-i="${i}">تدوير</button><button data-a="crop" data-i="${i}">قص</button><button data-a="mv" data-i="${i}" data-d="-1">◂</button><button data-a="mv" data-i="${i}" data-d="1">▸</button><button class="dn" data-a="del" data-i="${i}">حذف</button></div></div>`).join('')||'<p class="mu">لم تُرفع صور بعد.</p>'})}
/* ---- wizard ---- */
const val=(k,l)=>`<label>${l}<textarea data-k="${k}">${esc(R[k])}</textarea></label>`;
function go(v){['home','list','wiz'].forEach(x=>$('#'+x).hidden=x!=v);if(v=='wiz')renderWz();else document.body.classList.remove('pvon');scrollTo(0,0)}
function ok(){if(!R.name.trim()){toast('يرجى إدخال اسم النشاط قبل إنشاء التقرير.');step=1;renderWz();return false}if(!R.date){toast('يرجى إدخال تاريخ النشاط قبل إنشاء التقرير.');step=1;renderWz();return false}return true}
async function goStep(i){if(i<1||i>6)return;if(i>1&&!ok())return;await save();step=i;renderWz();scrollTo(0,0)}
function renderWz(){
 $('#stp').innerHTML=STEPS.map((s,i)=>`<li class="${i+1==step?'on':i+1<step?'done':''}" data-a="go" data-i="${i+1}"><i>${n(i+1)}</i><br>${s}</li>`).join('');
 const w=$('#wz');let h='';
 if(step==1)h=`<h2>بيانات النشاط</h2><div class="grid">${F.map(([k,l,t])=>`<label>${l}<input data-k="${k}" type="${t||'text'}" value="${esc(R[k])}"></label>`).join('')}</div>`;
 if(step==2)h=`<h2>وصف وأهداف النشاط</h2>${val('desc','وصف النشاط')}<h2 style="margin-top:18px">أهداف النشاط</h2>${R.goals.map((g,i)=>`<div class="goal"><input data-g="${i}" value="${esc(g)}" placeholder="الهدف ${n(i+1)}"><button class="dn" data-a="rg" data-i="${i}">حذف</button></div>`).join('')}<button class="ghost" data-a="ag">+ إضافة هدف</button><div class="grid" style="margin-top:18px">${val('impl','تنفيذ النشاط')}${val('results','النتائج')}${val('impact','الأثر على الطلاب')}${val('outputs','المخرجات')}${val('recs','التوصيات (اختياري)')}</div>`;
 if(step==3)h=`<h2>رفع الصور</h2><label class="dz" id="dz"><b>اسحب الصور هنا أو اضغط لاختيار الصور</b><span class="mu">يفضل استخدام الصور الأصلية عالية الدقة لضمان وضوح الطلاب عند الطباعة.</span><input type="file" id="fi" accept="image/*" multiple></label><div class="gal"></div>`;
 if(step==4)h=`<h2>ترتيب التقرير</h2><p class="mu">اسحب البطاقات أو استخدم الأسهم لإعادة الترتيب، واختر «رئيسية» للصورة التي تظهر بحجم كبير في الغلاف وأول صفحات التوثيق.</p><label style="max-width:320px">اتجاه الصفحات<select data-k="orient"><option value="auto">تلقائي حسب الصور</option><option value="portrait">طولي (Portrait)</option><option value="landscape">عرضي (Landscape)</option></select></label><div class="gal"></div>`;
 if(step==5)h=`<h2>معاينة التقرير</h2><p class="mu">هذه نسخة مطابقة تقريبًا لما سيُطبع. تظهر الصفحات أدناه.</p>`;
 if(step==6)h=`<h2>تصدير PDF</h2><p>التقرير: <b>${esc(R.name)}</b> — عدد الصور: ${n(R.images.length)}</p><div class="row"><button class="b" data-a="prt">تصدير PDF / طباعة</button><button class="ghost" data-a="sv">حفظ التقرير</button><button class="ghost" data-a="new">تقرير جديد</button></div><p class="mu">في نافذة الطباعة اختر الوجهة «حفظ بتنسيق PDF»، والمقاس A4، والهوامش «بلا»، وأوقف «الرؤوس والتذييلات» ليحافظ الملف على الجودة الكاملة للنص والصور.</p>`;
 w.innerHTML=h;if(step==4)w.querySelector('select').value=R.orient;
 if(step==3||step==4)gal();
 if(step==3){const dz=$('#dz');$('#fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};dz.ondragover=e=>e.preventDefault();dz.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)}}
 $('#bp').hidden=step==1;$('#bn').hidden=step==6;
 document.body.classList.toggle('pvon',step==5);if(step==5)build();
}
$('#wz').addEventListener('input',e=>{const t=e.target;if(t.dataset.g!=null)R.goals[+t.dataset.g]=t.value;else if(t.dataset.k){R[t.dataset.k]=t.value;if(t.dataset.k=='date'&&t.value){R.day=new Date(t.value+'T00:00').toLocaleDateString('ar-SA',{weekday:'long'});const d=$('[data-k=day]');if(d)d.value=R.day}}});
/* ---- report build ---- */
const fmt=d=>{if(!d)return'';const g=new Date(d+'T00:00'),o={day:'numeric',month:'long',year:'numeric'};return`${g.toLocaleDateString('ar-SA-u-ca-islamic-umalqura',o)} — ${g.toLocaleDateString('ar-SA-u-ca-gregory',o)}م`};
const isLand=()=>R.orient=='landscape'||(R.orient=='auto'&&R.images.length>=2&&R.images.filter(x=>x.w/x.h>1.15).length/R.images.length>=.7);
const P=t=>String(t).split(/\n+/).filter(s=>s.trim()).map(esc);
const fig=(x,cap)=>`<figure class="fr"><div class="ii"><img src="${x.src}" alt=""></div><figcaption>${cap}</figcaption></figure>`;
function newPage(){const p=E('div','pg',`<div class="ph"><span>${SCHOOL}</span><span>وزارة التعليم</span></div><div class="pb"></div><div class="pf"></div>`);pv.appendChild(p);return p}
function flow(blocks){let p=newPage(),b=p.querySelector('.pb');for(const h of blocks){const d=E('div','blk',h);b.appendChild(d);if(b.scrollHeight>b.clientHeight+1&&b.children.length>1){b.removeChild(d);p=newPage();b=p.querySelector('.pb');b.appendChild(d)}}}
async function build(){
 await document.fonts.ready;land=isLand();pv.style.setProperty('--w',land?'297mm':'210mm');pv.style.setProperty('--h',land?'209mm':'296mm');
 $('#pgst').textContent=`@page{size:A4 ${land?'landscape':'portrait'};margin:0}`;pv.innerHTML='';
 const im=R.images,mx=im.find(x=>x.id==R.main),cv=mx||im[0],gi=x=>im.indexOf(x)+1;
 pv.appendChild(E('div','pg cover',`<div class="cm">المملكة العربية السعودية<br><b>وزارة التعليم</b><br>الإدارة التعليمية<br><b style="color:#1c2a23;font-size:13pt">${SCHOOL}</b></div><hr><div class="ct">تقرير نشاط مدرسي</div><div class="cn">${esc(R.name)}</div><div class="cd">${fmt(R.date)}</div>${cv?fig(cv,''):''}`));
 let k=0;const T=t=>`<h3>${n(++k)}. ${t}</h3>`,paras=(t,pre='')=>P(t).map((x,i)=>(i?'':pre)+`<p>${x}</p>`);
 const A=[T('بيانات النشاط')+`<div class="it">${F.map(([key,l])=>`<div><b>${l.replace(' *','')}</b>${esc(key=='date'?fmt(R.date):R[key])||'—'}</div>`).join('')}</div>`];
 if(R.desc.trim())A.push(...paras(R.desc,T('وصف النشاط')));
 const gs=R.goals.filter(g=>g.trim());if(gs.length)A.push(T('أهداف النشاط')+`<ol>${gs.map(g=>`<li>${esc(g)}</li>`).join('')}</ol>`);
 if(R.impl.trim())A.push(...paras(R.impl,T('آلية التنفيذ')));
 const rs=[['النتائج',R.results],['الأثر على الطلاب',R.impact],['المخرجات',R.outputs]].filter(x=>x[1].trim());let f=1;
 rs.forEach(([l,t])=>paras(t,(f?(f=0,T('النتائج والأثر')):'')+`<h4>${l}</h4>`).forEach(x=>A.push(x)));
 const mkB=()=>{const B=[];if(R.recs.trim())B.push(...paras(R.recs,T('التوصيات')));B.push(T('الاعتماد والتوقيع')+`<div class="sg"><div>رائد النشاط<b>عبدالله المويعزي</b><i>التوقيع: ..................</i></div><div>مدير المدرسة<b>خالد المطيري</b><i>التوقيع: ..................</i></div></div>`);return B};
 if(im.length){flow(A);const rest=im.filter(x=>x!==mx),groups=[];if(mx)groups.push([mx]);for(let i=0;i<rest.length;i+=2)groups.push(rest.slice(i,i+2));
  groups.forEach((g,gx)=>{const p=newPage(),b=p.querySelector('.pb');b.className='pb '+(land?'rw':'col');if(gx==0)b.insertAdjacentHTML('afterbegin',`<div style="flex:0 0 100%">${T('الصور والتوثيق')}</div>`);g.forEach(x=>b.insertAdjacentHTML('beforeend',fig(x,x==mx?'الصورة الرئيسية':'صورة '+n(gi(x)))))});
  flow(mkB())}else flow([...A,...mkB()]);
 const ps=[...pv.children];ps.forEach((p,i)=>{const o=p.querySelector('.pf');if(o)o.textContent=`تقرير نشاط مدرسي | صفحة ${n(i+1)} من ${n(ps.length)}`});
 fit();await Promise.all([...pv.querySelectorAll('img')].map(i=>i.decode().catch(()=>0)));
}
const fit=()=>{pv.style.zoom=Math.min(1,(innerWidth-16)/((land?297:210)*96/25.4))};addEventListener('resize',()=>{if(R&&pv.children.length)fit()});
async function doPrint(){if(!R||!ok())return;await save();await build();toast('اختر «حفظ بتنسيق PDF» من نافذة الطباعة.');setTimeout(()=>{try{window.print()}catch(e){toast('تعذر فتح نافذة الطباعة، جرّب Ctrl+P.')}},400)}
/* ---- list ---- */
async function list(){let a=[];try{a=await tx('readonly',s=>s.getAll())||[]}catch(e){toast('تعذر قراءة التقارير المحفوظة.')}a.sort((x,y)=>y.updated-x.updated);const d=t=>new Date(t).toLocaleString('ar-SA-u-ca-gregory',{dateStyle:'medium',timeStyle:'short'});
 $('#rl').innerHTML=a.map(r=>`<div class="rep"><div class="t"><b>${esc(r.name)}</b><small>تاريخ النشاط: ${r.date?fmt(r.date):'—'} • أُنشئ: ${d(r.created)} • آخر تعديل: ${d(r.updated)}</small></div><button class="b" data-a="open" data-id="${r.id}">فتح</button><button class="ghost" data-a="edit" data-id="${r.id}">تعديل</button><button class="ghost" data-a="dup" data-id="${r.id}">نسخ</button><button class="ghost" data-a="exp" data-id="${r.id}">تصدير PDF</button><button class="dn" data-a="rm" data-id="${r.id}">حذف</button></div>`).join('')||'<p class="mu">لا توجد تقارير محفوظة بعد.</p>'}
async function load(id){R=await tx('readonly',s=>s.get(id));await Promise.all(R.images.map(mkTh))}
/* ---- events ---- */
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,id=t.dataset.id;
 const need=()=>{if(!R)toast('ابدأ بإنشاء تقرير جديد أو افتح تقريرًا سابقًا.');return !!R};
 if(a=='new'){R=blank();step=1;go('wiz')}
 else if(a=='list'){await list();go('list')}
 else if(a=='home'){await save();go('home')}
 else if(a=='pv'){if(need()&&ok()){step=5;go('wiz')}}
 else if(a=='prt'){if(need())doPrint()}
 else if(a=='go')goStep(i);else if(a=='nx')goStep(step+1);else if(a=='pr')goStep(step-1)
 else if(a=='sv'){if(ok()&&await save())toast('تم حفظ التقرير.')}
 else if(a=='ag'){R.goals.push('');renderWz();$('#wz').querySelectorAll('[data-g]').forEach((x,j,l)=>j==l.length-1&&x.focus())}
 else if(a=='rg'){R.goals.splice(i,1);if(!R.goals.length)R.goals=[''];renderWz()}
 else if(a=='main'){R.main=R.images[i].id;gal()}
 else if(a=='rot')rot(i);else if(a=='crop')crop(i)
 else if(a=='mv'){const j=i+ +t.dataset.d;if(j>=0&&j<R.images.length){const[x]=R.images.splice(i,1);R.images.splice(j,0,x);gal()}}
 else if(a=='del'){const[x]=R.images.splice(i,1);if(R.main==x.id)R.main=null;gal()}
 else if(a=='open'||a=='edit'){await load(id);step=a=='open'?5:1;go('wiz')}
 else if(a=='exp'){await load(id);doPrint()}
 else if(a=='dup'){await load(id);R={...R,id:uid(),name:R.name+' (نسخة)',created:Date.now()};await save();await list();toast('تم نسخ التقرير.')}
 else if(a=='rm'){if(t.dataset.c){await tx('readwrite',s=>s.delete(id));if(R&&R.id==id)R=null;await list()}else{t.dataset.c=1;t.textContent='تأكيد الحذف'}}
});
let dr=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.card');if(c)dr=+c.dataset.i});
document.addEventListener('dragover',e=>{if(dr!=null&&e.target.closest?.('.card'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest?.('.card');if(c&&dr!=null){e.preventDefault();const[x]=R.images.splice(dr,1);R.images.splice(+c.dataset.i,0,x);dr=null;gal()}});
openDB().catch(()=>toast('التخزين المحلي غير متاح في هذا المتصفح، لن تُحفظ التقارير.'));
</script>
</body>
</html>
