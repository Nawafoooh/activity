// دمج الوظائف التشغيلية
function statusClass(s){
  if((s||"").includes("أخضر")||(s||"").includes("معالج")||(s||"").includes("مكتمل")) return "green";
  if((s||"").includes("أصفر")||(s||"").includes("يحتاج")||(s||"").includes("قيد")) return "amber";
  if((s||"").includes("أحمر")||(s||"").includes("متعثر")) return "red";
  return "blue";
}

function row(cells){
  return "<tr>"+cells.map((x,i)=>`<td>${i===cells.length-1?`<span class="status ${statusClass(x)}">${x}</span>`:x}</td>`).join("")+"</tr>";
}

function renderData(){
  const q=(document.getElementById("dataSearch").value||"").toLowerCase();
  document.getElementById("dataRows").innerHTML=data.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q)).map(x=>row([x.s,x.i,x.v,x.p,x.n])).join("")||'<tr><td colspan="5" class="empty">لا توجد نتائج</td></tr>';
}

function renderCoverage(){
  const q=(document.getElementById("covSearch").value||"").toLowerCase(), f=document.getElementById("covFilter").value;
  document.getElementById("coverageRows").innerHTML=coverage.filter(x=>(!f||x.status===f)&&Object.values(x).join(" ").toLowerCase().includes(q)).map(x=>row([x.code,x.name,x.level,x.status,x.program||"—"])).join("");
}

function renderPrograms(){

  document.getElementById("programRows").innerHTML=programs.filter(x=>x.join(" ").toLowerCase().includes(q)).map(x=>row(x)).join("");
}

function renderActions(){

function renderRisks(){document.getElementById("riskRows").innerHTML=risks.map(x=>row(x)).join("");}
function renderFollow(){document.getElementById("followRows").innerHTML=follow.map(x=>row(x)).join("");}

function addNote(){
  const t=document.getElementById("noteTitle").value.trim(), n=document.getElementById("noteText").value.trim();
  if(!t||!n)return;
  const arr=JSON.parse(localStorage.getItem("planNotes")||"[]");
  arr.unshift({t,n,d:new Date().toLocaleString("ar-SA")});
  localStorage.setItem("planNotes",JSON.stringify(arr));
  document.getElementById("noteTitle").value="";
  document.getElementById("noteText").value="";
  renderNotes();
}

function renderNotes(){
  const arr=JSON.parse(localStorage.getItem("planNotes")||"[]");
  document.getElementById("notesList").innerHTML=arr.length?arr.map((x,i)=>`<div class="panel" style="box-shadow:none;margin-bottom:10px"><b>${x.t}</b><div>${x.n}</div><small class="muted">${x.d}</small></div>`).join(""):'<div class="empty">لم تُسجل قرارات بعد.</div>';
}

function closeModal(){document.getElementById("modal").classList.remove("show");}

document.querySelectorAll(".navbtn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(b.dataset.view).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}));
