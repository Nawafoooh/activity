<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة خطة تحسين المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --green-900:#0A4A3A;--green-700:#0F6B52;--teal-600:#0E8C86;--teal-100:#D9F0EE;
  --ink:#13231F;--muted:#4D605A;--bg:#F2F6F4;--surface:#FFFFFF;--line:#D3DFDA;--soft:#E9F1EE;
  --warn-ink:#8A5300;--warn-bg:#FFF1D6;--bad-ink:#A32A22;--bad-bg:#FDE8E6;--ok-ink:#0F6B52;--ok-bg:#DFF2E8;
  --side-bg:#0A4A3A;--side-ink:#EAF6F1;--side-active:#0E8C86;--focus:#0E8C86;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --green-900:#8FDDBE;--green-700:#5CCB9A;--teal-600:#38C2B8;--teal-100:#17332F;
    --ink:#E6F0ED;--muted:#9DB3AC;--bg:#0D1715;--surface:#142320;--line:#28403A;--soft:#1B2E2A;
    --warn-ink:#F2B75A;--warn-bg:#3A2D12;--bad-ink:#FF9C93;--bad-bg:#3B1A18;--ok-ink:#7FDDB0;--ok-bg:#16352B;
    --side-bg:#0A1F1A;--side-ink:#DCEEE8;--side-active:#0E8C86;--focus:#38C2B8;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green-900:#8FDDBE;--green-700:#5CCB9A;--teal-600:#38C2B8;--teal-100:#17332F;
  --ink:#E6F0ED;--muted:#9DB3AC;--bg:#0D1715;--surface:#142320;--line:#28403A;--soft:#1B2E2A;
  --warn-ink:#F2B75A;--warn-bg:#3A2D12;--bad-ink:#FF9C93;--bad-bg:#3B1A18;--ok-ink:#7FDDB0;--ok-bg:#16352B;
  --side-bg:#0A1F1A;--side-ink:#DCEEE8;--side-active:#0E8C86;--focus:#38C2B8;color-scheme:dark;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
bdi{unicode-bidi:isolate}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100%;display:grid;grid-template-columns:272px minmax(0,1fr)}
/* sidebar */
.side{background:var(--side-bg);color:var(--side-ink);position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.brand svg{width:44px;height:44px;flex:none;color:#7FE3D6}
.brand b{display:block;font-size:17px;line-height:1.35;font-weight:700}
.brand small{display:block;opacity:.75;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:10px 14px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;border-inline-start:4px solid transparent}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:rgba(14,140,134,.35);border-inline-start-color:#7FE3D6;font-weight:700}
.side-foot{margin-top:auto;font-size:12.5px;opacity:.75;padding:0 6px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:700;color:var(--green-900)}
.top .phase{color:var(--muted);font-size:14px}
.top .grow{flex:1}
.savestate{font-size:13px;color:var(--muted)}
.menu-btn{display:none}
.notice{background:var(--warn-bg);color:var(--warn-ink);padding:10px 24px;font-size:14.5px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice a{color:inherit;font-weight:700}
.content{padding:24px;max-width:1120px;width:100%}
.sec{display:none}.sec.on{display:block}
.sec>h2{font-size:26px;font-weight:700;color:var(--green-900);margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:20px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:18px;font-weight:700;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--green-700);background:var(--green-700);color:#fff;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--green-700)}
.btn.warn{background:transparent;color:var(--bad-ink);border-color:var(--bad-ink)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:14px}
:root[data-theme="dark"] .btn:not(.alt):not(.warn){color:#06201A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt):not(.warn){color:#06201A}}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* urgent */
.urgent{background:var(--green-700);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:18px}
:root[data-theme="dark"] .urgent{background:#0F5A47;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .urgent{background:#0F5A47;color:#fff}}
.urgent .when{display:inline-block;background:rgba(255,255,255,.18);padding:3px 14px;border-radius:99px;font-weight:600;font-size:14.5px}
.urgent .when.late{background:var(--bad-bg);color:var(--bad-ink)}
.urgent h2{font-size:30px;line-height:1.35;font-weight:700;margin:12px 0 6px}
.urgent p{opacity:.92;max-width:62ch}
.urgent ul{margin:12px 0 0;padding-inline-start:20px}
.urgent .out{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-weight:600}
.urgent .btn{background:#fff;color:#0A4A3A;border-color:#fff}
.stat{padding:16px 18px}
.stat .n{font-size:32px;font-weight:700;color:var(--green-900);line-height:1.2}
.stat .l{color:var(--muted);font-size:14.5px}
.ribbon{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}
.ribbon div{height:12px;border-radius:6px;background:var(--soft)}
.ribbon .s-done{background:var(--green-700)}.ribbon .s-doing{background:var(--teal-600)}.ribbon .s-late{background:var(--bad-ink)}.ribbon .s-block{background:var(--warn-ink)}
.ribbon-l{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:13px;color:var(--muted);text-align:center}
/* chips + bars */
.chip{display:inline-block;padding:1px 12px;border-radius:99px;font-size:13.5px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--ok-bg);color:var(--ok-ink)}.chip.doing{background:var(--teal-100);color:var(--teal-600)}
.chip.block{background:var(--warn-bg);color:var(--warn-ink)}.chip.late{background:var(--bad-bg);color:var(--bad-ink)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal-600);width:0;transition:width .35s ease}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li:last-child{border-bottom:0}
/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl>li{position:relative;padding:0 38px 20px 0}
.tl>li::before{content:"";position:absolute;inset-inline-start:auto;right:13px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl .dot{position:absolute;right:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--soft);border:2px solid var(--teal-600);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--green-900)}
.tl .dot.d-done{background:var(--green-700);border-color:var(--green-700);color:#fff}
.tl .dot.d-late{border-color:var(--bad-ink)}
.tl .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tl .row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.tl h3{font-size:17px}
.meta{color:var(--muted);font-size:14px}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
.fld{display:block}
.fld .lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.fld .req{color:var(--bad-ink);margin-inline-start:3px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--teal-600)}
.fld.invalid input,.fld.invalid select,.fld.invalid textarea,input[aria-invalid=true]{border-color:var(--bad-ink);background:var(--bad-bg)}
.err{display:none;color:var(--bad-ink);font-size:13.5px;margin-top:3px}
.fld.invalid .err,.err.show{display:block}
.full{grid-column:1/-1}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green-700)}
.rec{background:var(--teal-100);border-radius:10px;padding:10px 14px;font-size:14.5px}
/* rows */
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 190px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.done .ttitle{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.outrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 190px;gap:10px;align-items:center;margin-top:10px;padding:12px 14px;background:var(--teal-100);border-radius:10px}
.outrow label.chk{display:flex;gap:8px;align-items:center;font-weight:600}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
details.week>summary{cursor:pointer;padding:14px 18px;list-style:none}
details.week>summary::-webkit-details-marker{display:none}
details.week>summary::after{content:"﹀";float:left;color:var(--muted)}
details.week[open]>summary::after{content:"︿"}
details.week .inner{padding:0 18px 16px}
.sumline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sumline b{font-size:17px}
.wsum .bar{margin-top:8px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.filters .fld{min-width:180px}
/* cards for interventions / skills */
.ic{border-inline-start:5px solid var(--teal-600)}
.ic.s-done{border-inline-start-color:var(--green-700)}.ic.s-block{border-inline-start-color:var(--warn-ink)}
.ic .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:start}
.ic .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stage{background:var(--soft);border-radius:10px;padding:10px 12px}
.stage h4{font-size:14.5px;margin-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto}
.calc{margin-top:12px;font-size:15px}
.calc .line{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.calc b{color:var(--green-900)}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:14.5px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 110px 110px 90px 50px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rate{font-weight:700;color:var(--green-900)}
/* indicators */
.ind h3{font-size:16px;color:var(--muted);font-weight:600}
.ind .v{font-size:30px;font-weight:700;color:var(--green-900);line-height:1.3}
.ind .f{font-size:13.5px;color:var(--muted);margin-top:6px}
.weeks-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.weeks-tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600}
.weeks-tabs button[aria-pressed=true]{background:var(--green-700);color:#fff;border-color:var(--green-700)}
dl.all{margin:0;display:grid;grid-template-columns:210px minmax(0,1fr);gap:6px 14px;font-size:15px}
dl.all dt{color:var(--muted);font-weight:600}
dl.all dd{margin:0;white-space:pre-wrap}
input:disabled,select:disabled,textarea:disabled{opacity:.75;cursor:not-allowed}
pre.rules{direction:ltr;text-align:left;background:var(--soft);padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;white-space:pre}
#rptPrint{display:none}
.ins{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:10px;align-items:start}
textarea.gen{min-height:460px;font-size:15.5px;line-height:1.95}
@media print{body.print-report .sec{display:none!important}body.print-report #rptPrint{display:block;white-space:pre-wrap;font-size:13pt;line-height:1.9;color:#000;padding:0 8mm}}
.side-foot button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:2px 6px;opacity:.9}
.side-foot .bad{color:#FFB4AC;margin-top:4px}
a.tool,.meta a{color:var(--teal-600);font-weight:600}
.drow{display:grid;grid-template-columns:1fr 100px 1.6fr 110px 130px 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow{display:grid;grid-template-columns:34px minmax(0,1.6fr) 130px 140px minmax(0,1fr) 110px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .cn{font-weight:700;color:var(--muted)}
.rg{display:flex;gap:14px;flex-wrap:wrap}.rg label,.chkgrid label{display:flex;gap:6px;align-items:center;cursor:pointer}
.chkgrid{display:flex;gap:14px;flex-wrap:wrap}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.obsrow{display:grid;grid-template-columns:minmax(0,1.4fr) 180px minmax(0,1.2fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.regt td{padding:4px 6px}.regt input[type=text]{min-width:130px}.regt input[type=number]{width:78px}
.tick{color:var(--ok-ink);font-weight:700;margin-inline-start:4px;display:inline-block;min-width:14px}
@media (max-width:900px){.drow,.crow,.obsrow,.qrow{grid-template-columns:1fr}}
/* toast + dialog */
#toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast div{background:var(--green-900);color:#fff;padding:10px 20px;border-radius:12px;font-weight:600;max-width:90%;animation:pop .2s ease}
:root[data-theme="dark"] #toast div{color:#06201A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast div{color:#06201A}}
#toast div.bad{background:var(--bad-ink);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;max-width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-size:19px;margin-bottom:8px}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;right:0;width:min(300px,86vw);height:auto;z-index:50;transform:translateX(100%);transition:transform .25s ease;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .menu-btn{display:inline-flex}
  .content{padding:16px}.top,.notice{padding-inline:16px}
  .urgent{padding:20px}.urgent h2{font-size:24px}
  .trow,.outrow{grid-template-columns:1fr}
  .stages{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr}
  dl.all{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .side,.top,.notice,.btns,.filters,.menu-btn,form,#toast{display:none!important}
  .app{display:block}.content{max-width:none;padding:0}
  details.week{break-inside:avoid}details.week:not([open]) .inner{display:block}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="التنقل الرئيسي">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="24" cy="24" r="22"/><circle cx="24" cy="24" r="16" opacity=".55"/>
        <path d="M12 33c4-2 8-2 12 0 4-2 8-2 12 0v-8c-4-2-8-2-12 0-4-2-8-2-12 0z" fill="currentColor" fill-opacity=".85" stroke="none"/>
        <path d="M24 24v-9"/><path d="M24 15c-3-3-6-3-8-2M24 15c3-3 6-3 8-2M24 15c-2-4-1-6 0-7M24 15c2-4 1-6 0-7"/>
      </svg>
      <div><b>متابعة خطة تحسين المدرسة</b><small>أداة مدرسية للمتابعة الأسبوعية</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <p class="side-foot">لوحة مدرسية مستقلة، وليست بوابة الوزارة أو أحد أنظمتها.</p>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="btn alt sm menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">القائمة</button>
      <h1>متابعة خطة تحسين المدرسة</h1>
      <span class="phase">المرحلة الأولى: 11 أكتوبر – 31 ديسمبر 2026 · المرحلة الثانية: 1 يناير – 31 مارس 2027</span>
      <span class="grow"></span>
      <span class="savestate" id="saveState" aria-live="polite">جاهز</span>
    </header>
    
    <main class="content" id="content">
      <section class="sec" id="sec-home" aria-labelledby="h-home"></section>
      <section class="sec" id="sec-timeline" aria-labelledby="h-timeline"></section>
      <section class="sec" id="sec-tasks" aria-labelledby="h-tasks"></section>
      <section class="sec" id="sec-interventions" aria-labelledby="h-interventions"></section>
      <section class="sec" id="sec-measure" aria-labelledby="h-measure"></section>
      <section class="sec" id="sec-attendance" aria-labelledby="h-attendance"></section>
      <section class="sec" id="sec-observation" aria-labelledby="h-observation"></section>
      <section class="sec" id="sec-report" aria-labelledby="h-report"></section>
      <section class="sec" id="sec-generator" aria-labelledby="h-generator"></section>
      <section class="sec" id="sec-checklist" aria-labelledby="h-checklist"></section>
      <section class="sec" id="sec-indicators" aria-labelledby="h-indicators"></section>
      <section class="sec" id="sec-diagnosis" aria-labelledby="h-diagnosis"></section>
      <section class="sec" id="sec-register" aria-labelledby="h-register"></section>
      <section class="sec" id="sec-effect" aria-labelledby="h-effect"></section>
      <section class="sec" id="sec-practices" aria-labelledby="h-practices"></section>
    </main>
  </div>
</div>
<div id="rptPrint" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

async function offerFile(name,data){

function weekStat(w){
  const total=w.tasks.length,sts=w.tasks.map(t=>(S.tasks[t.id]||{}).status||'todo');
  const done=sts.filter(s=>s==='done').length,sub=!!(S.outputs[w.id]||{}).submitted;
  const block=sts.includes('block'),started=sts.some(s=>s==='doing'||s==='done');
  const late=!sub&&daysTo(w.due)<0;
  const key=(sub&&done===total)?'done':late?'late':block?'block':(started||sub)?'doing':'todo';
  return {total,done,sub,key,pct:total?done/total*100:0};
}
const WL={done:'مكتمل',late:'متأخر',block:'عائق',doing:'قيد التنفيذ',todo:'لم يبدأ'};
const chip=k=>'<span class="chip '+k+'">'+WL[k]+'</span>';
function mileKey(m){const st=(S.miles[m.id]||{}).status||'todo';if(st!=='done'&&daysTo(m.due)<0)return 'late';return st}
const mileChip=m=>{const k=mileKey(m);return '<span class="chip '+k+'">'+(k==='late'?'متأخر':lab(TS,k))+'</span>'};
function rate(a,b){return b>0?a/b*100:null}
function intStats(){const t=S.interventions.length,d=S.interventions.filter(i=>i.status==='done').length,b=S.interventions.filter(i=>i.status==='block').length;return{t,d,b,rate:rate(d,t)}}
function attStats(){let e=0,a=0,held=0;const planned=S.sessions.length;S.sessions.forEach(s=>{if(s.held===false)return;held++;const x=N(s.expected),y=N(s.actual);if(x!=null&&y!=null&&x>0&&y<=x){e+=x;a+=y}});return{e,a,rate:rate(a,e),n:planned,held,execRate:rate(held,planned)}}
function stageVal(s,k){const m=N(s[k+'M']),n=N(s[k+'N']);if(m==null&&n==null)return{state:'empty'};if(m==null||n==null)return{state:'part'};
  if(!Number.isInteger(m)||!Number.isInteger(n)||m<0||n<=0||m>n)return{state:'err'};return{state:'ok',v:m/n*100}}
function skillCalc(s){const st={};STAGES.forEach(([k])=>st[k]=stageVal(s,k));
  const b=st.base.state==='ok'?st.base.v:null;let last=null,lk=null;['first','interim','final'].forEach(k=>{if(st[k].state==='ok'){last=st[k].v;lk=k}});
  const imp=(b!=null&&last!=null)?last-b:null;const tg=N(s.target);const ach=(tg>0&&last!=null)?last/tg*100:null;
  return{st,b,last,lk,imp,tg,ach}}

const addDays=(iso,n)=>{const d=pd(iso);d.setDate(d.getDate()+n);return isoOf(d)};

  if(c.b==null)return 'سجّل خط الأساس لهذه المهارة أولًا';
  if(c.last==null)return 'نفّذ القياس المرحلي بأداة مكافئة للقياس القبلي';

  if(c.imp<0)return 'التكثيف، ومراجعة أداة القياس والتدخل لاحتمال عدم التوافق';
  if(c.imp<THRESH.impMid)return 'التكثيف، وإعادة تنظيم المجموعات وفق الاحتياج';
  if(c.imp<THRESH.impStrong)return 'الاستمرار مع تعديل التدخل والمجموعات';
  return 'الاستمرار على التدخل الحالي'}
function scopeOf(sc){

  const blocked=[];ws.forEach(({w})=>w.tasks.forEach(t=>{if((S.tasks[t.id]||{}).status==='block')blocked.push({w,t})}));

  const noOwner=ws.reduce((a,x)=>a+x.w.tasks.filter(t=>((S.tasks[t.id]||{}).status==='done')&&!String((S.tasks[t.id]||{}).owner||'').trim()).length,0);

  /* interventions */

  /* attendance */
  const sess=S.sessions.filter(s=>inR(s.date,o.from,o.to)),sessH=sess.filter(s=>s.held!==false);let e=0,a=0,badS=0;const sl=[];
  sessH.forEach(s=>{const x=N(s.expected),y=N(s.actual);if(x>0&&y!=null&&y>=0&&y<=x){e+=x;a+=y;sl.push({s,r:y/x*100})}else badS++});sl.sort((p,q)=>p.r-q.r);
  const att={e,a,n:sess.length,nh:sessH.length,rate:rate(a,e),exec:rate(sessH.length,sess.length)};

  if(noEv){add('warn',noEv+' تدخلات منفذة بلا دليل موثّق.');recs.push('استكمال الأدلة لـ '+noEv+' تدخلات منفذة قبل رفع التقرير.')}

    if(withImp.length>1){add('good','أعلى تحسن في «'+best.s.name+'» ('+PPT(best.c.imp)+').');add(worst.c.imp<THRESH.impMid?'warn':'info','أقل تحسن في «'+worst.s.name+'» ('+PPT(worst.c.imp)+').')}}

/* ----- 03: سجل رصد إتقان المهارات ----- */
function regCalc(rg){const cut=N(rg.cut),stu=Object.keys(rg.students||{}).map(id=>Object.assign({id},rg.students[id])),st={};
  STAGES.forEach(([k])=>{const m=stu.filter(s=>N((s.sc||{})[k])!=null),ok=cut>0?m.filter(s=>N(s.sc[k])>=cut):[];st[k]={n:m.length,m:ok.length,p:(m.length&&cut>0)?ok.length/m.length*100:null}});
  let lk=null;STAGES.forEach(([k])=>{if(st[k].n>0)lk=k});
  const follow=(lk&&cut>0)?stu.filter(s=>N((s.sc||{})[lk])!=null&&N(s.sc[lk])<cut):[];return{stu,st,lk,follow,cut}}
function stuDec(s,cut){if(!(cut>0))return '—';let v=null;STAGES.forEach(([k])=>{const x=N((s.sc||{})[k]);if(x!=null)v=x});return v==null?'—':(v>=cut?'متقن':'غير متقن')}
function regCalcHtml(rg){const c=regCalc(rg);
  const row=(t,f)=>'<tr><th>'+t+'</th>'+STAGES.map(([k])=>'<td><bdi>'+f(c.st[k])+'</bdi></td>').join('')+'</tr>';
  return '<div class="tablewrap"><table><thead><tr><th></th>'+STAGES.map(([k,l])=>'<th>'+esc(l.replace(' (خط الأساس)',''))+'</th>').join('')+'</tr></thead><tbody>'+row('عدد المقيمين',x=>x.n)+row('عدد المتقنين',x=>x.m)+row('نسبة الإتقان %',x=>x.p==null?'—':r1(x.p).toLocaleString('en-US')+'%')+'</tbody></table></div>'+
  (c.cut>0?'':'<p class="err show">حدّد درجة الإتقان لتُحسب النتائج.</p>')+
  '<p style="margin-top:10px"><b>قائمة المتابعة الفردية'+(c.lk?' (غير المتقنين في '+esc(lab(STAGES,c.lk).replace(' (خط الأساس)',''))+')':'')+':</b> '+(c.follow.length?c.follow.map(s=>esc(s.name||'—')).join('، '):'<span class="meta">لا أحد حاليًا.</span>')+'</p>'}
function syncSkill(skillId){const s=S.skills.find(x=>x.id===skillId);if(!s)return;const regs=S.registers.filter(r=>r.skillId===skillId);if(!regs.length)return;
  STAGES.forEach(([k])=>{let n=0,m=0;regs.forEach(r=>{const c=regCalc(r);if(c.cut>0){n+=c.st[k].n;m+=c.st[k].m}});if(n>0){s[k+'N']=n;s[k+'M']=m}})}
function updateRegDom(rg){const cut=N(rg.cut);Object.keys(rg.students||{}).forEach(id=>{const s=rg.students[id],d=$('[data-rdec="'+id+'"]');if(d)d.textContent=stuDec(s,cut);
    STAGES.forEach(([k])=>{const tk=$('[data-tick="'+id+':'+k+'"]'),v=N((s.sc||{})[k]);if(tk)tk.textContent=(v!=null&&cut>0&&v>=cut)?'✓':''})});
  const cl=$('#rcalc-'+rg.id);if(cl)cl.innerHTML=regCalcHtml(rg)}
function regCard(rg){const c=regCalc(rg),max=N(rg.max),sk=S.skills.find(x=>x.id===rg.skillId);
  const rows=c.stu.map((s,i)=>'<tr><td>'+(i+1)+'</td><td><input type="text" data-col="registers" data-id="'+rg.id+'" data-st="'+s.id+'" data-k="name" value="'+esc(s.name||'')+'" aria-label="اسم الطالب أو رمزه"></td>'+
    STAGES.map(([k])=>{const v=N((s.sc||{})[k]);return '<td style="white-space:nowrap"><input type="number" min="0"'+(max?' max="'+max+'"':'')+' step="any" data-t="n" data-col="registers" data-id="'+rg.id+'" data-st="'+s.id+'" data-sc="'+k+'" value="'+(v==null?'':v)+'" aria-label="'+esc(lab(STAGES,k))+'"><b class="tick" data-tick="'+s.id+':'+k+'">'+((v!=null&&c.cut>0&&v>=c.cut)?'✓':'')+'</b></td>'}).join('')+
    '<td data-rdec="'+s.id+'"><b>'+stuDec(s,c.cut)+'</b></td><td><input type="text" data-col="registers" data-id="'+rg.id+'" data-st="'+s.id+'" data-k="grp" value="'+esc(s.grp||'')+'" placeholder="المجموعة / الإجراء التالي"></td><td><button class="btn warn sm" type="button" data-act="delStu" data-id="'+rg.id+'" data-stu="'+s.id+'" aria-label="حذف الطالب">×</button></td></tr>').join('');
  return '<article class="card" data-reg="'+rg.id+'"><div class="sumline"><div><h3 style="margin:0">'+esc(sk?sk.name:'مهارة محذوفة')+'</h3><div class="meta">'+esc(sk?sk.subject:'')+' · '+esc(rg.cls||'')+(rg.teacher?' · المعلم/ة: '+esc(rg.teacher):'')+'</div></div>'+delBtn('delReg',rg.id)+'</div>'+
    '<div class="form" style="margin:12px 0">'+lbl('درجة الإتقان (الحد الأدنى)',nIn('registers',rg.id,'cut',rg.cut))+lbl('الدرجة الكاملة',nIn('registers',rg.id,'max',rg.max))+lbl('الصف / الشعبة',tIn('registers',rg.id,'cls',rg.cls))+lbl('المعلم/ة',tIn('registers',rg.id,'teacher',rg.teacher))+'</div>'+
    '<div class="tablewrap"><table class="regt"><thead><tr><th>م</th><th>الطالب (رمز)</th>'+STAGES.map(([k,l])=>'<th>'+esc(l.replace(' (خط الأساس)',''))+'</th>').join('')+'<th>القرار</th><th>المجموعة / الإجراء التالي</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="9" class="meta">لا طلاب بعد.</td></tr>')+'</tbody></table></div>'+
    '<div class="form" style="margin-top:10px">'+lbl('أضف طلابًا (اسم أو رمز في كل سطر)','<textarea id="as-'+rg.id+'" placeholder="ط-01&#10;ط-02"></textarea>','full')+'</div><div class="btns"><button class="btn alt sm" type="button" data-act="addStu" data-id="'+rg.id+'">أضف الطلاب</button></div>'+
    '<div class="calc" id="rcalc-'+rg.id+'">'+regCalcHtml(rg)+'</div></article>'}

/* ----- 04: جلسات الدعم وجودة التنفيذ ----- */
function sessRowRate(s){if(s.held===false)return{t:'لم تُنفَّذ',bad:false};const x=N(s.expected),y=N(s.actual);if(x==null||y==null)return{t:'—',bad:false};if(x<=0||y<0||y>x)return{t:'تحقق',bad:true};return{t:pct(y/x*100),bad:false}}
function qualPct(wid){const q=S.qual[wid]||{};let a=0,n=0;QITEMS.forEach((_,i)=>{const v=q['q'+i];if(v){n++;a+=v==='yes'?1:v==='part'?.5:0}});return{n,p:n?a/n*100:null}}
function qualAvg(){const a=REPW.filter(w=>w.id!=='r30').map(w=>qualPct(w.id)).filter(x=>x.n>0);return a.length?avg(a.map(x=>x.p)):null}
function qualHtml(wid){const q=qualPct(wid);return 'نسبة تحقق معايير الجودة: <b>'+pct(q.p)+'</b> ('+q.n+' من '+QITEMS.length+' بنود مقيّمة)'}
function updateAttSummary(){const el=$('#attSum');if(!el)return;const a=attStats();el.innerHTML='<div class="grid g4"><div><div class="meta">نسبة تنفيذ الجلسات</div><div style="font-size:30px;font-weight:700;color:var(--green-900)">'+pct(a.execRate)+'</div><div class="meta">'+a.held+' منفذة من '+a.n+' مخططة</div></div><div><div class="meta">نسبة حضور المستهدفين</div><div style="font-size:30px;font-weight:700;color:var(--green-900)">'+pct(a.rate)+'</div><div class="meta">مجموع الحضور ÷ مجموع المستهدفين في الجلسات المنفذة</div></div><div><div class="meta">الحضور الفعلي</div><b>'+a.a+'</b></div><div><div class="meta">المستهدفون</div><b>'+a.e+'</b></div></div>'}

    '<div class="fld"><span class="lbl">التنفيذ</span><label class="chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" '+BD('sessions',s.id,'held')+(s.held!==false?' checked':'')+'> نُفّذت</label></div>'+lbl('سبب عدم التنفيذ',tIn('sessions',s.id,'reason',s.reason))+'</div></div>'}).join('')||'<div class="card">'+empty('لا توجد جلسات بعد. سجّل أول جلسة من النموذج أعلاه.')+'</div>';
  const q=S.qual[UI.qw]||{};
  const qrows=QITEMS.map((t,i)=>'<div class="qrow"><span>'+(i+1)+'. '+esc(t)+'</span><div class="rg">'+QOPT.map(o=>'<label><input type="radio" name="q-'+UI.qw+'-'+i+'" '+BD('qual',UI.qw,'q'+i)+' value="'+o[0]+'"'+(q['q'+i]===o[0]?' checked':'')+'> '+o[1]+'</label>').join('')+'</div></div>').join('');
  const ob=S.obst.map(x=>'<div class="card" style="padding:12px 14px"><div class="sumline"><b>'+esc(x.what||'معوق')+'</b>'+delBtn('delRow',x.id,'data-col="obst"')+'</div><div class="form" style="margin-top:8px">'+lbl('المعوق',tIn('obst',x.id,'what',x.what))+lbl('الإجراء المتخذ',tIn('obst',x.id,'action',x.action))+lbl('المسؤول',tIn('obst',x.id,'owner',x.owner,'list="owners"'))+lbl('الحالة',sIn('obst',x.id,'status',OBST_ST,x.status,'اختر'))+'</div></div>').join('')||empty('لا معوقات مسجلة.');
  return head('attendance','جلسات الدعم المكثف وجودة التنفيذ','الأداة 4: سجل الجلسات والحضور، ومعايير جودة التنفيذ (عينة جلسة واحدة على الأقل أسبوعيًا)، والمعوقات والإجراءات.')+'<div class="card" id="attSum"></div>'+
  '<form class="card" data-form="addSession" novalidate><h3>جلسة جديدة</h3><div class="form">'+fld('التاريخ','<input type="date" id="se-date" data-req value="'+isoOf(today())+'">',1)+fld('المادة / المهارة','<input type="text" id="se-label" data-req list="skillnames">',1)+fld('المجموعة','<input type="text" id="se-group">')+fld('نوع التدخل','<select id="se-type" data-req>'+opts(STYPES,'','اختر')+'</select>',1)+fld('المنفذ','<input type="text" id="se-exec" list="owners">')+fld('عدد المستهدفين','<input type="number" id="se-exp" min="1" step="1" inputmode="numeric" data-req>',1)+fld('منفذة؟','<select id="se-held">'+opts([['yes','نعم، نُفّذت'],['no','لا، لم تُنفَّذ']],'yes')+'</select>')+fld('عدد الحاضرين','<input type="number" id="se-act" min="0" step="1" inputmode="numeric">')+fld('سبب عدم التنفيذ (إن وُجد)','<input type="text" id="se-reason">')+'</div><div class="btns"><button class="btn" type="submit">سجّل الجلسة</button></div></form>'+

/* ----- 05: بطاقة الملاحظة الصفية المركزة ----- */
R.observation=()=>{
  const g=obsGroups(),names=Object.keys(g);
  const sum=names.map(n=>{const a=g[n],f=avg(a[0].scores),l=avg(a[a.length-1].scores),d=a.length>1?l-f:null;
    return '<tr><td><b>'+esc(n)+'</b></td><td><bdi>'+r1(f).toLocaleString('en-US')+'</bdi></td><td>'+(a.length>1?'<bdi>'+r1(l).toLocaleString('en-US')+'</bdi>':'—')+'</td><td>'+(d==null?'—':'<bdi>'+(d>0?'+':d<0?'−':'')+Math.abs(r1(d)).toLocaleString('en-US')+'</bdi>')+'</td><td>'+(d==null?'<span class="chip">يحتاج قياسًا ثانيًا</span>':d>=1?'<span class="chip done">بلغ نقطة فأكثر</span>':'<span class="chip doing">لم يبلغ نقطة بعد</span>')+'</td></tr>'}).join('');

  const all=names.map(n=>g[n].map((o,i)=>{const a=avg(o.scores),d=i?a-avg(g[n][0].scores):null,pv=i?avg(g[n][i-1].scores):null;return '<tr><td>'+esc(n)+'</td><td>'+esc(dfmt(o.date,{day:'numeric',month:'long',year:'numeric'}))+'</td><td>'+esc(o.type||'—')+'</td><td><bdi>'+o.scores.join(' · ')+'</bdi></td><td><b><bdi>'+r1(a).toLocaleString('en-US')+'</bdi></b></td><td>'+(pv==null?'—':'<bdi>'+r1(pv).toLocaleString('en-US')+'</bdi>')+'</td><td>'+(i?'<bdi>'+(d>0?'+':d<0?'−':'')+Math.abs(r1(d)).toLocaleString('en-US')+'</bdi>':'القياس الأول')+'</td><td>'+detail(o)+'</td><td><button class="btn warn sm" type="button" data-act="delObs" data-id="'+o.id+'">حذف</button></td></tr>'}).join('')).join('');
  const fu=S.obs.filter(o=>o.follow).sort((a,b)=>a.follow.localeCompare(b.follow)).slice(0,6).map(o=>'<li><span><b>'+esc(dfmt(o.follow,{day:'numeric',month:'long'}))+'</b> — متابعة '+esc(o.teacher)+'</span>'+(daysTo(o.follow)<0?'<span class="chip late">متأخرة</span>':'<span class="chip doing">قادمة</span>')+'</li>').join('');
  return head('observation','بطاقة الملاحظة الصفية المركزة والتغذية الراجعة','الأداة 5: قيّم كل ممارسة من 1 إلى 4 وسجّل الشاهد المرصود، ثم التغذية الراجعة والدعم المتفق عليه وموعد ملاحظة المتابعة. المستهدف تحسن لا يقل عن نقطة واحدة عن القياس الأول.')+
  '<div class="note" style="margin-bottom:12px">تُستخدم هذه البطاقة لمتابعة النمو المهني للمعلمين وتطوير ممارساتهم وتقديم تغذية راجعة داعمة، <b>ولا تُستخدم نتائجها في تقويم الأداء الوظيفي للمعلم أو احتساب درجته.</b></div>'+
  '<div class="note" style="margin-bottom:16px">'+SCALE.map(s=>'<b>'+s[0]+'</b> '+s[1]).join(' · ')+'</div>'+

  '<h4 style="margin:14px 0 4px">أولًا: تقدير الممارسات التدريسية</h4>'+PRACTICES.map((p,i)=>'<div class="obsrow"><span>'+(i+1)+'. '+esc(p)+'<b class="req" aria-hidden="true"> *</b></span><label class="fld"><span class="sr">تقدير الممارسة '+(i+1)+'</span><select id="ob-p'+i+'" data-req>'+opts(SCALE.map(s=>[s[0],s[0]+' — '+s[1]]),'','اختر')+'</select><span class="err" role="alert"></span></label><input type="text" id="ob-e'+i+'" placeholder="الشاهد المرصود" aria-label="الشاهد المرصود للممارسة '+(i+1)+'"></div>').join('')+
  '<h4 style="margin:14px 0 4px">ثانيًا: التغذية الراجعة المكتوبة والمتابعة</h4><div class="form">'+fld('جوانب القوة','<textarea id="ob-str"></textarea>')+fld('الممارسة ذات الأولوية للتحسين','<select id="ob-prio">'+opts(PRACTICES.map((p,i)=>[String(i),(i+1)+'. '+p]),'','اختر')+'</select>')+fld('موعد ملاحظة المتابعة','<input type="date" id="ob-follow">')+'</div>'+
  '<p class="lbl" style="margin:12px 0 6px;font-weight:600">الدعم المتفق عليه</p><div class="chkgrid">'+OBS_SUPP.map(o=>'<label><input type="checkbox" name="ob-supp" value="'+o+'"> '+o+'</label>').join('')+'</div><div class="form" style="margin-top:8px">'+fld('دعم آخر','<input type="text" id="ob-suppo">')+'</div><div class="btns"><button class="btn" type="submit">سجّل الملاحظة</button></div></form>'+
  (fu?'<div class="card"><h3>مواعيد ملاحظات المتابعة</h3><ul class="list">'+fu+'</ul></div>':'')+
  '<div class="card"><h3>التغير عن القياس الأول</h3>'+(names.length?'<div class="tablewrap"><table><thead><tr><th>المعلم</th><th>المتوسط الأول</th><th>المتوسط الأحدث</th><th>التغير</th><th>الحالة</th></tr></thead><tbody>'+sum+'</tbody></table></div>':'<p class="meta">لا توجد ملاحظات بعد. سجّل القياس الأول لكل معلم مستهدف.</p>')+'</div>'+
  (names.length?'<div class="card"><h3>كل الملاحظات</h3><div class="tablewrap"><table><thead><tr><th>المعلم</th><th>التاريخ</th><th>النوع</th><th>درجات الممارسات الست</th><th>متوسط هذه الملاحظة</th><th>الملاحظة السابقة</th><th>التغير عن الأول</th><th>التفاصيل</th><th></th></tr></thead><tbody>'+all+'</tbody></table></div></div>':'')};

/* ----- 06: فاعلية التدخلات وقرارات التطوير ----- */
function execFor(s){const mine=S.sessions.filter(x=>String(x.label||'').trim()===String(s.name).trim()),use=mine.length?mine:S.sessions;if(!use.length)return null;return rate(use.filter(x=>x.held!==false).length,use.length)}
function suggestDec(cur,tg,gap,exec){if(cur==null||tg==null)return null;if(cur>=tg)return 'انتقال';if(gap==null)return null;
  if(gap>=THRESH.gapGood&&(exec==null||exec>=THRESH.execReg))return 'استمرار';
  if(exec!=null&&exec>=THRESH.execReg&&gap<THRESH.gapLow)return 'تعديل';return 'تكثيف'}
function effectCalc(s){const c=skillCalc(s),stg=((S.eval||{}).main||{}).stage;
  const cur=(stg&&c.st[stg]&&c.st[stg].state==='ok')?c.st[stg].v:c.last,tg=c.tg>0?c.tg:null,gap=(c.b!=null&&cur!=null&&tg!=null&&tg!==c.b)?(cur-c.b)/(tg-c.b)*100:null,exec=execFor(s);
  return{c,cur,tg,gap,exec,sug:suggestDec(cur,tg,gap,exec)}}
function gapList(){return S.skills.map(s=>effectCalc(s).gap).filter(v=>v!=null)}
R.effect=()=>{
  const ev=(S.eval||{}).main||{};
  const cards=S.skills.map(s=>{const e=effectCalc(s);return '<article class="card"><div class="sumline"><h3 style="margin:0">'+esc(s.name)+'</h3><span class="meta">'+esc(s.subject)+(s.grade?' · '+esc(s.grade):'')+' · تدخلات مسجلة: '+S.interventions.filter(i=>String(i.skill).trim()===String(s.name).trim()).length+'</span></div>'+
    '<div class="grid g4" style="margin:10px 0"><div><div class="meta">خط الأساس</div><b>'+pct(e.c.b)+'</b></div><div><div class="meta">النتيجة الحالية</div><b>'+pct(e.cur)+'</b></div><div><div class="meta">المستهدف</div><b>'+(e.tg!=null?pct(e.tg):'غير محدد')+'</b></div><div><div class="meta">نسبة سد الفجوة</div><b>'+pct(e.gap)+'</b></div><div><div class="meta">نسبة تنفيذ الجلسات</div><b>'+pct(e.exec)+'</b></div></div>'+
    '<div class="rec" style="margin-bottom:10px">'+(e.sug?'القرار المقترح (إرشادي): <b>'+e.sug+'</b> <button class="btn alt sm" type="button" data-act="accDec" data-id="'+s.id+'" data-v="'+e.sug+'">اعتمده</button>':'لا تتوفر بيانات كافية للاقتراح؛ يلزم خط أساس ونتيجة لاحقة ومستهدف محدد.')+'</div>'+
    '<div class="form">'+lbl('القرار المعتمد',sIn('skills',s.id,'dec',DECS,s.dec,'اختر القرار'))+'<label class="fld full"><span class="lbl">مبرر القرار والإجراء'+(s.dec?'<b class="req" aria-hidden="true">*</b>':'')+'</span>'+aIn('skills',s.id,'why',s.why)+'</label></div></article>'}).join('')||'<div class="card">'+empty('لا توجد مهارات بعد. أضفها من قسم القياس.')+'</div>';
  const grp=S.groups.map(x=>'<div class="card" style="padding:12px 14px"><div class="sumline"><b>'+esc(x.name||'مجموعة')+'</b>'+delBtn('delRow',x.id,'data-col="groups"')+'</div><div class="form" style="margin-top:8px">'+lbl('المجموعة',tIn('groups',x.id,'name',x.name))+lbl('عدد الطلبة',nIn('groups',x.id,'count',x.count))+lbl('الاحتياج',tIn('groups',x.id,'need',x.need))+lbl('الإجراء',sIn('groups',x.id,'action',['علاجي للطلبة غير المتقنين','إثرائي متدرج للطلبة المتقنين'],x.action,'اختر'))+lbl('التكرار',tIn('groups',x.id,'freq',x.freq,'placeholder="مثال: جلستان أسبوعيًا"'))+'</div></div>').join('')||empty('لا مجموعات بعد.');
  return head('effect','فاعلية التدخلات وقرارات التطوير','الأداة 6: يُبنى القرار على مؤشرات الأثر (الإتقان وسد الفجوة) لا على انتظام التنفيذ وحده. نسبة سد الفجوة = (النتيجة المتحققة − خط الأساس) ÷ (المستهدف − خط الأساس) × 100.')+
  '<div class="card"><h3>القياس المعتمد</h3><div class="form">'+lbl('القياس المعتمد في التقييم',sIn('eval','main','stage',[['first','الأولي'],['interim','المرحلي'],['final','النهائي']],ev.stage,'آخر قياس متاح'))+lbl('التاريخ',dIn('eval','main','date',ev.date))+'</div></div>'+cards+
  '<div class="card"><h3>دليل القرار (إرشادي مقترح)</h3><div class="tablewrap"><table><thead><tr><th>القرار</th><th>متى يُتخذ</th></tr></thead><tbody><tr><td><b>استمرار</b></td><td>يتقدم الطلبة نحو المستهدف بالمعدل المخطط، والتنفيذ منتظم.</td></tr><tr><td><b>تعديل</b></td><td>التنفيذ منتظم لكن التحسن محدود؛ فيُغيَّر أسلوب التدخل أو أداته أو طريقة تجميع الطلبة.</td></tr><tr><td><b>تكثيف</b></td><td>ظهر تحسن دون المستهدف، أو بقيت فئة دون تقدم؛ فيُزاد التكرار أو يُصغَّر حجم المجموعة.</td></tr><tr><td><b>انتقال</b></td><td>تحقق مستهدف الإتقان؛ فيُنتقل إلى المهارة التالية، ويُقدَّم إثراء للمتقنين.</td></tr></tbody></table></div><p class="meta" style="margin-top:8px">القرار المقترح في اللوحة يستخدم عتبات استرشادية من عندنا (تنفيذ منتظم ≥ '+THRESH.execReg+'%، سد الفجوة ≥ '+THRESH.gapGood+'% جيد، &lt; '+THRESH.gapLow+'% محدود)، وليست واردة في الوثيقة؛ والقرار النهائي لك.</p></div>'+
  '<form class="card" data-form="addGrp" novalidate><h3>تنظيم المجموعات الطلابية (دروس التقوية)</h3><div class="form">'+fld('المجموعة','<input type="text" id="gr-name" data-req>',1)+fld('عدد الطلبة','<input type="number" id="gr-count" min="0" step="1" inputmode="numeric">')+fld('الاحتياج','<input type="text" id="gr-need">')+fld('الإجراء','<select id="gr-action" data-req>'+opts(['علاجي للطلبة غير المتقنين','إثرائي متدرج للطلبة المتقنين'],'','اختر')+'</select>',1)+fld('التكرار','<input type="text" id="gr-freq">')+'</div><div class="btns"><button class="btn" type="submit">أضف المجموعة</button></div><div style="margin-top:14px">'+grp+'</div></form>'};

/* ----- 07: توثيق ممارسة تدريسية فاعلة ----- */
function pracImp(x){const b=N(x.before),a=N(x.after);return(b!=null&&a!=null)?a-b:null}
function pracEvN(x){return PEVID.filter(e=>x[e[0]]).length+(String(x.e_other||'').trim()?1:0)}
function pracWarn(x){return(x.rec==='sector'&&pracEvN(x)<2)?'أرفق شاهدين على الأقل قبل النشر على مستوى القطاع.':''}
R.practices=()=>{
  const cards=S.practices.map(x=>'<article class="card" data-pra="'+x.id+'"><div class="sumline"><h3 style="margin:0">'+esc(x.name||'ممارسة')+'</h3>'+delBtn('delRow',x.id,'data-col="practices"')+'</div><div class="form" style="margin-top:10px">'+
    lbl('اسم الممارسة',tIn('practices',x.id,'name',x.name))+lbl('المعلم/ة',tIn('practices',x.id,'teacher',x.teacher,'list="teachers"'))+lbl('المادة / الصف',tIn('practices',x.id,'subj',x.subj))+lbl('الفجوة أو المهارة التي عالجتها',tIn('practices',x.id,'gap',x.gap,'list="skillnames"'))+
    lbl('خطوات التطبيق باختصار',aIn('practices',x.id,'steps',x.steps),'full')+lbl('المواد والأدوات المستخدمة',aIn('practices',x.id,'materials',x.materials),'full')+
    lbl('الأثر: قبل (%)',nIn('practices',x.id,'before',x.before,'max="100"'))+lbl('الأثر: بعد (%)',nIn('practices',x.id,'after',x.after,'max="100"'))+
    '<div class="fld"><span class="lbl">التغير</span><b data-pimp="'+x.id+'">'+pp(pracImp(x))+'</b></div></div>'+
    '<p class="lbl" style="margin:12px 0 6px;font-weight:600">الشواهد المرفقة</p><div class="chkgrid">'+PEVID.map(e=>'<label><input type="checkbox" '+BD('practices',x.id,e[0])+(x[e[0]]?' checked':'')+'> '+e[1]+'</label>').join('')+'</div>'+
    '<div class="form" style="margin-top:8px">'+lbl('شواهد أخرى',tIn('practices',x.id,'e_other',x.e_other))+lbl('شروط نقلها لمدرسة أخرى',aIn('practices',x.id,'transfer',x.transfer),'full')+lbl('التوصية',sIn('practices',x.id,'rec',PREC,x.rec,'اختر'))+lbl('مقدم/ة الدعم',tIn('practices',x.id,'support',x.support))+lbl('مدير/ة المدرسة',tIn('practices',x.id,'principal',x.principal))+'</div><p class="err'+(pracWarn(x)?' show':'')+'" data-pwarn="'+x.id+'">'+esc(pracWarn(x))+'</p></article>').join('')||'<div class="card">'+empty('لا توجد ممارسات موثقة بعد. المستهدف في الأسبوع الخامس ممارسة واحدة على الأقل.')+'</div>';
  return head('practices','توثيق الممارسات التدريسية الفاعلة','الأداة 7: وثّق الممارسة التي أثبتت أثرها بالأرقام والشواهد، وحدّد شروط نقلها وتوصية نشرها (القطاع / المدرسة / تحتاج شواهد).')+
  '<form class="card" data-form="addPra" novalidate><h3>ممارسة جديدة</h3><div class="form">'+fld('اسم الممارسة','<input type="text" id="pr-name" data-req>',1)+fld('المعلم/ة','<input type="text" id="pr-teacher" data-req list="teachers">',1)+fld('الفجوة أو المهارة التي عالجتها','<input type="text" id="pr-gap" data-req list="skillnames">',1)+'</div><div class="btns"><button class="btn" type="submit">أضف الممارسة</button></div></form>'+cards};


/* ---------- router ---------- */
function go(id,keep){
  if(!SECS.some(x=>x[0]===id)||!R[id])id='home';
  $$('.sec').forEach(s=>s.classList.toggle('on',s.id==='sec-'+id));
  $('#sec-'+id).innerHTML=R[id]();
  $$('#nav a').forEach(a=>{if(a.dataset.s===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  updateIntSummary();updateAttSummary();fillLists();
  closeNav();
  if(!keep){window.scrollTo(0,0);const h=$('#h-'+id);if(h)h.focus({preventScroll:true})}
  applyRO();
}
function applyRO(){if(CL.live)return;
  const sec=$('.sec.on');if(sec&&!$('.loadnote',sec))sec.insertAdjacentHTML('afterbegin','<div class="note loadnote" style="margin-bottom:12px">'+esc(CL.err||'جارٍ تحميل البيانات المشتركة… يتاح التعديل بعد اكتمال التحميل.')+'</div>');
  $$('#content input,#content select,#content textarea').forEach(el=>{if(['fw','fs','ifs','gt','gs','gtext'].includes(el.id))return;el.disabled=true});
  $$('#content form[data-form]').forEach(f=>{if(f.dataset.form!=='gen')f.style.display='none'});
  $$('#content [data-act]').forEach(b=>{if(['delInt','delSkill','delSession','delObs','reset','impPick','fillNums','useRec','fillWeekly','addStu','autoDiag','delRow','delStu','delReg','accDec','ivFromCause'].includes(b.dataset.act))b.style.display='none'})}
function fillLists(){$('#skillnames').innerHTML=S.skills.map(s=>'<option value="'+esc(s.name)+'">').join('');$('#teachers').innerHTML=Object.keys(obsGroups()).map(n=>'<option value="'+esc(n)+'">').join('')}
function curSec(){return (location.hash||'#home').slice(1)}
function closeNav(){$('#side').classList.remove('open');$('#scrim').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}
$('#nav').innerHTML=SECS.map(s=>'<a href="#'+s[0]+'" data-s="'+s[0]+'">'+s[1]+'</a>').join('');
window.addEventListener('hashchange',()=>go(curSec()));
$('#menuBtn').onclick=()=>{const o=$('#side').classList.toggle('open');$('#scrim').classList.toggle('open',o);$('#menuBtn').setAttribute('aria-expanded',String(o))};
$('#scrim').onclick=closeNav;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});

/* ---------- field binding ---------- */
function updateWeekUI(wid){const w=WEEKS.find(x=>x.id===wid),el=$('[data-wsum="'+wid+'"]');if(w&&el)el.innerHTML=weekSum(w)}
const HOOK={
  tasks:(id,k)=>{const w=WEEKS.find(w=>w.tasks.some(t=>t.id===id));if(k==='status'){const row=$('[data-trow="'+id+'"]');if(row)row.className='trow '+(S.tasks[id].status||'todo')}if(w)updateWeekUI(w.id)},
  outputs:id=>updateWeekUI(id),
  miles:id=>{const m=MILES.find(x=>x.id===id),el=$('[data-mchip="'+id+'"]');if(m&&el)el.innerHTML=mileChip(m)},
  skills:id=>updateSkillCalc(id),
  interventions:id=>{updateIntSummary();const c=$('[data-icard="'+id+'"]'),r=rec('interventions',id);if(c&&r)c.className='card ic s-'+r.status},
  sessions:id=>{const r=rec('sessions',id),x=sessRowRate(r),el=$('[data-srate="'+id+'"]');if(el)el.innerHTML=x.t;const row=$('[data-srow="'+id+'"]');if(row)$$('input[type=number]',row).forEach(i=>i.setAttribute('aria-invalid',x.bad));updateAttSummary()},
  reports:id=>{rec('reports',id).updatedAt=Date.now();const m=$('#repMeta');if(m)m.innerHTML=reportMeta(id)},
  checklist:()=>{const n=CHECK.filter((_,i)=>(S.checklist['c'+i]||{}).checked).length;$('#ckN').innerHTML='<bdi>'+n+' / '+CHECK.length+'</bdi> بنود مكتملة';$('#ckBar').style.width=n/CHECK.length*100+'%'}
};
function onField(e){const t=e.target,col=t.dataset&&t.dataset.col;if(!col)return;const r=rec(col,t.dataset.id);if(!r)return;
  if(t.type==='radio'&&!t.checked)return;
  const val=t.type==='checkbox'?t.checked:t.dataset.t==='n'?N(t.value):t.value;
  if(t.dataset.st){const stu=(r.students||{})[t.dataset.st];if(!stu)return;if(t.dataset.sc){(stu.sc||(stu.sc={}))[t.dataset.sc]=val}else stu[t.dataset.k]=val}
  else r[t.dataset.k]=val;
  if(col==='outputs'&&t.dataset.k==='submitted')r.submittedOn=t.checked?isoOf(today()):null;
  save();if(HOOK[col])HOOK[col](t.dataset.id,t.dataset.k,t)}
document.addEventListener('input',e=>{if(e.target.id==='gtext')UI.gen=e.target.value});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.week')){const m=d.querySelector('summary[data-wsum]');if(m)UI.ow[m.dataset.wsum]=d.open}},true);
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fw'){UI.fw=t.value;go('tasks')}else if(t.id==='fs'){UI.fs=t.value;go('tasks')}else if(t.id==='ifs'){UI.ifs=t.value;go('interventions')}
  else if(t.id==='iv-cause'){const c=CAUSES.find(x=>x[0]===t.value),b=$('#iv-rec');if(c){b.hidden=false;b.innerHTML='<b>التدخل الموصى به:</b> '+esc(c[1])+' <button type="button" class="btn alt sm" data-act="useRec" data-t="'+esc(c[1])+'">استخدم التوصية</button>'}else b.hidden=true}
  else if(t.id==='qw'){UI.qw=t.value;go('attendance',true)}
  else if(t.id==='gt'){UI.gt=t.value;UI.gk=null;go('generator',true)}
  else if(t.id==='gs'){UI.gk=t.value}
  else if(t.id==='impFile')importFile(t.files[0]);
});

/* ---------- actions ---------- */
const rm=(arr,id)=>{const i=arr.findIndex(x=>x.id===id);if(i>-1)arr.splice(i,1)};
const csv=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
async function importFile(f){if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){toast('الملف ليس نسخة احتياطية صالحة (JSON غير مقروء)',true);return}
  if(!valid(o)){toast('الملف لا يطابق صيغة نسخة هذه اللوحة',true);return}
  if(await ask('استبدال البيانات الحالية؟','سيستبدل الاستيراد كل البيانات الموجودة على هذا الجهاز بمحتوى النسخة. لا يمكن التراجع.','استبدل البيانات')){S=Object.assign(blank(),o.data);if(!S.meta)S.meta={updated:0,rev:0};S.meta.updated=Date.now();persist();go(curSec());toast('تم استيراد النسخة الاحتياطية')}
  $('#impFile')&&($('#impFile').value='')}
const ACT={
  async delInt(id){if(await ask('حذف التدخل؟','سيُحذف هذا التدخل وسجلاته.','احذف')){rm(S.interventions,id);save();go('interventions');toast('حُذف التدخل')}},

  async delSession(id){if(await ask('حذف الجلسة؟','ستُحذف هذه الجلسة من السجل.','احذف')){rm(S.sessions,id);save();go('attendance');toast('حُذفت الجلسة')}},
  async delObs(id){if(await ask('حذف الملاحظة؟','ستُحذف هذه الملاحظة وتُعاد حسابات التغير.','احذف')){rm(S.obs,id);save();go('observation');toast('حُذفت الملاحظة')}},

  print(){window.print()},

  impPick(){$('#impFile').click()},
  genCopy(){try{navigator.clipboard.writeText(UI.gen).then(()=>toast('نُسخ نص التقرير'),()=>toast('تعذّر النسخ',true))}catch(e){toast('تعذّر النسخ',true)}},
  genTxt(){offerFile('تقرير-'+(UI.gsc?UI.gsc.type+'-'+UI.gsc.key:'عام')+'.txt',UI.gen)},
  genPrint(){$('#rptPrint').textContent=UI.gen;document.body.classList.add('print-report');window.onafterprint=()=>document.body.classList.remove('print-report');window.print()},
  fillWeekly(){const w=WEEKS.find(x=>x.id===(UI.gsc||{}).key);if(!w)return;const o=scopeOf(UI.gsc),ints=S.interventions.filter(i=>inR(i.date,o.from,o.to)),r=S.reports[w.id]||(S.reports[w.id]={});
    const put=(k,v)=>{if(v&&!String(r[k]||'').trim())r[k]=v},u=a=>[...new Set(a.filter(Boolean))].join('، ');
    put('skills',u(ints.map(i=>i.skill)));put('groups',u(ints.map(i=>i.group)));put('planned',ints.map(i=>'• '+i.action+' ('+lab(IS,i.status)+')').join('\n'));
    put('evidence',ints.map(i=>String(i.evidence||'').trim()).filter(Boolean).map(x=>'• '+x).join('\n'));

    const is=intStats(),as=attStats();put('progress','تنفيذ التدخلات: '+PT(is.rate)+' ('+is.d+' من '+is.t+')'+(as.rate!=null?' · حضور جلسات الدعم: '+PT(as.rate):''));

    r.updatedAt=Date.now();save();UI.rw=w.id;location.hash='report';go('report');toast('عُبّئت الحقول الفارغة من بيانات الفترة')},
  copyVal(id,el){try{navigator.clipboard.writeText(el.dataset.v).then(()=>toast('تم النسخ'),()=>toast('تعذّر النسخ',true))}catch(e){toast('تعذّر النسخ',true)}},
  async reset(){if(await ask('مسح كل البيانات؟','سيُحذف كل ما أدخلته على هذا الجهاز. تأكد من تصدير نسخة احتياطية أولًا.','امسح')){S=blank();S.meta.updated=Date.now();persist();go(curSec());toast('مُسحت البيانات')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.id,b)});

document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(!checkForm(f))return;const v=id=>$('#'+id).value.trim();
  switch(f.dataset.form){
  case 'addInt':S.interventions.push({id:uid(),group:v('iv-group'),skill:v('iv-skill'),cause:v('iv-cause'),action:v('iv-action'),date:v('iv-date'),status:v('iv-status'),barrier:'',corrective:'',evidence:''});save();go('interventions');toast('سُجّل التدخل');break;
  case 'addSkill':{const t=N(v('sk-target'));if(t!=null&&(t<1||t>100||!Number.isInteger(t))){const fl=$('#sk-target').closest('.fld');fl.classList.add('invalid');$('.err',fl).textContent='أدخل عددًا صحيحًا من 1 إلى 100';return}

    S.sessions.push({id:uid(),date:v('se-date'),label:v('se-label'),group:v('se-group'),type:v('se-type'),executor:v('se-exec'),expected:x,actual:y,held,reason:v('se-reason')});save();go('attendance',true);toast('سُجّلت الجلسة');break}
  case 'addDiag':S.diag.push({id:uid(),subject:v('dg-subject'),grade:v('dg-grade'),source:v('dg-source'),need:v('dg-need'),pri:v('dg-pri')});save();go('diagnosis',true);toast('أُضيف الصف');break;
  case 'addComp':{const a=N(v('cp-absent'));if(a!=null&&(a<0||!Number.isInteger(a))){const fl=$('#cp-absent').closest('.fld');fl.classList.add('invalid');$('.err',fl).textContent='أدخل عددًا صحيحًا';return}
    S.comp.push({id:uid(),kind:v('cp-kind'),who:v('cp-who'),absent:a,skills:v('cp-skills'),action:v('cp-action'),owner:v('cp-owner'),date:v('cp-date'),done:false});save();go('diagnosis',true);toast('أُضيفت الحالة');break}

  case 'addObs':{const supp=$$('input[name=ob-supp]:checked',f).map(x=>x.value);
    S.obs.push({id:uid(),teacher:v('ob-teacher'),date:v('ob-date'),scores:PRACTICES.map((_,i)=>Number(v('ob-p'+i))),created:Date.now(),type:v('ob-type'),subj:v('ob-subj'),skill:v('ob-skill'),observer:v('ob-observer'),ev:PRACTICES.map((_,i)=>v('ob-e'+i)),strengths:v('ob-str'),prio:v('ob-prio'),supp,suppOther:v('ob-suppo'),follow:v('ob-follow')});save();go('observation',true);toast('سُجّلت الملاحظة');break}
  }
});

    put('targets',[...new Set(S.diag.filter(d=>(N(d.pri)||9)<=2).map(d=>d.subject+(d.grade?' — '+d.grade:'')))].join('، '));

    save();go('diagnosis',true);toast('عُبّئت الحقول الفارغة من البيانات')}
});

/* ---------- Firebase: مستند مشترك واحد، تعديل مفتوح لمن يملك الرابط، ودمج على مستوى الحقل ---------- */
const BAK=n=>'nafispro-follow-main-bak'+n,AK=['skills','interventions','sessions','obs','diag','comp','registers','obst','groups','practices'];
const isO=v=>!!v&&typeof v==='object'&&!Array.isArray(v),clone=o=>JSON.parse(JSON.stringify(o));
function isBlankOf(x){return !(x.skills.length||x.interventions.length||x.sessions.length||x.obs.length||Object.keys(x.tasks).length||Object.keys(x.outputs).length||Object.keys(x.miles).length||Object.keys(x.reports).length||Object.keys(x.checklist).length)}
function toMap(st){const o=clone(st);delete o.meta;AK.forEach(k=>{const m={};(o[k]||[]).forEach(r=>m[r.id]=r);o[k]=m});return o}
function toState(m,meta){const o=Object.assign(blank(),clone(m));AK.forEach(k=>o[k]=Object.values(o[k]||{}));o.meta=meta;return o}
function diff(b,l,path,ops){
  if(isO(b)&&isO(l)){for(const k of Object.keys(l)){if(!(k in b))ops.push({p:path.concat(k),v:l[k]});else diff(b[k],l[k],path.concat(k),ops)}for(const k of Object.keys(b))if(!(k in l))ops.push({p:path.concat(k),del:1})}
  else if(JSON.stringify(b)!==JSON.stringify(l))ops.push({p:path,v:l})}
function applyOps(m,ops){ops.forEach(op=>{
  if(AK.includes(op.p[0])&&op.p.length>2&&!(m[op.p[0]]||{})[op.p[1]])return;
  let o=m;for(let i=0;i<op.p.length-1;i++){const k=op.p[i];if(!isO(o[k]))o[k]={};o=o[k]}
  const k=op.p[op.p.length-1];if(op.del)delete o[k];else o[k]=clone(op.v)})}
function parseDoc(r){try{const d=JSON.parse(r.data);return valid({app:APP,data:d})?toMap(d):null}catch(e){return null}}
const pendingOps=()=>{const o=[];diff(CL.base,toMap(S),[],o);return o};
const schedulePush=()=>{clearTimeout(pushT);pushT=setTimeout(push,900)};
const typing=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest('#content')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))};
function renderSoon(){if(typing()){CL.dirty=true;return}go(curSec(),true)}
document.addEventListener('focusout',()=>{if(CL.dirty)setTimeout(()=>{if(!typing()){CL.dirty=false;go(curSec(),true)}},60)});
async function firstLoadMissing(){
  CL.live=true;CL.base=toMap(blank());CL.rev=0;S=blank();
  const loc=load();
  if(!isBlankOf(loc)&&await ask('رفع بيانات هذا الجهاز؟','لا توجد بيانات مشتركة بعد، ويوجد على هذا الجهاز بيانات سابقة. هل ترفعها لتصبح البيانات المشتركة للجميع؟','ارفع البيانات')){S=Object.assign(blank(),loc);S.meta={updated:Date.now(),rev:0};schedulePush()}
  setStatus('جاهز');go(curSec(),true)}
function onRemote(snap){
  if(!snap.exists()){if(!CL.live)firstLoadMissing();return}
  const r=snap.data();if(CL.live&&(r.rev||0)<=CL.rev)return;
  const rm=parseDoc(r);if(!rm){CL.err='البيانات المشتركة تالفة أو بصيغة غير مطابقة.';setStatus(CL.err);go(curSec(),true);return}
  const ops=CL.live?pendingOps():[],m=clone(rm);applyOps(m,ops);
  CL.base=rm;CL.rev=r.rev||0;S=toState(m,{updated:r.updatedAt||0,rev:r.rev||0});
  CL.live=true;CL.err=null;setStatus('متزامن '+timeNow());renderSoon();
  if(ops.length)schedulePush()}
async function push(){
  if(!CL.live)return;if(CL.pushing){CL.again=true;return}
  const ops=pendingOps();if(!ops.length)return;
  CL.pushing=true;const L0=toMap(S);let merged,nr;
  try{
    await CL.F.runTransaction(CL.db,async tx=>{
      const snap=await tx.get(CL.ref),cur=snap.exists()?snap.data():null;
      const rm=cur?parseDoc(cur):toMap(blank());if(!rm)throw {code:'bad-remote'};
      applyOps(rm,ops);nr=(cur?cur.rev||0:0)+1;
      const txt=JSON.stringify(toState(rm,{}));if(txt.length>880000)throw {code:'too-large'};
      const doc={data:txt,updatedAt:Date.now(),rev:nr};tx.set(CL.ref,doc);
      if(nr%10===0)tx.set(CL.F.doc(CL.db,COL,BAK((nr/10)%5)),doc);
      merged=rm});
    CL.base=merged;CL.rev=nr;
    const pend=[];diff(L0,toMap(S),[],pend);const m=clone(merged);applyOps(m,pend);
    const others=JSON.stringify(m)!==JSON.stringify(toMap(S));
    S=toState(m,{updated:Date.now(),rev:nr});CL.err=null;setStatus('حُفظ '+timeNow());
    if(others)renderSoon();if(pend.length)schedulePush();
  }catch(e){
    CL.err=e.code==='permission-denied'?'رُفض الحفظ: تحقق من قواعد Firestore.':e.code==='too-large'?'حجم البيانات أكبر من الحد المسموح.':'تعذّر الحفظ ('+(e.code||'خطأ')+'). ستُعاد المحاولة.';
    setStatus(CL.err);toast(CL.err,true);if(e.code!=='permission-denied'&&e.code!=='too-large')setTimeout(schedulePush,15000)}
  finally{CL.pushing=false;if(CL.again){CL.again=false;schedulePush()}}}
async function cloudInit(){
  try{const [A,F]=await Promise.all([import(FB_URL+'firebase-app.js'),import(FB_URL+'firebase-firestore.js')]);
    const app=A.initializeApp(FB_CFG);CL.F=F;CL.db=F.getFirestore(app);CL.ref=F.doc(CL.db,COL,SHARED);
    CL.unsub=F.onSnapshot(CL.ref,onRemote,e=>{CL.err=e.code==='permission-denied'?'لا صلاحية لقراءة البيانات المشتركة: تحقق من قواعد Firestore.':'تعذّر الاتصال بالبيانات المشتركة ('+(e.code||'خطأ')+')';setStatus(CL.err);if(!CL.live)go(curSec(),true)})}
  catch(e){CL.err='تعذّر تحميل Firebase. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.';setStatus(CL.err);go(curSec(),true)}}

/* ---------- start ---------- */
setStatus('جارٍ تحميل البيانات…');
go(curSec());
cloudInit();
})();
</script>
