<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة خطة تحسين المدرسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --green-900:#0A4A3A;--green-700:#0F6B52;--teal-600:#0E8C86;--teal-100:#D9F0EE;
  --ink:#13231F;--muted:#4D605A;--bg:#F2F6F4;--surface:#FFFFFF;--line:#D3DFDA;--soft:#E9F1EE;
  --warn-ink:#8A5300;--warn-bg:#FFF1D6;--bad-ink:#A32A22;--bad-bg:#FDE8E6;--ok-ink:#0F6B52;--ok-bg:#DFF2E8;
  --side-bg:#0A4A3A;--side-ink:#EAF6F1;--side-active:#0E8C86;--focus:#0E8C86;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --green-900:#8FDDBE;--green-700:#5CCB9A;--teal-600:#38C2B8;--teal-100:#17332F;
    --ink:#E6F0ED;--muted:#9DB3AC;--bg:#0D1715;--surface:#142320;--line:#28403A;--soft:#1B2E2A;
    --warn-ink:#F2B75A;--warn-bg:#3A2D12;--bad-ink:#FF9C93;--bad-bg:#3B1A18;--ok-ink:#7FDDB0;--ok-bg:#16352B;
    --side-bg:#0A1F1A;--side-ink:#DCEEE8;--side-active:#0E8C86;--focus:#38C2B8;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --green-900:#8FDDBE;--green-700:#5CCB9A;--teal-600:#38C2B8;--teal-100:#17332F;
  --ink:#E6F0ED;--muted:#9DB3AC;--bg:#0D1715;--surface:#142320;--line:#28403A;--soft:#1B2E2A;
  --warn-ink:#F2B75A;--warn-bg:#3A2D12;--bad-ink:#FF9C93;--bad-bg:#3B1A18;--ok-ink:#7FDDB0;--ok-bg:#16352B;
  --side-bg:#0A1F1A;--side-ink:#DCEEE8;--side-active:#0E8C86;--focus:#38C2B8;color-scheme:dark;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
bdi{unicode-bidi:isolate}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100%;display:grid;grid-template-columns:272px minmax(0,1fr)}
/* sidebar */
.side{background:var(--side-bg);color:var(--side-ink);position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px}
.brand svg{width:44px;height:44px;flex:none;color:#7FE3D6}
.brand b{display:block;font-size:17px;line-height:1.35;font-weight:700}
.brand small{display:block;opacity:.75;font-size:12.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:block;padding:10px 14px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;border-inline-start:4px solid transparent}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:rgba(14,140,134,.35);border-inline-start-color:#7FE3D6;font-weight:700}
.side-foot{margin-top:auto;font-size:12.5px;opacity:.75;padding:0 6px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:700;color:var(--green-900)}
.top .phase{color:var(--muted);font-size:14px}
.top .grow{flex:1}
.savestate{font-size:13px;color:var(--muted)}
.menu-btn{display:none}
.notice{background:var(--warn-bg);color:var(--warn-ink);padding:10px 24px;font-size:14.5px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice a{color:inherit;font-weight:700}
.content{padding:24px;max-width:1120px;width:100%}
.sec{display:none}.sec.on{display:block}
.sec>h2{font-size:26px;font-weight:700;color:var(--green-900);margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:20px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:18px;font-weight:700;margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--green-700);background:var(--green-700);color:#fff;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none;min-height:42px}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--green-700)}
.btn.warn{background:transparent;color:var(--bad-ink);border-color:var(--bad-ink)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:14px}
:root[data-theme="dark"] .btn:not(.alt):not(.warn){color:#06201A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt):not(.warn){color:#06201A}}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
/* urgent */
.urgent{background:var(--green-700);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:18px}
:root[data-theme="dark"] .urgent{background:#0F5A47;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .urgent{background:#0F5A47;color:#fff}}
.urgent .when{display:inline-block;background:rgba(255,255,255,.18);padding:3px 14px;border-radius:99px;font-weight:600;font-size:14.5px}
.urgent .when.late{background:var(--bad-bg);color:var(--bad-ink)}
.urgent h2{font-size:30px;line-height:1.35;font-weight:700;margin:12px 0 6px}
.urgent p{opacity:.92;max-width:62ch}
.urgent ul{margin:12px 0 0;padding-inline-start:20px}
.urgent .out{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);font-weight:600}
.urgent .btn{background:#fff;color:#0A4A3A;border-color:#fff}
.stat{padding:16px 18px}
.stat .n{font-size:32px;font-weight:700;color:var(--green-900);line-height:1.2}
.stat .l{color:var(--muted);font-size:14.5px}
.ribbon{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 4px}
.ribbon div{height:12px;border-radius:6px;background:var(--soft)}
.ribbon .s-done{background:var(--green-700)}.ribbon .s-doing{background:var(--teal-600)}.ribbon .s-late{background:var(--bad-ink)}.ribbon .s-block{background:var(--warn-ink)}
.ribbon-l{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:13px;color:var(--muted);text-align:center}
/* chips + bars */
.chip{display:inline-block;padding:1px 12px;border-radius:99px;font-size:13.5px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.done{background:var(--ok-bg);color:var(--ok-ink)}.chip.doing{background:var(--teal-100);color:var(--teal-600)}
.chip.block{background:var(--warn-bg);color:var(--warn-ink)}.chip.late{background:var(--bad-bg);color:var(--bad-ink)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal-600);width:0;transition:width .35s ease}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list li:last-child{border-bottom:0}
/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl>li{position:relative;padding:0 38px 20px 0}
.tl>li::before{content:"";position:absolute;inset-inline-start:auto;right:13px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl .dot{position:absolute;right:0;top:4px;width:28px;height:28px;border-radius:50%;background:var(--soft);border:2px solid var(--teal-600);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--green-900)}
.tl .dot.d-done{background:var(--green-700);border-color:var(--green-700);color:#fff}
.tl .dot.d-late{border-color:var(--bad-ink)}
.tl .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tl .row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.tl h3{font-size:17px}
.meta{color:var(--muted);font-size:14px}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;align-items:start}
.fld{display:block}
.fld .lbl{display:block;font-weight:600;font-size:14.5px;margin-bottom:4px}
.fld .req{color:var(--bad-ink);margin-inline-start:3px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-height:42px}
textarea{min-height:84px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:var(--teal-600)}
.fld.invalid input,.fld.invalid select,.fld.invalid textarea,input[aria-invalid=true]{border-color:var(--bad-ink);background:var(--bad-bg)}
.err{display:none;color:var(--bad-ink);font-size:13.5px;margin-top:3px}
.fld.invalid .err,.err.show{display:block}
.full{grid-column:1/-1}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--green-700)}
.rec{background:var(--teal-100);border-radius:10px;padding:10px 14px;font-size:14.5px}
/* rows */
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 190px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow.done .ttitle{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.outrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 190px;gap:10px;align-items:center;margin-top:10px;padding:12px 14px;background:var(--teal-100);border-radius:10px}
.outrow label.chk{display:flex;gap:8px;align-items:center;font-weight:600}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
details.week>summary{cursor:pointer;padding:14px 18px;list-style:none}
details.week>summary::-webkit-details-marker{display:none}
details.week>summary::after{content:"﹀";float:left;color:var(--muted)}
details.week[open]>summary::after{content:"︿"}
details.week .inner{padding:0 18px 16px}
.sumline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sumline b{font-size:17px}
.wsum .bar{margin-top:8px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;align-items:end}
.filters .fld{min-width:180px}
/* cards for interventions / skills */
.ic{border-inline-start:5px solid var(--teal-600)}
.ic.s-done{border-inline-start-color:var(--green-700)}.ic.s-block{border-inline-start-color:var(--warn-ink)}
.ic .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:start}
.ic .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stage{background:var(--soft);border-radius:10px;padding:10px 12px}
.stage h4{font-size:14.5px;margin-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:14px}
.tablewrap{overflow-x:auto}
.calc{margin-top:12px;font-size:15px}
.calc .line{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.calc b{color:var(--green-900)}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:14.5px}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) 110px 110px 90px 50px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rate{font-weight:700;color:var(--green-900)}
/* indicators */
.ind h3{font-size:16px;color:var(--muted);font-weight:600}
.ind .v{font-size:30px;font-weight:700;color:var(--green-900);line-height:1.3}
.ind .f{font-size:13.5px;color:var(--muted);margin-top:6px}
.weeks-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.weeks-tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;cursor:pointer;font-weight:600}
.weeks-tabs button[aria-pressed=true]{background:var(--green-700);color:#fff;border-color:var(--green-700)}
dl.all{margin:0;display:grid;grid-template-columns:210px minmax(0,1fr);gap:6px 14px;font-size:15px}
dl.all dt{color:var(--muted);font-weight:600}
dl.all dd{margin:0;white-space:pre-wrap}
input:disabled,select:disabled,textarea:disabled{opacity:.75;cursor:not-allowed}
pre.rules{direction:ltr;text-align:left;background:var(--soft);padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;white-space:pre}
#rptPrint{display:none}
.ins{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:10px;align-items:start}
textarea.gen{min-height:460px;font-size:15.5px;line-height:1.95}
@media print{body.print-report .sec{display:none!important}body.print-report #rptPrint{display:block;white-space:pre-wrap;font-size:13pt;line-height:1.9;color:#000;padding:0 8mm}}
.side-foot button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:2px 6px;opacity:.9}
.side-foot .bad{color:#FFB4AC;margin-top:4px}
/* toast + dialog */
#toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;pointer-events:none;z-index:60}
#toast div{background:var(--green-900);color:#fff;padding:10px 20px;border-radius:12px;font-weight:600;max-width:90%;animation:pop .2s ease}
:root[data-theme="dark"] #toast div{color:#06201A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast div{color:#06201A}}
#toast div.bad{background:var(--bad-ink);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;max-width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{font-size:19px;margin-bottom:8px}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;right:0;width:min(300px,86vw);height:auto;z-index:50;transform:translateX(100%);transition:transform .25s ease;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .menu-btn{display:inline-flex}
  .content{padding:16px}.top,.notice{padding-inline:16px}
  .urgent{padding:20px}.urgent h2{font-size:24px}
  .trow,.outrow{grid-template-columns:1fr}
  .stages{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr 1fr}
  dl.all{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .side,.top,.notice,.btns,.filters,.menu-btn,form,#toast{display:none!important}
  .app{display:block}.content{max-width:none;padding:0}
  details.week{break-inside:avoid}details.week:not([open]) .inner{display:block}
  body{background:#fff;color:#000}
}
</style>
</head>

</div>

function weekStat(w){
  const total=w.tasks.length,sts=w.tasks.map(t=>(S.tasks[t.id]||{}).status||'todo');
  const done=sts.filter(s=>s==='done').length,sub=!!(S.outputs[w.id]||{}).submitted;
  const block=sts.includes('block'),started=sts.some(s=>s==='doing'||s==='done');
  const late=!sub&&daysTo(w.due)<0;
  const key=(sub&&done===total)?'done':late?'late':block?'block':(started||sub)?'doing':'todo';
  return {total,done,sub,key,pct:total?done/total*100:0};
}
const WL={done:'مكتمل',late:'متأخر',block:'عائق',doing:'قيد التنفيذ',todo:'لم يبدأ'};

function rate(a,b){return b>0?a/b*100:null}
function intStats(){const t=S.interventions.length,d=S.interventions.filter(i=>i.status==='done').length,b=S.interventions.filter(i=>i.status==='block').length;return{t,d,b,rate:rate(d,t)}}
function attStats(){let e=0,a=0;S.sessions.forEach(s=>{const x=N(s.expected),y=N(s.actual);if(x!=null&&y!=null&&x>0&&y<=x){e+=x;a+=y}});return{e,a,rate:rate(a,e),n:S.sessions.length}}
function stageVal(s,k){const m=N(s[k+'M']),n=N(s[k+'N']);if(m==null&&n==null)return{state:'empty'};if(m==null||n==null)return{state:'part'};
  if(!Number.isInteger(m)||!Number.isInteger(n)||m<0||n<=0||m>n)return{state:'err'};return{state:'ok',v:m/n*100}}
function skillCalc(s){const st={};STAGES.forEach(([k])=>st[k]=stageVal(s,k));
  const b=st.base.state==='ok'?st.base.v:null;let last=null,lk=null;['interim','final'].forEach(k=>{if(st[k].state==='ok'){last=st[k].v;lk=k}});
  const imp=(b!=null&&last!=null)?last-b:null;const tg=N(s.target);const ach=(tg>0&&last!=null)?last/tg*100:null;
  return{st,b,last,lk,imp,tg,ach}}

const R={};
let UI={fw:'all',fs:'all',ifs:'all',rw:null};

R.home=()=>{
  const uw=WEEKS.find(w=>!(S.outputs[w.id]||{}).submitted);
  let urgent='';
  if(uw){const d=daysTo(uw.due),open=uw.tasks.filter(t=>((S.tasks[t.id]||{}).status||'todo')!=='done').slice(0,3);
    urgent='<article class="urgent" aria-labelledby="urg"><span class="when'+(d<0?' late':'')+'">'+when(d)+'</span><h2 id="urg">'+esc(uw.priority)+'</h2><p>'+esc(uw.goal)+'</p>'+
    (open.length?'<ul>'+open.map(t=>'<li>'+esc(t.text)+'</li>').join('')+'</ul>':'<p style="margin-top:10px">اكتملت مهام هذا الأسبوع. تبقّى رفع المخرج.</p>')+
    '<p class="out">المخرج المطلوب: '+esc(uw.output)+'<br>موعد الرفع: '+esc(dfull(uw.due))+'</p><div class="btns"><a class="btn" href="#tasks">افتح مهام الأسبوع</a></div></article>'}
  else urgent='<article class="urgent"><h2>رُفعت مخرجات الأسابيع الستة</h2><p>تابع المحطات التالية: تقرير 30 نوفمبر، والقياس النهائي، ومراجعة 31 ديسمبر.</p><div class="btns"><a class="btn" href="#timeline">افتح الخط الزمني</a></div></article>';
  const stats=WEEKS.map(weekStat),allT=WEEKS.reduce((a,w)=>a+w.tasks.length,0),doneT=stats.reduce((a,s)=>a+s.done,0);
  const is=intStats(),as=attStats(),ck=CHECK.filter((_,i)=>(S.checklist['c'+i]||{}).checked).length;
  const dl=[];WEEKS.forEach((w,i)=>{if(!stats[i].sub)dl.push({d:w.due,t:'الأسبوع '+w.n+': '+w.output,c:chip(stats[i].key)})});
  MILES.forEach(m=>{if(!m.info&&(S.miles[m.id]||{}).status!=='done')dl.push({d:m.due,t:m.title,c:mileChip(m)})});
  dl.sort((a,b)=>a.d.localeCompare(b.d));
  return head('home','نظرة عامة','تقدم الخطة، وأقرب المواعيد، وما يحتاج إلى قرار هذا الأسبوع.')+urgent+
  '<div class="grid g4" style="margin-bottom:16px">'+
   '<div class="card stat"><div class="n">'+pct(rate(doneT,allT))+'</div><div class="l">مهام منجزة ('+doneT+' من '+allT+')</div></div>'+
   '<div class="card stat"><div class="n">'+pct(is.rate)+'</div><div class="l">تنفيذ التدخلات ('+is.d+' من '+is.t+')</div></div>'+
   '<div class="card stat"><div class="n">'+pct(as.rate)+'</div><div class="l">حضور جلسات الدعم</div></div>'+
   '<div class="card stat"><div class="n"><bdi>'+ck+' / '+CHECK.length+'</bdi></div><div class="l">بنود قائمة التحقق</div></div></div>'+
  '<div class="card"><h3>الأسابيع الستة</h3><div class="ribbon" role="img" aria-label="حالة الأسابيع الستة">'+stats.map(s=>'<div class="s-'+s.key+'" title="'+WL[s.key]+'"></div>').join('')+'</div><div class="ribbon-l">'+WEEKS.map(w=>'<span>أسبوع '+w.n+'</span>').join('')+'</div></div>'+
  '<div class="card"><h3>المواعيد القريبة</h3>'+(dl.length?'<ul class="list">'+dl.slice(0,5).map(x=>'<li><span><b>'+esc(dfmt(x.d))+'</b> — '+esc(x.t)+'</span>'+x.c+'</li>').join('')+'</ul>':'<p class="meta">لا مواعيد معلّقة.</p>')+'</div>'};

R.timeline=()=>{
  const stats=WEEKS.map(weekStat);
  const wk=WEEKS.map((w,i)=>{const s=stats[i];return '<li><span class="dot d-'+s.key+'" aria-hidden="true">'+w.n+'</span><div class="box"><div class="row"><h3>الأسبوع '+w.n+' · '+esc(range(w.start,w.end))+'</h3>'+chip(s.key)+'</div>'+
   '<p class="meta">'+esc(w.goal)+'</p><p class="meta">موعد الرفع: '+esc(dfull(w.due))+'</p>'+
   '<div class="bar" style="margin:8px 0 4px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(s.pct)+'" aria-label="تقدم مهام الأسبوع '+w.n+'"><i style="width:'+s.pct+'%"></i></div><p class="meta">'+s.done+' من '+s.total+' مهام مكتملة'+(s.sub?' · المخرج مرفوع':'')+'</p></div></li>'}).join('');
  const ms=MILES.map(m=>{const r=S.miles[m.id]||{};return '<li><span class="dot" aria-hidden="true">•</span><div class="box"><div class="row"><h3>'+esc(m.title)+' · '+esc(range(m.start,m.end))+'</h3>'+(m.info?'<span class="chip">معلومة</span>':'<span data-mchip="'+m.id+'">'+mileChip(m)+'</span>')+'</div><p class="meta">'+esc(m.text)+'</p>'+
   (m.info?'':'<div class="form" style="margin-top:10px">'+fld('الحالة','<select data-col="miles" data-id="'+m.id+'" data-k="status">'+opts(TS,r.status||'todo')+'</select>')+fld('المسؤول','<input type="text" list="owners" data-col="miles" data-id="'+m.id+'" data-k="owner" value="'+esc(r.owner||'')+'">')+'</div>')+'</div></li>'}).join('');
  return head('timeline','الخط الزمني','ستة أسابيع تنتهي كل منها بموعد رفع يوم الخميس، ثم محطات ما بعد الأسابيع الستة حتى نهاية المرحلة الثانية.')+'<ol class="tl">'+wk+ms+'</ol>'};

function weekSum(w){const s=weekStat(w);return '<div class="sumline"><b>الأسبوع '+w.n+' · '+esc(range(w.start,w.end))+'</b>'+chip(s.key)+'</div><div class="meta">'+s.done+' من '+s.total+' مهام · موعد الرفع '+esc(dfmt(w.due))+'</div><div class="bar"><i style="width:'+s.pct+'%"></i></div>'}
R.tasks=()=>{
  const cur=(WEEKS.find(w=>!(S.outputs[w.id]||{}).submitted)||{}).id;
  const list=WEEKS.filter(w=>UI.fw==='all'||UI.fw===w.id).map(w=>{
    const rows=w.tasks.filter(t=>UI.fs==='all'||((S.tasks[t.id]||{}).status||'todo')===UI.fs).map(t=>{const r=S.tasks[t.id]||{},st=r.status||'todo';
      return '<div class="trow '+st+'" data-trow="'+t.id+'"><div class="ttitle">'+esc(t.text)+'</div>'+
      '<label><span class="sr">حالة المهمة</span><select data-col="tasks" data-id="'+t.id+'" data-k="status">'+opts(TS,st)+'</select></label>'+
      '<label><span class="sr">المسؤول عن المهمة</span><input type="text" list="owners" placeholder="المسؤول" data-col="tasks" data-id="'+t.id+'" data-k="owner" value="'+esc(r.owner||'')+'"></label></div>'}).join('')||'<p class="meta">لا مهام تطابق التصفية.</p>';
    const o=S.outputs[w.id]||{};
    return '<details class="week"'+(w.id===cur||UI.fw!=='all'?' open':'')+'><summary class="wsum" data-wsum="'+w.id+'">'+weekSum(w)+'</summary><div class="inner">'+rows+
    '<div class="outrow"><div><b>المخرج المطلوب:</b> '+esc(w.output)+'</div><label class="chk"><input type="checkbox" data-col="outputs" data-id="'+w.id+'" data-k="submitted"'+(o.submitted?' checked':'')+'> رُفع في الموعد</label>'+
    '<label><span class="sr">مسؤول رفع المخرج</span><input type="text" list="owners" placeholder="مسؤول الرفع" data-col="outputs" data-id="'+w.id+'" data-k="owner" value="'+esc(o.owner||'')+'"></label></div></div></details>'}).join('');
  return head('tasks','المهام والمخرجات','حدّث حالة كل مهمة وسمِّ مسؤولها، ثم علّم المخرج «رُفع» بعد رفعه. تظهر «متأخر» تلقائيًا عند تجاوز موعد الرفع.')+
  '<div class="filters"><label class="fld"><span class="lbl">الأسبوع</span><select id="fw">'+opts([['all','كل الأسابيع']].concat(WEEKS.map(w=>[w.id,'الأسبوع '+w.n])),UI.fw)+'</select></label>'+
  '<label class="fld"><span class="lbl">حالة المهمة</span><select id="fs">'+opts([['all','كل الحالات']].concat(TS),UI.fs)+'</select></label></div>'+list};

R.interventions=()=>{
  const items=S.interventions.filter(i=>UI.ifs==='all'||i.status===UI.ifs);
  const cards=items.map(i=>'<article class="card ic s-'+i.status+'" data-icard="'+i.id+'"><div class="head"><div><h3>'+esc(i.action)+'</h3><div class="tags"><span class="chip">الفئة: '+esc(i.group)+'</span><span class="chip">المهارة: '+esc(i.skill)+'</span><span class="chip">الموعد: '+esc(dfmt(i.date,{day:'numeric',month:'long',year:'numeric'}))+'</span><span class="chip">السبب: '+esc(i.cause)+'</span></div></div>'+
   '<div style="display:flex;gap:8px;align-items:center"><label><span class="sr">حالة التدخل</span><select data-col="interventions" data-id="'+i.id+'" data-k="status">'+opts(IS,i.status)+'</select></label><button class="btn warn sm" data-act="delInt" data-id="'+i.id+'" type="button">حذف</button></div></div>'+
   '<div class="form">'+fld('العائق','<textarea data-col="interventions" data-id="'+i.id+'" data-k="barrier">'+esc(i.barrier||'')+'</textarea>')+fld('الإجراء التصحيحي','<textarea data-col="interventions" data-id="'+i.id+'" data-k="corrective">'+esc(i.corrective||'')+'</textarea>')+fld('الدليل','<textarea data-col="interventions" data-id="'+i.id+'" data-k="evidence" placeholder="مثال: صور أوراق عمل، كشف حضور، نتائج بطاقة خروج">'+esc(i.evidence||'')+'</textarea>')+'</div></article>').join('')||'<div class="card"><p class="meta">لا توجد تدخلات '+(S.interventions.length?'بهذه الحالة.':'بعد. أضف أول تدخل من النموذج أعلاه.')+'</p></div>';
  return head('interventions','تسجيل التدخلات','اربط كل تدخل بسبب الفجوة؛ تظهر لك التوصية المناسبة من الوثيقة. نسبة التنفيذ = التدخلات المنفذة ÷ التدخلات المسجلة.')+
  '<div class="card" id="intSum"></div>'+
  '<form class="card" data-form="addInt" novalidate><h3>تدخل جديد</h3><div class="form">'+
   fld('الفئة الطلابية','<input type="text" id="iv-group" data-req placeholder="مثال: طلاب الصف الأول المتوسط" >',1)+
   fld('المهارة','<input type="text" id="iv-skill" list="skillnames" data-req>',1)+
   fld('سبب الفجوة','<select id="iv-cause" data-req>'+opts(CAUSES.map(c=>c[0]),'','اختر السبب')+'</select>',1)+
   fld('التدخل','<input type="text" id="iv-action" data-req>',1)+
   fld('الموعد','<input type="date" id="iv-date" data-req value="'+isoOf(today())+'">',1)+
   fld('الحالة','<select id="iv-status">'+opts(IS,'planned')+'</select>')+
   '<div class="full rec" id="iv-rec" hidden></div></div><div class="btns"><button class="btn" type="submit">سجّل التدخل</button></div></form>'+
  '<div class="filters"><label class="fld"><span class="lbl">تصفية بالحالة</span><select id="ifs">'+opts([['all','كل الحالات']].concat(IS),UI.ifs)+'</select></label></div><div id="intList">'+cards+'</div>'};
function updateIntSummary(){const el=$('#intSum');if(!el)return;const s=intStats();el.innerHTML='<div class="grid g4"><div><div class="meta">نسبة تنفيذ التدخلات</div><div class="n" style="font-size:30px;font-weight:700;color:var(--green-900)">'+pct(s.rate)+'</div></div><div><div class="meta">مسجلة</div><b>'+s.t+'</b></div><div><div class="meta">منفذة</div><b>'+s.d+'</b></div><div><div class="meta">متعثرة</div><b>'+s.b+'</b></div></div>'}

function skillCalcHtml(s){const c=skillCalc(s);
  const rows=STAGES.map(([k,l])=>{const x=c.st[k];return '<tr><td>'+esc(l)+'</td><td>'+(x.state==='ok'?pct(x.v):x.state==='err'?'<span class="chip late">تحقق من الأعداد</span>':x.state==='part'?'<span class="meta">أكمل الحقلين</span>':'—')+'</td></tr>'}).join('');
  const errs=STAGES.some(([k])=>c.st[k].state==='err');
  return '<div class="tablewrap"><table><thead><tr><th>المرحلة</th><th>نسبة الإتقان</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+(errs?'<p class="err show">عدد المتقنين لا يتجاوز عدد المقاسين، ويجب أن يكون عدد المقاسين أكبر من صفر.</p>':'')+
  '<div class="line"><span>التحسن عن خط الأساس: <b>'+pp(c.imp)+'</b></span><span>نسبة تحقيق المستهدف: <b>'+(c.tg>0?pct(c.ach):'حدّد المستهدف')+'</b></span></div>'}
R.measure=()=>{
  const cards=S.skills.map(s=>'<article class="card" data-skill="'+s.id+'"><div class="sumline"><div><h3 style="margin:0">'+esc(s.name)+'</h3><div class="meta">'+esc(s.subject)+(s.grade?' · '+esc(s.grade):'')+'</div></div><div style="display:flex;gap:10px;align-items:end">'+
   '<label class="fld" style="width:150px"><span class="lbl">المستهدف (%)</span><input type="number" min="1" max="100" step="1" inputmode="numeric" data-t="n" data-col="skills" data-id="'+s.id+'" data-k="target" value="'+(s.target==null?'':s.target)+'" placeholder="تحدده المدرسة"></label>'+
   '<button class="btn warn sm" type="button" data-act="delSkill" data-id="'+s.id+'">حذف</button></div></div>'+
   '<div class="stages" style="margin-top:12px">'+STAGES.map(([k,l])=>'<div class="stage"><h4>'+esc(l)+'</h4><div class="pair"><label class="fld"><span class="lbl">المتقنون</span><input type="number" min="0" step="1" inputmode="numeric" data-t="n" data-col="skills" data-id="'+s.id+'" data-k="'+k+'M" value="'+(s[k+'M']==null?'':s[k+'M'])+'"></label>'+
   '<label class="fld"><span class="lbl">المقاسون</span><input type="number" min="0" step="1" inputmode="numeric" data-t="n" data-col="skills" data-id="'+s.id+'" data-k="'+k+'N" value="'+(s[k+'N']==null?'':s[k+'N'])+'"></label></div></div>').join('')+'</div>'+
   '<div class="calc" id="calc-'+s.id+'">'+skillCalcHtml(s)+'</div></article>').join('')||'<div class="card"><p class="meta">لا توجد مهارات بعد. أضف أول مهارة ذات أولوية من النموذج أعلاه.</p></div>';
  return head('measure','سجلات القياس','سجّل لكل مهارة عدد المتقنين وعدد المقاسين في القياس القبلي والمرحلي والنهائي. تُحسب النسب والتحسن تلقائيًا.')+
  '<div class="note" style="margin-bottom:16px">لا تضع الوثيقة نسبة إتقان موحدة لكل المهارات، لذلك يبقى المستهدف حقلًا تحدده المدرسة لكل مهارة. <b>مثال توضيحي فقط:</b> ارتفاع الإتقان من 40% إلى 65% يعني تحسنًا قدره 25 نقطة مئوية، وهو ليس مستهدفًا واردًا في الوثيقة.</div>'+
  '<form class="card" data-form="addSkill" novalidate><h3>مهارة جديدة</h3><div class="form">'+fld('اسم المهارة','<input type="text" id="sk-name" data-req>',1)+fld('المادة','<input type="text" id="sk-subject" data-req>',1)+fld('الصف','<input type="text" id="sk-grade">')+fld('المستهدف (%) — اختياري','<input type="number" id="sk-target" min="1" max="100" step="1" inputmode="numeric">')+'</div><div class="btns"><button class="btn" type="submit">أضف المهارة</button></div></form>'+cards};
function updateSkillCalc(id){const s=rec('skills',id),el=$('#calc-'+id);if(s&&el)el.innerHTML=skillCalcHtml(s)}

function sessRowRate(s){const x=N(s.expected),y=N(s.actual);if(x==null||y==null)return{t:'—',bad:false};if(x<=0||y<0||y>x)return{t:'تحقق',bad:true};return{t:pct(y/x*100),bad:false}}
function updateAttSummary(){const el=$('#attSum');if(!el)return;const a=attStats();el.innerHTML='<div class="grid g4"><div><div class="meta">نسبة الحضور في جلسات الدعم</div><div style="font-size:30px;font-weight:700;color:var(--green-900)">'+pct(a.rate)+'</div></div><div><div class="meta">الحضور الفعلي</div><b>'+a.a+'</b></div><div><div class="meta">الحضور المتوقع</div><b>'+a.e+'</b></div><div><div class="meta">عدد الجلسات</div><b>'+a.n+'</b></div></div>'}
R.attendance=()=>{
  const rows=S.sessions.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(s=>{const r=sessRowRate(s);return '<div class="srow" data-srow="'+s.id+'"><label><span class="sr">التاريخ</span><input type="date" data-col="sessions" data-id="'+s.id+'" data-k="date" value="'+esc(s.date||'')+'"></label>'+
   '<label><span class="sr">الجلسة أو المهارة</span><input type="text" data-col="sessions" data-id="'+s.id+'" data-k="label" value="'+esc(s.label||'')+'"></label>'+
   '<label><span class="sr">الحضور المتوقع</span><input type="number" min="1" step="1" data-t="n" data-col="sessions" data-id="'+s.id+'" data-k="expected" value="'+(s.expected==null?'':s.expected)+'"></label>'+
   '<label><span class="sr">الحضور الفعلي</span><input type="number" min="0" step="1" data-t="n" data-col="sessions" data-id="'+s.id+'" data-k="actual" value="'+(s.actual==null?'':s.actual)+'"></label>'+
   '<b class="rate" data-srate="'+s.id+'">'+r.t+'</b><button class="btn warn sm" type="button" data-act="delSession" data-id="'+s.id+'" aria-label="حذف الجلسة">حذف</button></div>'}).join('')||'<p class="meta">لا توجد جلسات بعد. سجّل أول جلسة دعم من النموذج أعلاه.</p>';
  return head('attendance','حضور جلسات الدعم','نسبة الحضور = الحضور الفعلي ÷ الحضور المتوقع × 100. لا يتجاوز الفعلي المتوقع.')+'<div class="card" id="attSum"></div>'+
  '<form class="card" data-form="addSession" novalidate><h3>جلسة جديدة</h3><div class="form">'+fld('التاريخ','<input type="date" id="se-date" data-req value="'+isoOf(today())+'">',1)+fld('الجلسة أو المهارة','<input type="text" id="se-label" data-req list="skillnames">',1)+fld('الحضور المتوقع','<input type="number" id="se-exp" min="1" step="1" inputmode="numeric" data-req>',1)+fld('الحضور الفعلي','<input type="number" id="se-act" min="0" step="1" inputmode="numeric" data-req>',1)+'</div><div class="btns"><button class="btn" type="submit">سجّل الجلسة</button></div></form>'+
  '<div class="card"><h3>سجل الجلسات</h3><div class="tablewrap" id="sessList" style="min-width:0">'+rows+'</div></div>'};

R.observation=()=>{
  const g=obsGroups(),names=Object.keys(g);
  const sum=names.map(n=>{const a=g[n],f=avg(a[0].scores),l=avg(a[a.length-1].scores),d=a.length>1?l-f:null;
    return '<tr><td><b>'+esc(n)+'</b></td><td><bdi>'+r1(f).toLocaleString('en-US')+'</bdi></td><td>'+(a.length>1?'<bdi>'+r1(l).toLocaleString('en-US')+'</bdi>':'—')+'</td><td>'+(d==null?'—':'<bdi>'+(d>0?'+':d<0?'−':'')+Math.abs(r1(d)).toLocaleString('en-US')+'</bdi>')+'</td><td>'+(d==null?'<span class="chip">يحتاج قياسًا ثانيًا</span>':d>=1?'<span class="chip done">بلغ نقطة فأكثر</span>':'<span class="chip doing">لم يبلغ نقطة بعد</span>')+'</td></tr>'}).join('');
  const all=names.map(n=>g[n].map((o,i)=>{const a=avg(o.scores),d=i?a-avg(g[n][0].scores):null;return '<tr><td>'+esc(n)+'</td><td>'+esc(dfmt(o.date,{day:'numeric',month:'long',year:'numeric'}))+'</td><td><bdi>'+o.scores.join(' · ')+'</bdi></td><td><b><bdi>'+r1(a).toLocaleString('en-US')+'</bdi></b></td><td>'+(i?'<bdi>'+(d>0?'+':d<0?'−':'')+Math.abs(r1(d)).toLocaleString('en-US')+'</bdi>':'القياس الأول')+'</td><td><button class="btn warn sm" type="button" data-act="delObs" data-id="'+o.id+'">حذف</button></td></tr>'}).join('')).join('');
  return head('observation','بطاقة ملاحظة الممارسات التدريسية','قيّم كل ممارسة من 1 إلى 4. المتوسط هو متوسط الدرجات الست، والمستهدف تحسن لا يقل عن نقطة واحدة عن القياس الأول.')+

  else L.push('لا مهارات مسجلة في قسم القياس.');

  if(att.n&&att.rate!=null){L.push('سُجّلت '+ar(att.n,['جلسة واحدة','جلستان','جلسات','جلسة'])+'؛ الحضور الفعلي '+att.a+' من '+att.e+' متوقعًا، بنسبة '+PT(att.rate)+' ('+(att.rate>=THRESH.attHigh?'مرتفعة':att.rate>=THRESH.attOk?'مقبولة':'منخفضة وتستدعي المعالجة')+' وفق نطاقات استرشادية).');

  H('ثامنًا: التوصيات');

R.generator=()=>{
  const t=UI.gt||'weekly',ym=isoOf(today()).slice(0,7);
  const keys=t==='weekly'?WEEKS.map(w=>[w.id,'الأسبوع '+w.n+' · '+range(w.start,w.end)]):t==='monthly'?['2026-10','2026-11','2026-12','2027-01','2027-02','2027-03'].map(k=>[k,dfmt(k+'-01',{month:'long',year:'numeric'})]):[['p1','المرحلة الأولى (11 أكتوبر – 31 ديسمبر 2026)'],['p2','المرحلة الثانية (1 يناير – 31 مارس 2027)']];
  if(!keys.some(k=>k[0]===UI.gk))UI.gk=t==='weekly'?(WEEKS.find(w=>!(S.outputs[w.id]||{}).submitted)||WEEKS[0]).id:t==='monthly'?(keys.some(k=>k[0]===ym)?ym:keys[0][0]):'p1';
  const K={k:{good:['done','إيجابي'],warn:['block','تنبيه'],info:['doing','معلومة'],data:['','بيانات ناقصة']}};
  const insHtml=UI.gins?'<div class="card"><h3>تحليل البيانات</h3><ul class="ins">'+UI.gins.map(x=>'<li><span class="chip '+K.k[x.k][0]+'">'+K.k[x.k][1]+'</span><span>'+esc(x.t)+'</span></li>').join('')+'</ul></div>':'';
  const out=UI.gen?insHtml+'<div class="card"><h3>نص التقرير</h3><p class="meta" style="margin-bottom:8px">يمكنك تعديل النص مباشرة قبل النسخ أو التصدير.</p><textarea id="gtext" class="gen" aria-label="نص التقرير">'+esc(UI.gen)+'</textarea><div class="btns"><button class="btn" type="button" data-act="genCopy">انسخ النص</button><button class="btn alt" type="button" data-act="genTxt">تصدير ملف نصي</button><button class="btn alt" type="button" data-act="genPrint">طباعة / حفظ PDF</button>'+(UI.gsc&&UI.gsc.type==='weekly'?'<button class="btn alt" type="button" data-act="fillWeekly">املأ نموذج التقرير الأسبوعي منه</button>':'')+'</div></div>':'<div class="card"><p class="meta">اختر نوع التقرير والفترة ثم اضغط «ولّد التقرير».</p></div>';
  return head('generator','مولد التقارير','يصوغ تقريرًا أسبوعيًا أو شهريًا أو ختاميًا ويحلل بياناتك. كل جملة مشتقة من مدخلاتك، ولا يخترع أرقامًا. البيانات الناقصة تظهر ملاحظات صريحة.')+
  '<form class="card" data-form="gen" novalidate><div class="form">'+fld('نوع التقرير','<select id="gt">'+opts([['weekly','أسبوعي'],['monthly','شهري'],['final','ختامي']],t)+'</select>')+fld(t==='weekly'?'الأسبوع':t==='monthly'?'الشهر':'المرحلة','<select id="gs">'+opts(keys,UI.gk)+'</select>')+'</div><div class="btns"><button class="btn" type="submit">ولّد التقرير</button></div></form>'+out};

/* ---------- router ---------- */
function go(id,keep){
  if(!SECS.some(x=>x[0]===id)||!R[id])id='home';
  $$('.sec').forEach(s=>s.classList.toggle('on',s.id==='sec-'+id));
  $('#sec-'+id).innerHTML=R[id]();
  $$('#nav a').forEach(a=>{if(a.dataset.s===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  updateIntSummary();updateAttSummary();fillLists();
  closeNav();
  if(!keep){window.scrollTo(0,0);const h=$('#h-'+id);if(h)h.focus({preventScroll:true})}
  applyRO();
}
function applyRO(){if(CL.role!=='viewer')return;
  $$('#content input,#content select,#content textarea').forEach(el=>{if(['fw','fs','ifs','gt','gs','gtext'].includes(el.id))return;el.disabled=true});
  $$('#content form[data-form]').forEach(f=>{if(f.dataset.form!=='gen')f.style.display='none'});
  $$('#content [data-act]').forEach(b=>{if(['delInt','delSkill','delSession','delObs','reset','impPick','fillNums','useRec','fillWeekly'].includes(b.dataset.act))b.style.display='none'})}
function fillLists(){$('#skillnames').innerHTML=S.skills.map(s=>'<option value="'+esc(s.name)+'">').join('');$('#teachers').innerHTML=Object.keys(obsGroups()).map(n=>'<option value="'+esc(n)+'">').join('')}
function curSec(){return (location.hash||'#home').slice(1)}
function closeNav(){$('#side').classList.remove('open');$('#scrim').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}
$('#nav').innerHTML=SECS.map(s=>'<a href="#'+s[0]+'" data-s="'+s[0]+'">'+s[1]+'</a>').join('');
window.addEventListener('hashchange',()=>go(curSec()));
$('#menuBtn').onclick=()=>{const o=$('#side').classList.toggle('open');$('#scrim').classList.toggle('open',o);$('#menuBtn').setAttribute('aria-expanded',String(o))};
$('#scrim').onclick=closeNav;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});

function updateWeekUI(wid){const w=WEEKS.find(x=>x.id===wid),el=$('[data-wsum="'+wid+'"]');if(w&&el)el.innerHTML=weekSum(w)}
const HOOK={
  tasks:(id,k)=>{const w=WEEKS.find(w=>w.tasks.some(t=>t.id===id));if(k==='status'){const row=$('[data-trow="'+id+'"]');if(row)row.className='trow '+(S.tasks[id].status||'todo')}if(w)updateWeekUI(w.id)},
  outputs:id=>updateWeekUI(id),
  miles:id=>{const m=MILES.find(x=>x.id===id),el=$('[data-mchip="'+id+'"]');if(m&&el)el.innerHTML=mileChip(m)},
  skills:id=>updateSkillCalc(id),
  interventions:id=>{updateIntSummary();const c=$('[data-icard="'+id+'"]'),r=rec('interventions',id);if(c&&r)c.className='card ic s-'+r.status},
  sessions:id=>{const r=rec('sessions',id),x=sessRowRate(r),el=$('[data-srate="'+id+'"]');if(el)el.innerHTML=x.t;const row=$('[data-srow="'+id+'"]');if(row)$$('input[type=number]',row).forEach(i=>i.setAttribute('aria-invalid',x.bad));updateAttSummary()},
  reports:id=>{rec('reports',id).updatedAt=Date.now();const m=$('#repMeta');if(m)m.innerHTML=reportMeta(id)},
  checklist:()=>{const n=CHECK.filter((_,i)=>(S.checklist['c'+i]||{}).checked).length;$('#ckN').innerHTML='<bdi>'+n+' / '+CHECK.length+'</bdi> بنود مكتملة';$('#ckBar').style.width=n/CHECK.length*100+'%'}
};
function onField(e){const t=e.target,col=t.dataset&&t.dataset.col;if(!col)return;const r=rec(col,t.dataset.id);if(!r)return;
  r[t.dataset.k]=t.type==='checkbox'?t.checked:t.dataset.t==='n'?N(t.value):t.value;
  if(col==='outputs'&&t.dataset.k==='submitted')r.submittedOn=t.checked?isoOf(today()):null;
  save();if(HOOK[col])HOOK[col](t.dataset.id,t.dataset.k)}
document.addEventListener('input',e=>{if(e.target.id==='gtext')UI.gen=e.target.value});
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fw'){UI.fw=t.value;go('tasks')}else if(t.id==='fs'){UI.fs=t.value;go('tasks')}else if(t.id==='ifs'){UI.ifs=t.value;go('interventions')}
  else if(t.id==='iv-cause'){const c=CAUSES.find(x=>x[0]===t.value),b=$('#iv-rec');if(c){b.hidden=false;b.innerHTML='<b>التدخل الموصى به:</b> '+esc(c[1])+' <button type="button" class="btn alt sm" data-act="useRec" data-t="'+esc(c[1])+'">استخدم التوصية</button>'}else b.hidden=true}
  else if(t.id==='gt'){UI.gt=t.value;UI.gk=null;go('generator',true)}
  else if(t.id==='gs'){UI.gk=t.value}
  else if(t.id==='impFile')importFile(t.files[0]);
});

async function importFile(f){if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){toast('الملف ليس نسخة احتياطية صالحة (JSON غير مقروء)',true);return}
  if(!valid(o)){toast('الملف لا يطابق صيغة نسخة هذه اللوحة',true);return}
  if(await ask('استبدال البيانات الحالية؟','سيستبدل الاستيراد كل البيانات الموجودة على هذا الجهاز بمحتوى النسخة. لا يمكن التراجع.','استبدل البيانات')){S=Object.assign(blank(),o.data);if(!S.meta)S.meta={updated:0,rev:0};S.meta.updated=Date.now();persist();go(curSec());toast('تم استيراد النسخة الاحتياطية')}
  $('#impFile')&&($('#impFile').value='')}
const ACT={
  async delInt(id){if(await ask('حذف التدخل؟','سيُحذف هذا التدخل وسجلاته.','احذف')){rm(S.interventions,id);save();go('interventions');toast('حُذف التدخل')}},
  async delSkill(id){if(await ask('حذف المهارة؟','ستُحذف المهارة وكل قياساتها.','احذف')){rm(S.skills,id);save();go('measure');toast('حُذفت المهارة')}},
  async delSession(id){if(await ask('حذف الجلسة؟','ستُحذف هذه الجلسة من السجل.','احذف')){rm(S.sessions,id);save();go('attendance');toast('حُذفت الجلسة')}},
  async delObs(id){if(await ask('حذف الملاحظة؟','ستُحذف هذه الملاحظة وتُعاد حسابات التغير.','احذف')){rm(S.obs,id);save();go('observation');toast('حُذفت الملاحظة')}},
  useRec(id,el){const a=$('#iv-action');a.value=el.dataset.t;a.closest('.fld').classList.remove('invalid');a.focus()},
  repWeek(id){UI.rw=id;go('report')},
  fillNums(){const is=intStats(),as=attStats(),t=$('[data-col="reports"][data-k="progress"]'),line='تنفيذ التدخلات: '+r1(is.rate==null?0:is.rate)+'% ('+is.d+' من '+is.t+') · حضور جلسات الدعم: '+r1(as.rate==null?0:as.rate)+'% ('+as.a+' من '+as.e+')';
    t.value=(t.value.trim()?t.value.trim()+'\n':'')+line;t.dispatchEvent(new Event('input',{bubbles:true}));toast('أُدرج الملخص')},
  expTxt(id){const w=REPW.find(x=>x.id===id);offerFile('تقرير-'+w.id+'.txt',reportText(w))},
  async copyTxt(id){const w=REPW.find(x=>x.id===id);try{await navigator.clipboard.writeText(reportText(w));toast('نُسخ نص التقرير')}catch(e){toast('تعذّر النسخ؛ استخدم التصدير',true)}},
  expCsv(){const ws=REPW.filter(w=>Object.keys(rep(w.id)).length);if(!ws.length){toast('لا توجد تقارير لتصديرها',true);return}
    const rows=[['التقرير','الفترة','موعد الرفع'].concat(RF.map(f=>f[1]))].concat(ws.map(w=>[w.label,range(w.start,w.end),w.due].concat(RF.map(f=>rep(w.id)[f[0]]||''))));
    offerFile('التقارير-الأسبوعية.csv','\ufeff'+rows.map(r=>r.map(csv).join(',')).join('\r\n'))},
  print(){window.print()},
  expJson(){offerFile('نسخة-متابعة-خطة-التحسين-'+isoOf(today())+'.json',JSON.stringify({app:APP,version:1,exportedAt:new Date().toISOString(),data:S},null,2))},
  impPick(){$('#impFile').click()},
  async signIn(){
    if(!/^https?:$/.test(location.protocol)){toast('افتح الصفحة من رابط http أو https لتسجيل الدخول',true);return}
    CL.flag=true;try{localStorage.setItem('plan_cloud','1')}catch(e){}
    if(!await loadSdk())return;bindAuth();
    try{await CL.Au.signInWithPopup(CL.auth,new CL.Au.GoogleAuthProvider())}
    catch(e){const c=e&&e.code;
      if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await CL.Au.signInWithRedirect(CL.auth,new CL.Au.GoogleAuthProvider())}catch(x){toast('تعذّر فتح نافذة الدخول',true)}}
      else if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request'){}
      else if(c==='auth/operation-not-allowed'){CL.err='فعّل مزوّد Google من Authentication ثم Sign-in method في Firebase.';refreshBackup()}
      else if(c==='auth/unauthorized-domain'){CL.err='أضف نطاق هذه الصفحة في Authentication ثم Settings ثم Authorized domains.';refreshBackup()}
      else{CL.err='تعذّر تسجيل الدخول ('+(c||'خطأ')+')';refreshBackup()}}},
  async signOutA(){try{await CL.Au.signOut(CL.auth);toast('سُجّل الخروج')}catch(e){toast('تعذّر تسجيل الخروج',true)}},
  genCopy(){try{navigator.clipboard.writeText(UI.gen).then(()=>toast('نُسخ نص التقرير'),()=>toast('تعذّر النسخ',true))}catch(e){toast('تعذّر النسخ',true)}},
  genTxt(){offerFile('تقرير-'+(UI.gsc?UI.gsc.type+'-'+UI.gsc.key:'عام')+'.txt',UI.gen)},
  genPrint(){$('#rptPrint').textContent=UI.gen;document.body.classList.add('print-report');window.onafterprint=()=>document.body.classList.remove('print-report');window.print()},
  fillWeekly(){const w=WEEKS.find(x=>x.id===(UI.gsc||{}).key);if(!w)return;const o=scopeOf(UI.gsc),ints=S.interventions.filter(i=>inR(i.date,o.from,o.to)),r=S.reports[w.id]||(S.reports[w.id]={});
    const put=(k,v)=>{if(v&&!String(r[k]||'').trim())r[k]=v},u=a=>[...new Set(a.filter(Boolean))].join('، ');
    put('skills',u(ints.map(i=>i.skill)));put('groups',u(ints.map(i=>i.group)));put('planned',ints.map(i=>'• '+i.action+' ('+lab(IS,i.status)+')').join('\n'));
    put('evidence',ints.map(i=>String(i.evidence||'').trim()).filter(Boolean).map(x=>'• '+x).join('\n'));
    put('barriers',ints.map(i=>String(i.barrier||'').trim()).filter(Boolean).map(x=>'• '+x).join('\n'));put('corrective',ints.map(i=>String(i.corrective||'').trim()).filter(Boolean).map(x=>'• '+x).join('\n'));
    const is=intStats(),as=attStats();put('progress','تنفيذ التدخلات: '+PT(is.rate)+' ('+is.d+' من '+is.t+')'+(as.rate!=null?' · حضور جلسات الدعم: '+PT(as.rate):''));
    const nw=WEEKS[WEEKS.indexOf(w)+1];put('next',nw?nw.priority.replace('أولوية هذا الأسبوع: ','')+'\n'+nw.tasks.slice(0,3).map(t=>'• '+t.text).join('\n'):'');
    r.updatedAt=Date.now();save();UI.rw=w.id;location.hash='report';go('report');toast('عُبّئت الحقول الفارغة من بيانات الفترة')},
  recheck(){CL.err=null;refreshBackup();checkAdmin()},
  cloudRetry(){S.meta.updated=Date.now();persistLocal();push()},
  copyVal(id,el){try{navigator.clipboard.writeText(el.dataset.v).then(()=>toast('تم النسخ'),()=>toast('تعذّر النسخ',true))}catch(e){toast('تعذّر النسخ',true)}},
  async reset(){if(await ask('مسح كل البيانات؟','سيُحذف كل ما أدخلته على هذا الجهاز. تأكد من تصدير نسخة احتياطية أولًا.','امسح')){S=blank();S.meta.updated=Date.now();persist();go(curSec());toast('مُسحت البيانات')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset.id,b)});

document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();if(!checkForm(f))return;const v=id=>$('#'+id).value.trim();
  switch(f.dataset.form){
  case 'addInt':S.interventions.push({id:uid(),group:v('iv-group'),skill:v('iv-skill'),cause:v('iv-cause'),action:v('iv-action'),date:v('iv-date'),status:v('iv-status'),barrier:'',corrective:'',evidence:''});save();go('interventions');toast('سُجّل التدخل');break;
  case 'addSkill':{const t=N(v('sk-target'));if(t!=null&&(t<1||t>100||!Number.isInteger(t))){const fl=$('#sk-target').closest('.fld');fl.classList.add('invalid');$('.err',fl).textContent='أدخل عددًا صحيحًا من 1 إلى 100';return}
    S.skills.push({id:uid(),name:v('sk-name'),subject:v('sk-subject'),grade:v('sk-grade'),target:t});save();go('measure');toast('أُضيفت المهارة');break}
  case 'addSession':{const x=N(v('se-exp')),y=N(v('se-act'));if(!(x>0)||!Number.isInteger(x)||!(y>=0)||!Number.isInteger(y)||y>x){const fl=$('#se-act').closest('.fld');fl.classList.add('invalid');$('.err',fl).textContent='أدخل أعدادًا صحيحة، ولا يتجاوز الفعلي المتوقع';$('#se-act').focus();toast('تحقق من أعداد الحضور',true);return}
    S.sessions.push({id:uid(),date:v('se-date'),label:v('se-label'),expected:x,actual:y});save();go('attendance');toast('سُجّلت الجلسة');break}
  case 'gen':{UI.gt=$('#gt').value;UI.gk=$('#gs').value;UI.gsc={type:UI.gt,key:UI.gk};const R2=buildReport(UI.gsc);UI.gen=R2.text;UI.gins=R2.ins;go('generator',true);toast('تم توليد التقرير');break}
  case 'addObs':S.obs.push({id:uid(),teacher:v('ob-teacher'),date:v('ob-date'),scores:PRACTICES.map((_,i)=>Number(v('ob-p'+i))),created:Date.now()});save();go('observation');toast('سُجّلت الملاحظة');break}
});

/* ---------- Firebase (shared saving, admin signs in with Google) ---------- */
function genId(){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',a=new Uint8Array(32);crypto.getRandomValues(a);return [...a].map(x=>c[x%62]).join('')}
function isBlank(){return !(S.skills.length||S.interventions.length||S.sessions.length||S.obs.length||Object.keys(S.tasks).length||Object.keys(S.outputs).length||Object.keys(S.miles).length||Object.keys(S.reports).length||Object.keys(S.checklist).length)}
function applyRemote(r){let d;try{d=JSON.parse(r.data)}catch(e){CL.err='البيانات المشتركة تالفة';return false}
  if(!valid({app:APP,data:d})){CL.err='صيغة البيانات المشتركة غير مطابقة';return false}
  S=Object.assign(blank(),d);S.meta={updated:r.updatedAt||0,rev:r.rev||0};return true}
function renderAdminBox(){const b=$('#adminBox');if(!b)return;
  const err=CL.err&&(CL.role==='admin'||CL.user||/تسجيل|Google|نطاق|التحقق|رُفضت|المزامنة|الحفظ/.test(CL.err))?'<div class="bad">'+esc(CL.err)+'</div>':'';
  if(CL.role==='admin')b.innerHTML='المسؤول: <bdi>'+esc(CL.user&&CL.user.email||'')+'</bdi> <button type="button" data-act="signOutA">خروج</button>'+err;
  else if(CL.user)b.innerHTML='الحساب <bdi>'+esc(CL.user.email)+'</bdi> ليس مسؤولًا.'+err+'<div><button type="button" data-act="recheck">أعد التحقق</button><button type="button" data-act="signOutA">خروج</button></div>';
  else b.innerHTML='<button type="button" data-act="signIn">دخول المسؤول</button>'+err}
function refreshBackup(){renderAdminBox()}
function setBadge(){const b=$('#roleBadge');
  if(CL.role==='admin'){b.style.display='';b.className='chip done';b.textContent='مسؤول'}
  else{b.style.display='';b.className='chip doing';b.textContent='عرض فقط'}
  renderAdminBox()}
function rulesTxt(){const em=(CL.user&&CL.user.email||'ضع_بريد_المسؤول_هنا').toLowerCase();return `    // ===== لوحة متابعة خطة تحسين المدرسة =====
    function isPlanAdmin() {
      return request.auth != null
        && request.auth.token.email_verified == true
        && request.auth.token.email in ['${em}'];
    }
    function validPlanDoc() {
      let d = request.resource.data;
      return d.keys().hasOnly(['data', 'updatedAt', 'rev'])
        && d.data is string
        && d.data.size() < 900000
        && d.rev is int;
    }
    match /${COL}/{spaceId} {
      allow get: if true;                 // القراءة لمن يملك الرابط السري
      allow list: if isPlanAdmin();       // يجد المسؤول مساحته من أي جهاز
      allow create, update: if isPlanAdmin() && validPlanDoc();
      allow delete: if false;
    }
    // ===== نهاية الكتلة =====
    // تُضاف داخل: match /databases/{database}/documents { ... }`}
async function loadSdk(){
  if(CL.F)return true;
  try{const [A,Au,F]=await Promise.all([import(FB_URL+'firebase-app.js'),import(FB_URL+'firebase-auth.js'),import(FB_URL+'firebase-firestore.js')]);
    const app=A.initializeApp(FB_CFG);CL.F=F;CL.Au=Au;CL.db=F.getFirestore(app);CL.auth=Au.getAuth(app);return true}
  catch(e){CL.err='تعذّر تحميل Firebase. تأكد من الاتصال بالإنترنت وفتح الصفحة عبر رابط http أو https.';setStatus(CL.err);refreshBackup();return false}}
function bindAuth(){if(CL.bound)return;CL.bound=true;
  CL.Au.onAuthStateChanged(CL.auth,u=>{
    if(u&&!u.isAnonymous){CL.user={email:u.email||'',uid:u.uid};refreshBackup();checkAdmin()}
    else{CL.user=null;if(CL.role==='admin')dropAdmin();refreshBackup()}})}
function watchSpace(){
  if(!CL.space||CL.unsub)return;
  CL.unsub=CL.F.onSnapshot(CL.F.doc(CL.db,COL,CL.space),snap=>{
    if(CL.role!=='viewer')return;
    if(!snap.exists()){CL.err='لم يحفظ المسؤول أي بيانات بعد.';setStatus(CL.err);return}
    if(applyRemote(snap.data())){CL.err=null;setStatus('آخر تحديث '+timeNow());go(curSec(),true)}else setStatus(CL.err)},
    e=>{CL.err='تعذّرت قراءة البيانات المشتركة ('+(e.code||'خطأ')+')';setStatus(CL.err)});
  CL.ready=true}
async function checkAdmin(){
  if(CL.busy||(CL.role==='admin'&&CL.ready)||!CL.user)return;CL.busy=true;
  try{
    const F=CL.F;let qs;
    try{qs=await F.getDocs(F.query(F.collection(CL.db,COL),F.orderBy('updatedAt','desc'),F.limit(1)))}
    catch(e){CL.err=e.code==='permission-denied'?'الحساب '+CL.user.email+' ليس مسؤولًا في قواعد Firestore. أضف بريده إلى القواعد (ظاهرة أدناه) وانشرها، ثم اضغط «أعد التحقق».':'تعذّر التحقق من صلاحية المسؤول ('+(e.code||'خطأ')+')';refreshBackup();return}
    const id=SHARED;
    if(CL.unsub){CL.unsub();CL.unsub=null}
    if(CL.role==='viewer')S=load();
    try{if(isBlank()){const fx=await F.getDoc(F.doc(CL.db,COL,id));if(!fx.exists()&&qs.docs.length&&qs.docs[0].id!==id)applyRemote(qs.docs[0].data())}}catch(e){}
    CL.space=id;CL.role='admin';CL.err=null;
    try{localStorage.setItem('plan_space',id);localStorage.setItem('plan_cloud','1')}catch(e){}
    setBadge();await adminSync();
  }finally{CL.busy=false}}
function dropAdmin(){clearTimeout(pushT);CL.ready=false;
  CL.role='viewer';setBadge();S=blank();watchSpace();go(curSec(),true)}
async function adminSync(){
  const F=CL.F;CL.ref=F.doc(CL.db,COL,CL.space);CL.ready=false;
  try{
    const snap=await F.getDoc(CL.ref);let pushNow=!snap.exists();
    if(snap.exists()){const r=snap.data(),lu=S.meta.updated||0;
      if(isBlank()){if(applyRemote(r)){persistLocal();go(curSec(),true)}}
      else if((r.updatedAt||0)>lu+1000){
        if(await ask('نسخة مشتركة أحدث','يوجد في Firebase نسخة أحدث من بيانات هذا الجهاز. إن اخترت استخدامها فستُستبدل بيانات الجهاز بها، وإن ألغيت فستحل بيانات هذا الجهاز محلها.','استخدم النسخة المشتركة')){if(applyRemote(r)){persistLocal();go(curSec(),true)}}
        else{S.meta.updated=Date.now();pushNow=true}}
      else if(lu>(r.updatedAt||0))pushNow=true}
    CL.ready=true;CL.err=null;refreshBackup();
    if(pushNow)push();else setStatus('متزامن '+timeNow());
  }catch(e){CL.err='تعذّرت المزامنة ('+(e.code||'خطأ')+')';setStatus(CL.err);refreshBackup()}}
async function push(){
  if(CL.role!=='admin'||!CL.ready||!CL.ref)return;
  S.meta.rev=(S.meta.rev||0)+1;const txt=JSON.stringify(S);
  if(txt.length>880000){setStatus('حجم البيانات أكبر من حد الحفظ على الخادم');toast('حجم البيانات أكبر من الحد المسموح للحفظ المشترك',true);return}
  try{await CL.F.setDoc(CL.ref,{data:txt,updatedAt:S.meta.updated||Date.now(),rev:S.meta.rev});CL.err=null;setStatus('حُفظ مشتركًا '+timeNow())}
  catch(e){CL.err=e.code==='permission-denied'?'رُفضت الكتابة: هذا الحساب ليس المسؤول في قواعد Firestore.':'تعذّر الحفظ على الخادم ('+(e.code||'خطأ')+')';setStatus('تعذّر الحفظ على الخادم');toast(CL.err,true);refreshBackup()}}
async function cloudInit(){
  if(!CL.flag)return;
  if(!await loadSdk())return;
  bindAuth();if(CL.role==='viewer')watchSpace()}

/* ---------- start ---------- */
setBadge();
setStatus('جارٍ تحميل البيانات…');
go(curSec());
cloudInit();
})();
</script>
