<head>

<title>English Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f766e;--g2:#0a5a54;--y:#f5b82e;--y2:#c98f0c;--ink:#12302e;--bg:#f3f7f5;--line:#dbe5e1;--ok:#16a34a;--no:#e2552b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
.en{font-family:Fredoka,Tajawal,sans-serif}
button{font:inherit;cursor:pointer;border:0}
.scroll{flex:1;overflow:auto;padding:0 18px 18px}
h1,h2,p{margin:0}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--g);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--g2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}
.btn.y{background:var(--y);color:var(--ink);box-shadow:0 4px 0 var(--y2)}
.btn.alt{background:#fff;color:var(--g);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.hero{background:linear-gradient(160deg,var(--g),#064e48);color:#fff;padding:48px 24px 56px;border-radius:0 0 36px 36px;text-align:center}
.logo{width:88px;height:88px;margin:0 auto 14px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:3rem;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:bob 3s ease-in-out infinite}
.hero h1{font-size:2.2rem}.hero p{opacity:.9;margin-top:6px}
.sheet{padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.sheet label{font-weight:700}
.code{width:100%;padding:16px;font-size:1.6rem;text-align:center;letter-spacing:6px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.code{resize:none;height:80px;overflow:hidden;line-height:1.3;padding:14px 16px}
.code:focus{border-color:var(--g);outline:0}
.err{color:var(--no);font-weight:700;min-height:1.4em}.mut{color:#5f7673;text-align:center;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px}
.top small{display:block;color:#5f7673}.top b{font-size:1.3rem}
.pill{background:#fff;border:2px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:800}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 4px 0 var(--line)}
.lesson h2{font-size:1.6rem;margin:8px 0}.tag{background:#e0f2ef;color:var(--g);padding:4px 12px;border-radius:12px;font-weight:800;font-size:.85rem}
.path{display:flex;justify-content:space-between;margin:18px 0}
.path div{flex:1;text-align:center;font-size:.85rem;color:#5f7673}.path span{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:#e8f0ed;font-size:1.3rem}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1rem}
.prog{flex:1;height:12px;background:#dfe9e5;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .35s}
.foot{display:flex;gap:10px;padding:14px 18px 18px}.foot .btn.alt{flex:1}.foot .btn:not(.alt){flex:2}
.flash{position:relative;text-align:center;padding:40px 22px;margin-top:10px;animation:pop .3s}
.spk{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:1.6rem;box-shadow:0 4px 0 var(--g2);margin-bottom:18px}
.big{font-size:3rem;direction:ltr}.ar{font-size:1.6rem;color:var(--g);font-weight:800;margin:6px 0 16px}
.ex{direction:ltr;background:#f3f7f5;border-radius:14px;padding:12px;font-size:1.15rem}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:2px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:#e0f2ef;display:grid;place-items:center;font-size:1.4rem}
.chathead small{display:block;color:var(--ok);font-weight:700;font-size:.8rem}
.log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:6px;align-items:flex-end;max-width:88%;animation:pop .25s}.m.bot{align-self:flex-start;flex-direction:row-reverse}.m.me{align-self:flex-end}
.b{padding:11px 15px;border-radius:20px;font-size:1.1rem;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.bot .b{background:#fff;border:2px solid var(--line);border-bottom-left-radius:6px;direction:ltr;text-align:left}
.me .b{background:var(--g);color:#fff;border-bottom-right-radius:6px}
.say{width:34px;height:34px;border-radius:50%;background:#e0f2ef;font-size:.95rem;flex:none}
.fix{align-self:flex-start;max-width:92%;background:#fff6e0;border:2px solid #f5d98a;border-radius:16px;padding:10px 14px;line-height:1.7;animation:pop .25s}.fix b{display:block;color:var(--y2)}
.dots{display:inline-flex;gap:4px;padding:4px 2px}.dots i{width:8px;height:8px;border-radius:50%;background:#9bb3ae;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.dock{padding:10px 14px 14px;background:#fff;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.comp{display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;resize:none;max-height:120px;padding:12px 16px;font:inherit;font-size:1.1rem;border:2px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);line-height:1.4}
.comp textarea:focus{border-color:var(--g);outline:0;background:#fff}
#send{width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;font-size:1.3rem;box-shadow:0 3px 0 var(--g2);flex:none}#send:disabled{opacity:.4}
.q{font-size:1.6rem;line-height:1.5;margin:24px 0 18px;direction:ltr;text-align:left}
.opt{display:block;width:100%;direction:ltr;text-align:left;padding:16px;margin-bottom:12px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-size:1.2rem;font-family:Fredoka,Tajawal,sans-serif;color:var(--ink)}
.opt.sel{border-color:var(--g);background:#e0f2ef;box-shadow:0 4px 0 var(--g)}
.stars{font-size:3.4rem;color:var(--y);text-align:center;letter-spacing:8px;text-shadow:0 3px 0 var(--y2)}.stars span{display:inline-block;animation:pop .5s backwards}
.rv{padding:11px 14px;border-radius:14px;margin-top:8px;direction:ltr;text-align:left;font-weight:500}.rv.ok{background:#e3f6ea}.rv.no{background:#fde8e1}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.conf i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r))}}@keyframes pop{from{transform:scale(.92);opacity:0}}@keyframes dot{50%{transform:translateY(-5px)}}@keyframes bob{50%{transform:translateY(-6px)}}
.les{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;text-align:right;color:var(--ink)}.les .ic{font-size:1.8rem}.les .tx{flex:1;display:flex;flex-direction:column}.les b{font-size:1.15rem}.les small{color:#5f7673}.les .st{color:var(--y);letter-spacing:2px}.les.lock{opacity:.5}.les.cur{border-color:var(--g);box-shadow:0 4px 0 var(--g)}.unit{margin:22px 0 10px;font-size:1.05rem;color:var(--g)}
.grades{display:flex;gap:8px}.grades .btn{flex:1;padding:12px}.btn.alt.on{background:var(--g);color:#fff;border-color:var(--g)}.field{font-size:1.15rem!important;letter-spacing:0!important;height:68px!important;line-height:1.4!important}.bigcode{font:600 3rem Fredoka,monospace;letter-spacing:10px;text-align:center;direction:ltr;background:#fff;border:3px dashed var(--g);border-radius:20px;padding:18px;color:var(--g)}
.exam{border-color:#c9d9ff;background:#f3f7ff}.ans{min-height:64px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;direction:ltr;padding:8px 0;margin-bottom:18px}.wb{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.wd{font:inherit;font-family:Fredoka,sans-serif;font-size:1.15rem;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);color:var(--ink)}.wd.on{border-color:var(--g)}
.ring{width:130px;height:130px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#dfe9e5 0)}.ring b{width:98px;height:98px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.8rem}
.pill.hot{border-color:#f5b82e;background:#fff6e0}.pill.cold{opacity:.65}
.q,.rv{white-space:pre-line}.dl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);direction:ltr;text-align:left;font-size:1.1rem}
.q.long{font-size:1.1rem;line-height:1.8}.pgtxt{font-size:1.25rem;line-height:2;margin-top:12px;text-align:left;direction:ltr}.pg{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;text-align:left;direction:ltr}.pg p{line-height:1.8;margin-top:6px}
.cert{background:#fff;border:6px double var(--g);border-radius:20px;padding:26px 18px;text-align:center;margin-top:14px}.cert h1{font-size:1.9rem;color:var(--g)}.cname{font-size:1.9rem;color:var(--g);margin:10px 0}.ct{width:100%;margin:12px 0;border-collapse:collapse}.ct td{padding:8px;border-bottom:1px dashed var(--line);text-align:right}.ct td:last-child{text-align:left;font-weight:700}
@media print{.foot,.top{display:none!important}#app{height:auto;overflow:visible;max-width:none}.scroll{overflow:visible}}
.inst{display:flex;align-items:center;gap:10px;background:#e0f2ef;border:2px solid #b7ddd7;border-radius:16px;padding:10px 12px;margin-bottom:12px}.inst>div{flex:1;display:flex;flex-direction:column}.inst small{color:#3d6a65}.inst .btn{width:auto;padding:10px 16px;font-size:.95rem}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:20px}.mbox{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%}.mbox ol{line-height:2.1;padding-right:20px;margin:10px 0 16px}
.copy{margin-top:auto;padding-top:18px;text-align:center;color:#5f7673;font-size:.85rem;line-height:1.8}
.ann{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}.ai{padding:8px 0;border-top:1px dashed var(--line)}.ai:first-of-type{border-top:0}.ai.cong{background:linear-gradient(90deg,#fff8e0,transparent);border-radius:12px;padding:8px}.ah{display:flex;justify-content:space-between;color:#5f7673;font-size:.85rem}.ah em{background:var(--no);color:#fff;border-radius:8px;padding:1px 7px;font-style:normal;font-size:.7rem}.ai p{margin-top:4px;line-height:1.8;white-space:pre-wrap}.award{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff3c4,#ffe08a);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}.trophy{font-size:2.4rem;animation:bob 2s ease-in-out infinite}.award p{margin-top:2px}
.wotd{background:linear-gradient(135deg,#fff7df,#ffeaa8);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}.wh{display:flex;justify-content:space-between;color:#7a5a12}.ww{display:flex;align-items:center;gap:10px;margin-top:6px;direction:ltr}.ww .en{font-size:2.2rem;font-weight:600}.wa{font-size:1.5rem;color:var(--g);font-weight:800;margin:2px 0 8px}.wx{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;margin-bottom:10px;text-align:left}.wx p{direction:rtl;text-align:right;color:#5f7673;margin-top:4px}.wdone{background:#d9f3e2;color:#15803d;border-radius:14px;padding:10px;text-align:center;font-weight:800}
.opt.good{border-color:var(--ok);background:#e3f6ea;box-shadow:0 4px 0 var(--ok)}.opt.bad{border-color:var(--no);background:#fde8e1;box-shadow:0 4px 0 var(--no);animation:shake .35s}
.locked .opt{pointer-events:none}.fb[hidden]{display:none}
.fb{display:flex;align-items:center;gap:12px;padding:14px 18px 18px;transition:background .2s}.fb .btn{flex:0 0 42%}.fb>.btn:only-child{flex:1}
.fb.ok{background:#d9f3e2}.fb.no{background:#fbddd2}.fbmsg{flex:1;display:flex;flex-direction:column;line-height:1.5}.fbmsg b{font-size:1.25rem}.fbmsg small{color:#5f4a42}.fbmsg span{font-size:1.1rem;font-weight:700;direction:ltr;text-align:right}
.fb.ok b{color:#15803d}.fb.no b{color:#c2410c}.btn.no{background:var(--no);box-shadow:0 4px 0 #a8401a}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2 visual refresh ===== */
:root{--r:20px;--sh:0 1px 2px rgba(18,48,46,.06),0 8px 24px rgba(18,48,46,.09)}
body{background:radial-gradient(900px 420px at 50% -160px,#cfeae4 0,transparent 70%),var(--bg)}
#app{background:transparent}
#app>*{animation:rise .28s ease both}
#app>.fb{animation:slideup .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes slideup{from{transform:translateY(100%)}}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(15,118,110,.16)}}
h1,h2,h3{letter-spacing:-.2px}
.top{background:linear-gradient(135deg,#0f766e,#0a5a54);color:#fff;border-radius:0 0 28px 28px;padding:24px 20px 26px;margin-bottom:14px;box-shadow:0 12px 26px rgba(15,118,110,.28)}
.top small{color:#bfe6df}.top b{color:#fff;font-size:1.45rem}
.pill{background:rgba(255,255,255,.16);border:0;color:#fff}
.pill.hot{background:#f5b82e;color:#12302e}.pill.cold{opacity:.85}
.card{border:0;box-shadow:var(--sh);border-radius:var(--r)}
.les{transition:transform .15s}.les:not(.lock):active{transform:scale(.985)}
.les .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:#e0f2ef;font-size:1.65rem;flex:none}
.les[data-unit="2"] .ic{background:#fff0d6}.les[data-unit="3"] .ic{background:#e6ecff}.les[data-unit="4"] .ic{background:#fde4e4}.les[data-unit="5"] .ic{background:#efe4ff}.les[data-unit="6"] .ic{background:#dcf5ec}.les[data-unit="7"] .ic{background:#fff5cc}.les[data-unit="8"] .ic{background:#ffe3d1}.les[data-unit="9"] .ic{background:#dff1ff}.les[data-unit="10"] .ic{background:#f3e0f7}
.les.lock .ic{filter:grayscale(1);opacity:.7}
.les.cur{outline:3px solid var(--g);outline-offset:-3px;animation:glow 2.2s ease-in-out infinite}
.les.exam{background:linear-gradient(135deg,#f1f5ff,#e1eaff)}
.unit{display:inline-block;background:var(--g);color:#fff;padding:5px 15px;border-radius:14px;font-size:.9rem;margin:26px 0 10px}
.prog{height:14px;background:#e1ebe7}.prog i{background:linear-gradient(90deg,#16a34a,#5bdc8a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.btn{border-radius:18px}
.opt{border-radius:18px;transition:transform .12s,background .12s}.opt:active{transform:scale(.98)}
.opt.good{animation:pop .3s}
.hero{position:relative;overflow:hidden}.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:230px;height:230px;top:-90px;right:-70px}.hero::after{width:170px;height:170px;bottom:-70px;left:-50px}
.logo{position:relative;z-index:1}.hero h1,.hero p{position:relative;z-index:1}
.x{border:0;box-shadow:var(--sh)}
.chathead{border:0;box-shadow:0 2px 14px rgba(18,48,46,.07)}
.b{box-shadow:0 1px 3px rgba(18,48,46,.07)}.bot .b{border:0}
.dock{border:0;box-shadow:0 -6px 22px rgba(18,48,46,.07)}
.cert{box-shadow:var(--sh)}

/* ===== journey map ===== */
.jm{position:relative;margin:0 auto 6px;max-width:360px}
.jm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jm path{fill:none;stroke:#a9cfc8;stroke-width:7;stroke-linecap:round;stroke-dasharray:1 15}
.nd{position:absolute;transform:translate(-50%,-50%);width:96px;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;color:var(--ink);transition:transform .15s}
.nd:not(:disabled):active{transform:translate(-50%,-50%) scale(.94)}
.nd .c{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:1.95rem;background:#fff;border:4px solid #fff;box-shadow:0 5px 0 #c9d9d5,0 12px 20px rgba(18,48,46,.14)}
.nd[data-unit="2"] .c{background:#fff0d6}.nd[data-unit="3"] .c{background:#e6ecff}.nd[data-unit="4"] .c{background:#fde4e4}.nd[data-unit="5"] .c{background:#efe4ff}.nd[data-unit="6"] .c{background:#dcf5ec}.nd[data-unit="7"] .c{background:#fff5cc}.nd[data-unit="8"] .c{background:#ffe3d1}.nd[data-unit="9"] .c{background:#dff1ff}.nd[data-unit="10"] .c{background:#f3e0f7}
.nd.done .c{background:var(--ok)!important;box-shadow:0 5px 0 #11773f,0 12px 20px rgba(22,163,74,.25)}
.nd.cur .c{border-color:var(--y);animation:pulse 1.7s ease-in-out infinite}
.nd.lock .c{background:#e4ebe8!important;filter:grayscale(1);opacity:.75;box-shadow:0 4px 0 #cdd8d4}
.nd .t{font-size:.78rem;margin-top:10px;font-weight:700;line-height:1.25;text-align:center;max-width:96px}
.nd .s{color:var(--y);font-size:.78rem;letter-spacing:1px;margin-top:2px}
.nd .you{position:absolute;top:-32px;background:var(--ink);color:#fff;padding:4px 12px;border-radius:12px;font-size:.75rem;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
.nd .you::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.nd.exn .c{width:78px;height:78px;border-radius:24px;background:linear-gradient(135deg,#dbe6ff,#c3d4ff)!important}
.nd.exn.done .c{background:var(--ok)!important}.nd.exn.lock .c{background:#e4ebe8!important}
.unit{display:block;width:fit-content}
@keyframes pulse{50%{box-shadow:0 5px 0 #c9d9d5,0 0 0 10px rgba(245,184,46,.3)}}

/* ===== certificate + onboarding ===== */
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 10px}.dots i{width:9px;height:9px;border-radius:50%;background:#cfe0dc;transition:all .2s}.dots i.on{width:26px;border-radius:6px;background:var(--g)}
.cert2{background:#fffdf7;border:3px solid #c9962b;border-radius:14px;padding:8px;margin-top:14px;box-shadow:var(--sh);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cin{border:2px solid #c9962b;border-radius:8px;padding:22px 14px;text-align:center;background:radial-gradient(circle at 50% 0,#fff4d6,transparent 62%)}
.ck{color:#7a5a12;font-weight:800}.ct2{font-size:2.1rem;color:#0f766e;margin:6px 0 2px}.cs{color:#5f7673;font-size:.95rem}
.cp{margin-top:14px;color:#3c4f4c}.cname2{font-size:2rem;color:#0f766e;margin:8px 0;border-bottom:2px dashed #c9962b;display:inline-block;padding:0 18px 6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:16px 0;text-align:right;font-size:.82rem}.cgrid div{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px dotted #e3d3a6}
.cfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:12px}.cfoot>div{flex:1;display:flex;flex-direction:column;gap:2px;font-size:.8rem;text-align:center}.cfoot small{color:#6b7a77}
.sig{font-size:1rem;border-top:1px solid #7a5a12;padding-top:4px;margin-top:10px}.seal{width:78px;height:78px;flex:none}
@media print{@page{size:A4 landscape;margin:8mm}.cert2{margin:0;box-shadow:none;page-break-inside:avoid}body{background:#fff!important}}
.guide{background:#fff8e0;border:2px solid #f5d98a;border-radius:16px;padding:12px 14px;line-height:1.9}.guide ol{margin:6px 0 0;padding-right:20px}.or{text-align:center;color:#5f7673;margin:2px 0}

/* ===== keep the daily zone first ===== */
.scroll.hasr{padding-bottom:104px}
.resume{position:fixed;bottom:0;left:50%;width:min(480px,100%);transform:translateX(-50%);padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 38%);transition:transform .25s,opacity .25s;z-index:5}
.resume.hide{transform:translate(-50%,120%);opacity:0;pointer-events:none}
.wotd.todo{outline:3px solid #f5b82e;outline-offset:-3px;animation:wglow 2.4s ease-in-out infinite}
@keyframes wglow{50%{box-shadow:0 0 0 8px rgba(245,184,46,.32)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'https://europe-west1-naj7-7da9d.cloudfunctions.net/tutor';
const $ = s => document.querySelector(s), app = $('#app');
const S = { wi: 0 };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => t.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8);
const star = (n, t = 3) => '★'.repeat(n) + '☆'.repeat(t - n);
const view = h => { app.innerHTML = h; };
function say(t){ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .85; speechSynthesis.speak(u); }
async function api(action, extra = {}){
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, code:S.code, lid:S.lid, ...extra }) });
  const j = await r.json().catch(() => ({})); if(!r.ok) throw j; return j;
}
const bar = (cur, tot) => `<div class="bar"><button class="x" id="home" aria-label="خروج">✕</button><div class="prog"><i style="width:${cur / tot * 100}%"></i></div></div>`;

let deferred = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installCard(){
  if(standalone() || Date.now() < +(localStorage.getItem('eb_noinst') || 0)) return '';
  return '<div class="inst" id="inst"><div><b>📲 ثبّت التطبيق على جوالك</b><small>يفتح بأيقونة مثل أي تطبيق</small></div><button class="btn" id="instgo">تثبيت</button><button class="x" id="instx" aria-label="إغلاق">✕</button></div>';
}
function bindInstall(){
  const g = $('#instgo'); if(!g) return;
  $('#instx').onclick = () => { localStorage.setItem('eb_noinst', Date.now() + 7 * 864e5); $('#inst').remove(); };
  g.onclick = async () => { if(deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; $('#inst').remove(); } else installHelp(); };
}
function installHelp(){
  const steps = isIOS()
    ? ['افتح الموقع في متصفح <b>Safari</b> (وليس داخل تطبيق آخر)', 'اضغط زر المشاركة <b>⬆️</b> أسفل الشاشة', 'اختر <b>إضافة إلى الشاشة الرئيسية</b>', 'اضغط <b>إضافة</b>']
    : ['افتح الموقع في متصفح <b>Chrome</b>', 'اضغط القائمة <b>⋮</b> أعلى الشاشة', 'اختر <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>', 'اضغط <b>تثبيت</b>'];
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="mbox"><h2>📲 تثبيت English Buddy</h2><ol>${steps.map(x => `<li>${x}</li>`).join('')}</ol><button class="btn" id="mok">حسنًا</button></div>`;
  document.body.append(d); $('#mok').onclick = () => d.remove();
}
function login(){
  view(`<div class="hero"><div class="logo">🦉</div><h1 class="en">English Buddy</h1><p>تعلّم الإنجليزية خطوة بخطوة</p></div>
  <div class="sheet scroll">${installCard()}<div class="guide"><b>🆕 أول مرة تدخل؟ سجّل في 3 خطوات</b><ol><li>اضغط الزر الأصفر <b>«أنا جديد — سجّلني»</b></li><li>اكتب <b>اسمك الثلاثي</b> واختر <b>صفك</b></li><li>سيظهر لك <b>رقمك السري (6 أرقام)</b>، صوّره أو اكتبه، فهو مفتاح دخولك دائمًا</li></ol></div><button class="btn y" id="newreg">🆕 أنا جديد — سجّلني</button><p class="or">— أو —</p><label for="code">عندي رقم سري (6 أرقام)</label><textarea id="code" class="code en" rows="1" dir="ltr" enterkeyhint="go" aria-label="رمز الدخول" placeholder="CODE"></textarea>
  <button class="btn" id="go">ابدأ</button><p class="err" id="err" role="alert"></p><button class="btn alt" id="contactbtn">✉️ راسل المشرف</button><p class="copy">جميع الحقوق محفوظة 2026<br>تطوير الأستاذ نواف الصبحي</p></div>`);
  const go = async () => {
    S.code = norm($('#code').value); if(!S.code) return;
    $('#go').disabled = true; $('#err').textContent = '';
    try { Object.assign(S, await api('login')); localStorage.setItem('eb_code', S.code); home(); }
    catch(e){ $('#go').disabled = false; $('#err').textContent = e.error === 'slow' ? 'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة' : e.error === 'unknown_code' ? 'هذا الرقم غير صحيح. اكتب رقمك السري (6 أرقام) الذي ظهر لك بعد التسجيل. وإن كنت جديدًا فاضغط «أنا جديد — سجّلني».' : 'تعذر الاتصال، حاول مرة أخرى'; }
  };
  bindInstall(); $('#newreg').onclick = register; $('#contactbtn').onclick = contact; $('#go').onclick = go; $('#code').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); go(); } };
  $('#code').value = localStorage.getItem('eb_code') || '';
  $('#code').focus();
}

function contact(){
  const wc = t => (t.trim().match(/\S+/g) || []).length;
  view(`${bar(0, 1)}<div class="scroll"><div class="card" style="margin-top:10px"><h2>✉️ راسل المشرف</h2><p class="mut" style="text-align:right">اكتب اسمك ورسالتك (حتى 100 كلمة).</p>
  <label for="cn" style="display:block;margin-top:12px;font-weight:700">الاسم</label><textarea id="cn" class="code field" rows="1" dir="auto" style="text-align:right" placeholder="اسمك الثلاثي"></textarea>
  <label for="cm" style="display:block;margin-top:12px;font-weight:700">الرسالة</label><textarea id="cm" class="code" rows="5" dir="auto" style="height:150px;text-align:right;letter-spacing:0;font-size:1.1rem"></textarea>
  <p class="mut" id="wcnt" style="text-align:left;direction:ltr">0 / 100</p><button class="btn" id="cs">إرسال</button><p class="err" id="err" role="alert"></p></div></div>`);
  const back = () => (S.lessons ? home() : login());
  $('#home').onclick = back; $('#cn').value = S.name || '';
  $('#cm').oninput = () => { const n = wc($('#cm').value); $('#wcnt').textContent = n + ' / 100'; $('#wcnt').style.color = n > 100 ? 'var(--no)' : ''; };
  $('#cs').onclick = async () => {
    const name = $('#cn').value.replace(/\s+/g, ' ').trim(), text = $('#cm').value.trim(), n = wc(text), err = $('#err');
    if(name.length < 3){ err.textContent = 'اكتب اسمك'; return; }
    if(n < 1){ err.textContent = 'اكتب رسالتك'; return; }
    if(n > 100){ err.textContent = 'الرسالة أطول من 100 كلمة، اختصرها'; return; }
    $('#cs').disabled = true; err.textContent = '';
    try { await api('msg_send', { name, text });
      view(`<div class="hero"><div class="logo">✅</div><h1>تم الإرسال</h1><p>وصلت رسالتك إلى المشرف</p></div><div class="sheet"><button class="btn" id="bk">رجوع</button></div>`);
      $('#bk').onclick = back;
    } catch(e){ $('#cs').disabled = false; err.textContent = e.error === 'busy' ? 'وصلت للحد اليومي للرسائل، حاول غدًا' : e.error === 'bad_input' ? 'تأكد من الاسم والرسالة' : 'تعذر الإرسال، حاول مرة أخرى'; }
  };
}
function register(){
  let grade = 0;
  view(`<div class="hero"><div class="logo">🦉</div><h1>تسجيل جديد</h1><p>سجّل مرة واحدة واحصل على رقمك</p></div>
  <div class="scroll"><div class="sheet" style="padding:22px 0"><div class="guide"><b>خطوتان فقط</b><ol><li>اكتب <b>اسمك الثلاثي</b> واختر <b>صفك</b></li><li>اضغط <b>«سجّلني»</b> فيظهر رقمك السري للدخول</li></ol></div><label for="nm">الاسم الثلاثي</label><textarea id="nm" class="code field" rows="1" dir="auto" placeholder="مثال: أحمد محمد علي"></textarea>
  <label>الصف</label><div class="grades">${['أول','ثاني','ثالث'].map((g, i) => `<button type="button" class="btn alt" data-g="${i + 1}">${g}</button>`).join('')}</div>
  
  <button class="btn" id="reg">سجّلني</button><p class="err" id="err" role="alert"></p><button class="btn alt" id="back">لدي رقم بالفعل</button></div></div>`);
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { grade = +b.dataset.g; document.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#back').onclick = login;
  $('#reg').onclick = async () => {
    const name = $('#nm').value.replace(/\s+/g, ' ').trim(), err = $('#err');
    if(name.split(' ').length < 3 || !grade){ err.textContent = 'اكتب الاسم الثلاثي واختر الصف'; return; }
    $('#reg').disabled = true; err.textContent = '';
    try { const r = await api('register', { name, grade }); S.code = r.code; localStorage.setItem('eb_code', r.code); done(r.code); }
    catch(e){ $('#reg').disabled = false; err.textContent = { bad_input:'اكتب الاسم الثلاثي بالحروف فقط', exists:'هذا الاسم مسجّل مسبقًا، اسأل معلمك عن رقمك', busy:'الخدمة مزدحمة، حاول لاحقًا' }[e.error] || 'تعذر الاتصال، حاول مرة أخرى'; }
  };
}
function done(c){
  view(`<div class="hero"><div class="logo">🎉</div><h1>تم تسجيلك!</h1><p>هذا رقمك السري للدخول</p></div>
  <div class="sheet"><div class="bigcode" id="bc">${esc(c)}</div><p class="mut" style="line-height:1.8">هذا هو <b>رقم دخولك السري</b>. صوّر الشاشة أو اكتبه الآن، وستستخدمه في كل مرة تدخل فيها.</p>
  <button class="btn alt" id="cp">نسخ الرقم</button><button class="btn" id="st">ابدأ التعلّم</button></div>`);
  $('#cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(c); $('#cp').textContent = 'تم النسخ ✓'; };
  $('#st').onclick = async () => { try { Object.assign(S, await api('login')); home(); } catch(e){ login(); } };
}
const tot = () => Object.values(S.progress || {}).reduce((a, b) => a + b, 0);
function wotdCard(){
  const w = S.wotd; if(!w) return '';
  return `<div class="wotd ${S.wotdDone ? '' : 'todo'}" id="wotd"><div class="wh"><b>🌟 كلمة اليوم</b><small>📚 ${S.wordsN || 0}</small></div>
  <div class="ww"><button class="say" id="wsp1" aria-label="استماع">🔊</button><span class="en">${esc(w.en)}</span></div><p class="wa">${esc(w.ar)}</p>
  <div class="wx"><div class="en" dir="ltr">${esc(w.ex)} <button class="say" id="wsp2" aria-label="استماع">🔊</button></div><p>${esc(w.exAr)}</p></div>
  ${S.wotdDone ? '<div class="wdone">✅ أحسنت! عد غدًا لكلمة جديدة</div>' : '<button class="btn" id="wdone">✅ تعلّمتها</button>'}</div>`;
}
function bindWotd(){
  const w = S.wotd; if(!w || !$('#wotd')) return;
  $('#wsp1').onclick = () => say(w.en); $('#wsp2').onclick = () => say(w.ex);
  const b = $('#wdone');
  if(b) b.onclick = async () => {
    b.disabled = true;
    try { const r = await api('wotd_done'); S.wotdDone = true; S.wordsN = r.wordsN; S.streak = r.streak; S.doneToday = true;
      $('#wotd').outerHTML = wotdCard(); bindWotd();
      const p = document.querySelector('.top .pill'); if(p){ p.className = 'pill hot'; p.textContent = '🔥 ' + S.streak; }
      confetti(); } catch(e){ b.disabled = false; }
  };
}
function home(){
  const first = !S.landed;
  if(!localStorage.getItem('eb_onb') && !Object.keys(S.progress || {}).length && !Object.keys(S.exams || {}).length) return onboard();
  S.landed = true;
  const L = S.lessons, EX = S.exams || {}, P = S.progress || {}, pl = S.placed || 1;
  const locked = i => { if(i === 0 || L[i].unit < pl) return false; const pv = L[i - 1]; if(pv.unit < L[i].unit) return !(L[i].unit === pl || (P[pv.id] >= 1 && (EX[pv.unit] || {}).passed)); return !(P[pv.id] >= 1); };
  const curI = L.findIndex((x, i) => x.unit >= pl && !(P[x.id] >= 1) && !locked(i));
  const plc = !S.placed && !Object.keys(S.progress || {}).length && !Object.keys(EX).length ? '<div class="card" style="background:#e8f1ff;border-color:#b9d3ff;margin-bottom:12px"><b>🧭 اختبار تحديد المستوى</b><p class="mut" style="text-align:right;margin:4px 0 12px">تعرّف على مستواك وابدأ من الوحدة المناسبة بدل البداية.</p><button class="btn" id="plgo">ابدأ الاختبار</button><button class="btn alt" id="plskip" style="margin-top:8px">ابدأ من الوحدة الأولى</button></div>' : '';
  const stk = S.streak && !S.doneToday ? `<p class="mut" style="text-align:right;margin:0 0 10px">🔥 سلسلتك ${S.streak} — أكمل درسًا أو كلمة اليوم للحفاظ عليها</p>` : '';
  const wkc = S.weakN ? `<button class="card les exam" id="wk" style="background:#fff6e0;border-color:#f5d98a"><span class="ic">🎯</span><span class="tx"><b>تمرين نقاط ضعفي</b><small>${S.weakN} سؤالًا أخطأت فيها، صحّحها الآن</small></span></button>` : '';
  const allPassed = Object.keys(S.units || {}).length && Object.keys(S.units).every(u => (EX[u] || {}).passed);
  const cc = allPassed ? '<button class="card les" id="certbtn" style="background:#e3f6ea;border-color:#16a34a"><span class="ic">🎓</span><span class="tx"><b>شهادة الإتمام جاهزة</b><small>اضغط لعرضها وطباعتها</small></span></button>' : '';
  const ann = S.ann || [], seen = localStorage.getItem('eb_ann') || '', kindIc = { 'تهنئة': '🎉', 'إجابة': '💬' };
  const annHtml = ann.length ? `<div class="ann"><b>📢 من المشرف</b>${ann.slice(0, 3).map((a, i) => `<div class="ai ${a.kind === 'تهنئة' ? 'cong' : ''}"><div class="ah"><span>${kindIc[a.kind] || '📌'} ${esc(a.kind)}</span><small>${a.at ? new Date(a.at).toLocaleDateString('ar-SA-u-ca-gregory', { day:'numeric', month:'short' }) : ''}${i === 0 && a.id !== seen ? ' <em>جديد</em>' : ''}</small></div><p>${esc(a.text)}</p></div>`).join('')}</div>` : '';
  const awOn = S.award && Date.now() - Date.parse(S.award.week) < 17 * 864e5;
  const awHtml = awOn ? `<div class="award"><div class="trophy">🏆</div><div><b>مبروك! أنت من أوائل الأسبوع</b><p>حققت المركز ${S.award.rank} بـ ${S.award.xp} نقطة. استمر في التألق!</p></div></div>` : '';
  const resumeBar = curI >= 0 ? `<div class="resume" id="resbar"><button class="btn y" id="resume">▶ تابع درسك: ${esc(L[curI].ar)}</button></div>` : '';
  const srsCard = S.srsN ? `<button class="card les" id="srsbtn" style="background:#e8f1ff"><span class="ic">🔁</span><span class="tx"><b>مراجعتي اليومية</b><small>${S.srsN} سؤالًا جاهزًا لتثبيت ما تعلّمته</small></span></button>` : '';
  const DX = [50, 74, 84, 74, 50, 26, 16, 26], STEP = 108;
  const section = u => {
    const items = L.map((l, i) => ({ l, i })).filter(x => x.l.unit === u), e = EX[u] || {};
    const ready = items.every(x => P[x.l.id] >= 1);
    const pts = items.map((x, k) => ({ x: DX[k % 8], y: 56 + k * STEP })); pts.push({ x: 50, y: 56 + items.length * STEP });
    const H = pts[pts.length - 1].y + 66;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for(let k = 1; k < pts.length; k++){ const q = pts[k - 1], r = pts[k], m = (q.y + r.y) / 2; d += ` C ${q.x} ${m}, ${r.x} ${m}, ${r.x} ${r.y}`; }
    const nodes = items.map((x, k) => { const l = x.l, st = P[l.id] || 0, lock = locked(x.i);
      return `<button class="nd ${lock ? 'lock' : ''} ${st ? 'done' : ''} ${x.i === curI ? 'cur' : ''}" data-unit="${u}" data-id="${l.id}" ${lock ? 'disabled' : ''} style="left:${pts[k].x}%;top:${pts[k].y}px" aria-label="${esc(l.title)}"><span class="c">${lock ? '🔒' : l.icon}</span><span class="t">${esc(l.ar)}</span><span class="s en">${star(st)}</span>${x.i === curI ? '<span class="you">ابدأ من هنا</span>' : ''}</button>`; }).join('');
    const ex = pts[pts.length - 1];
    const exn = `<button class="nd exn ${ready ? '' : 'lock'} ${e.passed ? 'done' : ''}" data-u="${u}" ${ready ? '' : 'disabled'} style="left:${ex.x}%;top:${ex.y}px"><span class="c">${e.passed ? '✅' : ready ? '📝' : '🔒'}</span><span class="t">${e.placed ? 'معفى' : e.passed ? 'اختبار الوحدة ' + e.best + '%' : 'اختبار الوحدة'}</span></button>`;
    return `<h3 class="unit">الوحدة ${u}: ${esc((S.units || {})[u] || '')}</h3><div class="jm" style="height:${H}px"><svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>${nodes}${exn}</div>`;
  };
  view(`<div class="top"><div><small>مرحبًا</small><b>${esc(S.name || 'يا بطل')}</b></div><div style="display:flex;gap:8px"><div class="pill ${S.doneToday ? 'hot' : 'cold'}" aria-label="أيام متتالية">🔥 ${S.streak || 0}</div><div class="pill" aria-label="النجوم">⭐ ${tot()} / ${L.length * 3}</div></div></div>
  <div class="scroll ${curI >= 0 ? 'hasr' : ''}">${awHtml}${wotdCard()}${srsCard}${annHtml}${plc}${installCard()}${stk}${cc}${wkc}${[...new Set(L.map(l => l.unit))].map(section).join('')}<button class="btn alt" id="msgbtn" style="margin:18px 0">✉️ راسل المشرف</button></div>${resumeBar}`);
  const pending = (S.wotd && !S.wotdDone) || (ann[0] && ann[0].id !== seen) || (awOn && localStorage.getItem('eb_aw') !== S.award.week);
  if(ann[0]) localStorage.setItem('eb_ann', ann[0].id);
  if(awOn && localStorage.getItem('eb_aw') !== S.award.week){ localStorage.setItem('eb_aw', S.award.week); confetti(); }
  const c = document.querySelector('.nd.cur');
  if(c && !first && !pending) c.scrollIntoView({ block:'center' });
  if(c && $('#resume')){
    $('#resume').onclick = () => c.scrollIntoView({ behavior:'smooth', block:'center' });
    if('IntersectionObserver' in window) new IntersectionObserver(([e]) => $('#resbar') && $('#resbar').classList.toggle('hide', e.isIntersecting), { root: document.querySelector('.scroll'), threshold: .6 }).observe(c);
  }
  bindInstall(); bindWotd();
  if($('#msgbtn')) $('#msgbtn').onclick = contact;
  if($('#plgo')) $('#plgo').onclick = placeIntro;
  if($('#plskip')) $('#plskip').onclick = async () => { try { await api('place_skip'); S.placed = 1; home(); } catch(e){} };
  if($('#srsbtn')) $('#srsbtn').onclick = srsStart;
  if($('#wk')) $('#wk').onclick = practice;
  if($('#certbtn')) $('#certbtn').onclick = cert;
  document.querySelectorAll('.nd[data-id]').forEach(b => b.onclick = () => openLesson(b.dataset.id));
  document.querySelectorAll('.nd[data-u]').forEach(b => b.onclick = () => examIntro(+b.dataset.u));
}
async function openLesson(id){
  S.lid = id; const b = document.querySelector(`.nd[data-id="${id}"]`); if(b) b.style.opacity = .6;
  try { S.lesson = await api('lesson'); S.wi = 0; words(); } catch(e){ if(b) b.style.opacity = 1; }
}

function words(){
  const v = S.lesson.vocab, w = v[S.wi], last = S.wi === v.length - 1;

function chat(){
  S.hist = [{ role:'assistant', content:S.lesson.hello }]; S.turns = 0; S.done = false; S.busy = false;
  view(`<div class="chathead"><button class="x" id="home" aria-label="خروج">✕</button><div class="av">🦉</div><div><b class="en">English Buddy</b><small>معلمك الذكي</small></div></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="dock"><button class="btn y" id="toquiz" hidden>انتقل إلى الاختبار ←</button>
  <div class="comp"><textarea id="msg" rows="1" dir="auto" enterkeyhint="send" placeholder="اكتب بالإنجليزية أو العربية…" aria-label="رسالتك"></textarea><button id="send" aria-label="إرسال">↑</button></div></div>`);
  $('#home').onclick = home; bubble('bot', S.hist[0].content);
  const m = $('#msg');
  m.oninput = () => { m.style.height = 'auto'; m.style.height = Math.min(m.scrollHeight, 120) + 'px'; };
  m.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
  $('#send').onclick = send; $('#toquiz').onclick = startQuiz; m.focus();
}
function add(node){ const log = $('#log'); log.append(node); log.scrollTop = log.scrollHeight; return node; }
function bubble(who, text){
  const d = document.createElement('div'); d.className = 'm ' + who;
  const b = document.createElement('div'); b.className = 'b'; b.dir = 'auto'; if(text === null) b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; else b.textContent = text; d.append(b);
  if(who === 'bot' && text){ const s = document.createElement('button'); s.className = 'say'; s.textContent = '🔊'; s.setAttribute('aria-label', 'استماع'); s.onclick = () => say(text); d.append(s); }
  return add(d);
}
function fix(text){ const d = document.createElement('div'); d.className = 'fix'; const t = document.createElement('b'); t.textContent = '✏️ تصحيح'; d.append(t, document.createTextNode(text)); add(d); }
async function send(){
  const m = $('#msg'), t = m.value.trim(); if(!t || S.busy) return;
  m.value = ''; m.style.height = 'auto'; bubble('me', t); S.hist.push({ role:'user', content:t }); S.turns++;
  S.busy = true; $('#send').disabled = true; const wait = bubble('bot', null);
  try {
    const r = await api('chat', { history:S.hist }); wait.remove();
    bubble('bot', r.reply); S.hist.push({ role:'assistant', content:r.reply });
    if(r.correction_ar) fix(r.correction_ar); if(r.done) S.done = true;
  } catch(e){
    wait.remove(); S.hist.pop(); S.turns--;
    fix(e.error === 'limit' ? 'وصلت إلى حد الرسائل اليوم. أكمل الاختبار أو عد غدًا.' : 'تعذر الاتصال. أعد إرسال رسالتك.');
  }
  S.busy = false; $('#send').disabled = false; m.focus();
  if(S.done || S.turns >= 6) $('#toquiz').hidden = false;
}

function placeQ(q){
  let pick = null; const built = [];
  const body = q.t === 'order'
    ? `<p class="q" style="direction:rtl;text-align:right">${esc(q.q)}</p><div class="ans" id="ans"></div><div class="wb" id="wb">${q.words.map((w, k) => `<button class="wd" data-k="${k}">${esc(w)}</button>`).join('')}</div>`
    : `<p class="q en${q.q.length > 90 ? ' long' : ''}">${esc(q.q)}</p>${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}`;
  view(`${bar(Math.min(S.pl.n, 24), 24)}<div class="scroll"><p class="mut" style="text-align:right">تحديد المستوى — سؤال ${S.pl.n}</p>${body}</div><div class="foot"><button class="btn" id="nx" disabled>التالي</button></div>`);
  $('#home').onclick = () => { if(confirm('هل تريد الخروج؟ يمكنك إعادة الاختبار لاحقًا')) home(); };
  const ready = () => { $('#nx').disabled = q.t === 'order' ? built.length !== q.words.length : pick === null; };
  if(q.t === 'order'){
    const draw = () => { $('#ans').innerHTML = built.map((k, j) => `<button class="wd on" data-j="${j}">${esc(q.words[k])}</button>`).join(''); document.querySelectorAll('#wb .wd').forEach(c => c.style.visibility = built.includes(+c.dataset.k) ? 'hidden' : 'visible'); ready(); };
    $('#wb').onclick = e => { const c = e.target.closest('.wd'); if(c){ built.push(+c.dataset.k); draw(); } };
    $('#ans').onclick = e => { const c = e.target.closest('.wd'); if(c){ built.splice(+c.dataset.j, 1); draw(); } };
    draw();
  } else document.querySelectorAll('.opt').forEach(b => b.onclick = () => { document.querySelectorAll('.opt').forEach(o => o.classList.remove('sel')); b.classList.add('sel'); pick = +b.dataset.i; ready(); });
  $('#nx').onclick = async () => {
    $('#nx').disabled = true;
    try {
      const r = await api('place_answer', { answer: q.t === 'order' ? built.map(k => q.words[k]).join(' ') : q.options[pick] });
      if(r.done){ S.placed = r.placed; return placeResult(r.placed); }
      S.pl.n++; placeQ(r.q);
    } catch(e){ $('#nx').disabled = false; $('#nx').textContent = 'تعذر الاتصال، اضغط للمحاولة'; }
  };
}

function examQ(){
  const x = S.ex, q = x.qs[x.i], n = x.qs.length, last = x.i === n - 1; let pick = null; const built = [];
  const body = q.t === 'order'
    ? `<p class="q" style="direction:rtl;text-align:right">${esc(q.q)}</p><div class="ans" id="ans" aria-live="polite"></div><div class="wb" id="wb">${q.words.map((w, k) => `<button class="wd" data-k="${k}">${esc(w)}</button>`).join('')}</div>`
    : `<p class="q en${q.q.length > 90 ? ' long' : ''}">${esc(q.q)}</p>${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}`;

  $('#home').onclick = () => { if(confirm('هل تريد الخروج؟ سيضيع تقدمك في هذا الاختبار')) home(); };
  const ready = () => { $('#nx').disabled = q.t === 'order' ? built.length !== q.words.length : pick === null; };
  if(q.t === 'order'){
    const draw = () => { $('#ans').innerHTML = built.map((k, j) => `<button class="wd on" data-j="${j}">${esc(q.words[k])}</button>`).join(''); document.querySelectorAll('#wb .wd').forEach(c => c.style.visibility = built.includes(+c.dataset.k) ? 'hidden' : 'visible'); ready(); };
    $('#wb').onclick = e => { const c = e.target.closest('.wd'); if(c){ built.push(+c.dataset.k); draw(); } };
    $('#ans').onclick = e => { const c = e.target.closest('.wd'); if(c){ built.splice(+c.dataset.j, 1); draw(); } };
    draw();
  } else document.querySelectorAll('.opt').forEach(b => b.onclick = () => { document.querySelectorAll('.opt').forEach(o => o.classList.remove('sel')); b.classList.add('sel'); pick = +b.dataset.i; ready(); });
  $('#nx').onclick = async () => {
    x.ans.push(q.t === 'order' ? built.map(k => q.words[k]).join(' ') : q.options[pick]);

  };

function practiceQ(){
  const p = S.pr, q = p.qs[p.i], n = p.qs.length; let checked = false, timer = null;

  $('#home').onclick = home;
  const next = () => { clearTimeout(timer); p.i++; if(p.i < n) practiceQ(); else practiceDone(); };
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if(checked) return; checked = true; const pick = +b.dataset.i; b.classList.add('sel'); $('#sc').classList.add('locked');

      const r = await api('review_check', { id:q.id, pick }); S.weakN = r.left; if(r.ok){ p.fixed++; S.streak = r.streak; S.doneToday = true; }

      $('#nx').onclick = next; if(r.ok) timer = setTimeout(next, 900);
    } catch(e){ checked = false; b.classList.remove('sel'); $('#sc').classList.remove('locked'); }
  });
}

function srsQ(){
  const p = S.sr, q = p.qs[p.i], n = p.qs.length; let checked = false, timer = null;
  view(`${bar(p.i, n)}<div class="scroll" id="sc"><p class="mut" style="text-align:right">🔁 مراجعتي اليومية — ${p.i + 1} من ${n}</p><p class="q en${q.q.length > 90 ? ' long' : ''}">${esc(q.q)}</p>${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb" hidden></div>`);
  $('#home').onclick = home;
  const next = () => { clearTimeout(timer); p.i++; if(p.i < n) srsQ(); else srsDone(); };
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if(checked) return; checked = true; b.classList.add('sel'); $('#sc').classList.add('locked');
    try {
      const r = await api('srs_check', { id:q.id, pick:q.options[+b.dataset.i] }); S.srsN = r.left;
      if(r.ok){ p.ok++; S.streak = r.streak; S.doneToday = true; }
      const opts = [...document.querySelectorAll('.opt')]; opts.forEach(o => o.classList.remove('sel'));
      opts[q.options.indexOf(r.right)].classList.add('good'); if(!r.ok) b.classList.add('bad');
      if(navigator.vibrate) navigator.vibrate(r.ok ? 25 : [40, 40, 40]);
      const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (r.ok ? 'ok' : 'no');
      fb.innerHTML = `<div class="fbmsg"><b>${r.ok ? 'أحسنت! 🎉' : 'ليست صحيحة'}</b>${r.ok ? '' : `<small>الإجابة الصحيحة:</small><span class="en">${esc(r.right)}</span>`}</div><button class="btn ${r.ok ? '' : 'no'}" id="nx">${p.i === n - 1 ? 'إنهاء' : 'متابعة'}</button>`;
      $('#nx').onclick = next; if(r.ok) timer = setTimeout(next, 900);
    } catch(e){ checked = false; b.classList.remove('sel'); $('#sc').classList.remove('locked'); }
  });
}
function srsDone(){
  const p = S.sr;
  view(`<div class="scroll"><div style="text-align:center;padding:40px 0 10px"><div class="logo" style="margin-bottom:10px">🔁</div><h2>أحسنت! أنهيت المراجعة</h2><p style="margin-top:8px">أجبت صحيحًا عن ${p.ok} من ${p.qs.length}</p><p class="mut" style="margin-top:6px;line-height:1.8">الأسئلة التي أصبتها ستعود إليك بعد أيام لتثبّتها، والتي أخطأت فيها ستعود غدًا.</p><p class="mut">${S.srsN ? 'بقي ' + S.srsN + ' سؤالًا جاهزًا' : 'لا توجد مراجعة أخرى اليوم 🎉'}</p></div></div><div class="foot">${S.srsN ? '<button class="btn alt" id="more">مراجعة أخرى</button>' : ''}<button class="btn" id="done">الرئيسية</button></div>`);
  $('#done').onclick = home; if($('#more')) $('#more').onclick = srsStart;
  if(!S.srsN) confetti();
}
function startQuiz(){ S.ans = []; S.qi = 0; question(); }
function question(){
  const q = S.lesson.quiz[S.qi], n = S.lesson.quiz.length, last = S.qi === n - 1; let checked = false, timer = null;
  view(`${bar(S.qi, n)}<div class="scroll" id="sc"><p class="mut" style="text-align:right">سؤال ${S.qi + 1} من ${n}</p>${q.ref ? `<details class="pg" open><summary>📖 النص</summary><p class="en">${esc(S.lesson.passage)}</p></details>` : ''}<p class="q en${q.q.length > 90 ? ' long' : ''}">${esc(q.q)}</p>
  ${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb" hidden></div>`);
  $('#home').onclick = home;
  const next = async () => {
    clearTimeout(timer); S.qi++; if(S.qi < n) return question();
    const nb = $('#nx'); if(nb) nb.disabled = true;
    try { const r = await api('grade', { answers:S.ans }); S.progress[S.lid] = Math.max(S.progress[S.lid] || 0, r.stars); S.streak = r.streak; S.doneToday = true; result(r); }
    catch(e){ S.qi--; if(nb){ nb.disabled = false; nb.textContent = 'تعذر الحفظ، اضغط للمحاولة'; } }
  };
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if(checked) return; checked = true; const pick = +b.dataset.i; b.classList.add('sel'); $('#sc').classList.add('locked');
    try {
      const r = await api('check', { qi:S.qi, pick }); S.ans.push(pick); if(!r.ok) S.weakN = (S.weakN || 0) + 1;
      const opts = document.querySelectorAll('.opt'); opts.forEach(o => o.classList.remove('sel')); opts[r.right].classList.add('good'); if(!r.ok) opts[pick].classList.add('bad');
      if(navigator.vibrate) navigator.vibrate(r.ok ? 25 : [40, 40, 40]);
      const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (r.ok ? 'ok' : 'no');
      fb.innerHTML = `<div class="fbmsg"><b>${r.ok ? 'أحسنت! 🎉' : 'ليست صحيحة'}</b>${r.ok ? '' : `<small>الإجابة الصحيحة:</small><span class="en">${esc(q.options[r.right])}</span>`}</div><button class="btn ${r.ok ? '' : 'no'}" id="nx">${last ? 'إنهاء' : 'متابعة'}</button>`;
      $('#nx').onclick = next; if(r.ok) timer = setTimeout(next, 900);
    } catch(e){ checked = false; b.classList.remove('sel'); $('#sc').classList.remove('locked'); }
  });
}
function result(r){
  const msg = r.stars === 3 ? 'ممتاز! أتقنت الدرس 🎉' : r.stars >= 1 ? 'أحسنت! راجع الكلمات للحصول على نجوم أكثر' : 'لا بأس، راجع الكلمات وحاول مرة أخرى';
  view(`<div class="scroll"><div style="padding:34px 0 10px"><div class="stars en" aria-label="${r.stars} من 3">${[0,1,2].map(i => `<span style="animation-delay:${i * .25}s">${i < r.stars ? '★' : '☆'}</span>`).join('')}</div>
  <h2 style="text-align:center;margin-top:12px;font-size:1.8rem">${r.score} / ${r.total}</h2><p style="text-align:center;margin-top:6px">${msg}</p><p style="text-align:center;margin-top:4px">🔥 ${r.streak} ${r.streak === 1 ? 'يوم' : 'أيام'} متتالية</p></div>
  ${r.review.map(x => `<div class="rv ${x.ok ? 'ok' : 'no'} en">${x.ok ? '✓' : '✗'} ${esc(x.q)} ${x.ok ? '' : '→ <b>' + esc(x.right) + '</b>'}</div>`).join('')}</div>
  <div class="foot"><button class="btn alt" id="again">أعد الاختبار</button><button class="btn" id="done">${r.next ? 'الدرس التالي' : 'الرئيسية'}</button></div>`);
  $('#again').onclick = startQuiz; $('#done').onclick = () => r.next ? openLesson(r.next) : home();
  if(r.stars >= 2) confetti();
}
function confetti(){
  const c = document.createElement('div'); c.className = 'conf';
  c.innerHTML = Array.from({ length:40 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${['#f5b82e','#0f766e','#e2552b','#3b82f6'][i % 4]};animation-delay:${Math.random() * .7}s;--r:${Math.random() * 720}deg"></i>`).join('');
  document.body.append(c); setTimeout(() => c.remove(), 3600);
}
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
login();
</script>
</body>
