<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>English Buddy</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f766e;--g2:#0a5a54;--y:#f5b82e;--y2:#c98f0c;--ink:#12302e;--bg:#f3f7f5;--line:#dbe5e1;--ok:#16a34a;--no:#e2552b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
.en{font-family:Fredoka,Tajawal,sans-serif}
button{font:inherit;cursor:pointer;border:0}
.scroll{flex:1;overflow:auto;padding:0 18px 18px}
h1,h2,p{margin:0}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--g);color:#fff;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--g2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g2)}
.btn.y{background:var(--y);color:var(--ink);box-shadow:0 4px 0 var(--y2)}
.btn.alt{background:#fff;color:var(--g);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.hero{background:linear-gradient(160deg,var(--g),#064e48);color:#fff;padding:48px 24px 56px;border-radius:0 0 36px 36px;text-align:center}
.logo{width:88px;height:88px;margin:0 auto 14px;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:3rem;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:bob 3s ease-in-out infinite}
.hero h1{font-size:2.2rem}.hero p{opacity:.9;margin-top:6px}
.sheet{padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.sheet label{font-weight:700}
.code{width:100%;padding:16px;font-size:1.6rem;text-align:center;letter-spacing:6px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink)}
.code{resize:none;height:66px;overflow:hidden;line-height:1.4}
.code:focus{border-color:var(--g);outline:0}
.err{color:var(--no);font-weight:700;min-height:1.4em}.mut{color:#5f7673;text-align:center;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px}
.top small{display:block;color:#5f7673}.top b{font-size:1.3rem}
.pill{background:#fff;border:2px solid var(--line);border-radius:20px;padding:6px 14px;font-weight:800}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 4px 0 var(--line)}
.lesson h2{font-size:1.6rem;margin:8px 0}.tag{background:#e0f2ef;color:var(--g);padding:4px 12px;border-radius:12px;font-weight:800;font-size:.85rem}
.path{display:flex;justify-content:space-between;margin:18px 0}
.path div{flex:1;text-align:center;font-size:.85rem;color:#5f7673}.path span{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:#e8f0ed;font-size:1.3rem}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1rem}
.prog{flex:1;height:12px;background:#dfe9e5;border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .35s}
.foot{display:flex;gap:10px;padding:14px 18px 18px}.foot .btn.alt{flex:1}.foot .btn:not(.alt){flex:2}
.flash{position:relative;text-align:center;padding:40px 22px;margin-top:10px;animation:pop .3s}
.spk{width:64px;height:64px;border-radius:50%;background:var(--g);color:#fff;font-size:1.6rem;box-shadow:0 4px 0 var(--g2);margin-bottom:18px}
.big{font-size:3rem;direction:ltr}.ar{font-size:1.6rem;color:var(--g);font-weight:800;margin:6px 0 16px}
.ex{direction:ltr;background:#f3f7f5;border-radius:14px;padding:12px;font-size:1.15rem}
.chathead{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:2px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:#e0f2ef;display:grid;place-items:center;font-size:1.4rem}
.chathead small{display:block;color:var(--ok);font-weight:700;font-size:.8rem}
.log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:6px;align-items:flex-end;max-width:88%;animation:pop .25s}.m.bot{align-self:flex-start;flex-direction:row-reverse}.m.me{align-self:flex-end}
.b{padding:11px 15px;border-radius:20px;font-size:1.1rem;line-height:1.55;word-break:break-word;white-space:pre-wrap}
.bot .b{background:#fff;border:2px solid var(--line);border-bottom-left-radius:6px;direction:ltr;text-align:left}
.me .b{background:var(--g);color:#fff;border-bottom-right-radius:6px}
.say{width:34px;height:34px;border-radius:50%;background:#e0f2ef;font-size:.95rem;flex:none}
.fix{align-self:flex-start;max-width:92%;background:#fff6e0;border:2px solid #f5d98a;border-radius:16px;padding:10px 14px;line-height:1.7;animation:pop .25s}.fix b{display:block;color:var(--y2)}
.dots{display:inline-flex;gap:4px;padding:4px 2px}.dots i{width:8px;height:8px;border-radius:50%;background:#9bb3ae;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.dock{padding:10px 14px 14px;background:#fff;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.comp{display:flex;gap:8px;align-items:flex-end}
.comp textarea{flex:1;resize:none;max-height:120px;padding:12px 16px;font:inherit;font-size:1.1rem;border:2px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);line-height:1.4}
.comp textarea:focus{border-color:var(--g);outline:0;background:#fff}
#send{width:48px;height:48px;border-radius:50%;background:var(--g);color:#fff;font-size:1.3rem;box-shadow:0 3px 0 var(--g2);flex:none}#send:disabled{opacity:.4}
.q{font-size:1.6rem;line-height:1.5;margin:24px 0 18px;direction:ltr;text-align:left}
.opt{display:block;width:100%;direction:ltr;text-align:left;padding:16px;margin-bottom:12px;background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-size:1.2rem;font-family:Fredoka,Tajawal,sans-serif;color:var(--ink)}
.opt.sel{border-color:var(--g);background:#e0f2ef;box-shadow:0 4px 0 var(--g)}
.stars{font-size:3.4rem;color:var(--y);text-align:center;letter-spacing:8px;text-shadow:0 3px 0 var(--y2)}.stars span{display:inline-block;animation:pop .5s backwards}
.rv{padding:11px 14px;border-radius:14px;margin-top:8px;direction:ltr;text-align:left;font-weight:500}.rv.ok{background:#e3f6ea}.rv.no{background:#fde8e1}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.conf i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r))}}@keyframes pop{from{transform:scale(.92);opacity:0}}@keyframes dot{50%{transform:translateY(-5px)}}@keyframes bob{50%{transform:translateY(-6px)}}
.les{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;text-align:right;color:var(--ink)}.les .ic{font-size:1.8rem}.les .tx{flex:1;display:flex;flex-direction:column}.les b{font-size:1.15rem}.les small{color:#5f7673}.les .st{color:var(--y);letter-spacing:2px}.les.lock{opacity:.5}.les.cur{border-color:var(--g);box-shadow:0 4px 0 var(--g)}.unit{margin:22px 0 10px;font-size:1.05rem;color:var(--g)}
.grades{display:flex;gap:8px}.grades .btn{flex:1;padding:12px}.btn.alt.on{background:var(--g);color:#fff;border-color:var(--g)}.field{font-size:1.15rem!important;letter-spacing:0!important;height:58px!important}.bigcode{font:600 3rem Fredoka,monospace;letter-spacing:10px;text-align:center;direction:ltr;background:#fff;border:3px dashed var(--g);border-radius:20px;padding:18px;color:var(--g)}
.exam{border-color:#c9d9ff;background:#f3f7ff}.ans{min-height:64px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;direction:ltr;padding:8px 0;margin-bottom:18px}.wb{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.wd{font:inherit;font-family:Fredoka,sans-serif;font-size:1.15rem;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);color:var(--ink)}.wd.on{border-color:var(--g)}
.ring{width:130px;height:130px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),#dfe9e5 0)}.ring b{width:98px;height:98px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1.8rem}
.pill.hot{border-color:#f5b82e;background:#fff6e0}.pill.cold{opacity:.65}
.opt.good{border-color:var(--ok);background:#e3f6ea;box-shadow:0 4px 0 var(--ok)}.opt.bad{border-color:var(--no);background:#fde8e1;box-shadow:0 4px 0 var(--no);animation:shake .35s}
.locked .opt{pointer-events:none}.fb[hidden]{display:none}
.fb{display:flex;align-items:center;gap:12px;padding:14px 18px 18px;transition:background .2s}.fb .btn{flex:0 0 42%}.fb>.btn:only-child{flex:1}
.fb.ok{background:#d9f3e2}.fb.no{background:#fbddd2}.fbmsg{flex:1;display:flex;flex-direction:column;line-height:1.5}.fbmsg b{font-size:1.25rem}.fbmsg small{color:#5f4a42}.fbmsg span{font-size:1.1rem;font-weight:700;direction:ltr;text-align:right}
.fb.ok b{color:#15803d}.fb.no b{color:#c2410c}.btn.no{background:var(--no);box-shadow:0 4px 0 #a8401a}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = 'https://europe-west1-naj7-7da9d.cloudfunctions.net/tutor';
const $ = s => document.querySelector(s), app = $('#app');
const S = { wi: 0 };
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => t.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8);
const star = (n, t = 3) => '★'.repeat(n) + '☆'.repeat(t - n);
const view = h => { app.innerHTML = h; };
function say(t){ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .85; speechSynthesis.speak(u); }
async function api(action, extra = {}){
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, code:S.code, lid:S.lid, ...extra }) });
  const j = await r.json().catch(() => ({})); if(!r.ok) throw j; return j;
}
const bar = (cur, tot) => `<div class="bar"><button class="x" id="home" aria-label="خروج">✕</button><div class="prog"><i style="width:${cur / tot * 100}%"></i></div></div>`;

function login(){
  view(`<div class="hero"><div class="logo">🦉</div><h1 class="en">English Buddy</h1><p>تعلّم الإنجليزية خطوة بخطوة</p></div>
  <div class="sheet"><label for="code">رمز الدخول</label><textarea id="code" class="code en" rows="1" dir="ltr" enterkeyhint="go" aria-label="رمز الدخول" placeholder="CODE"></textarea>
  <button class="btn" id="go">ابدأ</button><p class="err" id="err" role="alert"></p><button class="btn alt" id="newreg">ليس لدي رقم؟ سجّل الآن</button></div>`);
  const go = async () => {
    S.code = norm($('#code').value); if(!S.code) return;
    $('#go').disabled = true; $('#err').textContent = '';
    try { Object.assign(S, await api('login')); localStorage.setItem('eb_code', S.code); home(); }
    catch(e){ $('#go').disabled = false; $('#err').textContent = e.error === 'slow' ? 'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة' : e.error === 'unknown_code' ? 'الرقم غير صحيح، اسأل معلمك' : 'تعذر الاتصال، حاول مرة أخرى'; }
  };
  $('#newreg').onclick = register; $('#go').onclick = go; $('#code').onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); go(); } };
  $('#code').value = localStorage.getItem('eb_code') || '';
  $('#code').focus();
}

function register(){
  let grade = 0;
  view(`<div class="hero"><div class="logo">🦉</div><h1>تسجيل جديد</h1><p>سجّل مرة واحدة واحصل على رقمك</p></div>
  <div class="scroll"><div class="sheet" style="padding:22px 0"><label for="nm">الاسم الثلاثي</label><textarea id="nm" class="code field" rows="1" dir="auto" placeholder="مثال: أحمد محمد علي"></textarea>
  <label>الصف</label><div class="grades">${['أول','ثاني','ثالث'].map((g, i) => `<button type="button" class="btn alt" data-g="${i + 1}">${g}</button>`).join('')}</div>
  <label for="rg">رمز التسجيل (يعطيك إياه معلمك)</label><textarea id="rg" class="code field" rows="1" dir="ltr" autocapitalize="off"></textarea>
  <button class="btn" id="reg">سجّلني</button><p class="err" id="err" role="alert"></p><button class="btn alt" id="back">لدي رقم بالفعل</button></div></div>`);
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { grade = +b.dataset.g; document.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b)); });
  $('#back').onclick = login;
  $('#reg').onclick = async () => {
    const name = $('#nm').value.replace(/\s+/g, ' ').trim(), err = $('#err');
    if(name.split(' ').length < 3 || !grade){ err.textContent = 'اكتب الاسم الثلاثي واختر الصف'; return; }
    $('#reg').disabled = true; err.textContent = '';
    try { const r = await api('register', { name, grade, reg:$('#rg').value }); S.code = r.code; localStorage.setItem('eb_code', r.code); done(r.code); }
    catch(e){ $('#reg').disabled = false; err.textContent = { bad_input:'اكتب الاسم الثلاثي بالحروف فقط', bad_reg:'رمز التسجيل غير صحيح', exists:'هذا الاسم مسجّل مسبقًا، اسأل معلمك عن رقمك', busy:'الخدمة مزدحمة، حاول لاحقًا' }[e.error] || 'تعذر الاتصال، حاول مرة أخرى'; }
  };
}
function done(c){
  view(`<div class="hero"><div class="logo">🎉</div><h1>تم تسجيلك!</h1><p>هذا رقمك السري للدخول</p></div>
  <div class="sheet"><div class="bigcode" id="bc">${esc(c)}</div><p class="mut">صوّر الشاشة أو اكتب الرقم الآن، فهو مفتاح دخولك دائمًا.</p>
  <button class="btn alt" id="cp">نسخ الرقم</button><button class="btn" id="st">ابدأ التعلّم</button></div>`);
  $('#cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(c); $('#cp').textContent = 'تم النسخ ✓'; };
  $('#st').onclick = async () => { try { Object.assign(S, await api('login')); home(); } catch(e){ login(); } };
}
const tot = () => Object.values(S.progress || {}).reduce((a, b) => a + b, 0);
function home(){
  const L = S.lessons, EX = S.exams || {};
  const locked = i => i > 0 && (!(S.progress[L[i - 1].id] >= 1) || (L[i].unit !== L[i - 1].unit && !(EX[L[i - 1].unit] || {}).passed));
  const curI = L.findIndex((x, i) => !(S.progress[x.id] >= 1) && !locked(i));
  const stk = S.streak && !S.doneToday ? `<p class="mut" style="text-align:right;margin:0 0 10px">🔥 سلسلتك ${S.streak} — أكمل درسًا اليوم للحفاظ عليها</p>` : '';
  const wkc = S.weakN ? `<button class="card les exam" id="wk" style="background:#fff6e0;border-color:#f5d98a"><span class="ic">🎯</span><span class="tx"><b>تمرين نقاط ضعفي</b><small>${S.weakN} سؤالًا أخطأت فيها، صحّحها الآن</small></span></button>` : '';
  const exCard = u => { const ready = L.filter(x => x.unit === u).every(x => S.progress[x.id] >= 1), e = EX[u] || {};
    return `<button class="card les exam ${ready ? '' : 'lock'}" data-u="${u}" ${ready ? '' : 'disabled'}><span class="ic">${ready ? '📝' : '🔒'}</span><span class="tx"><b>اختبار الوحدة ${u}</b><small>${e.passed ? 'نجحت — أفضل نتيجة ' + e.best + '%' : ready ? 'جاهز! درجة النجاح 70%' : 'أكمل جميع دروس الوحدة أولًا'}</small></span><span class="st">${e.passed ? '✅' : ''}</span></button>`; };
  view(`<div class="top"><div><small>مرحبًا</small><b>${esc(S.name || 'يا بطل')}</b></div><div style="display:flex;gap:8px"><div class="pill ${S.doneToday ? 'hot' : 'cold'}" aria-label="أيام متتالية">🔥 ${S.streak || 0}</div><div class="pill" aria-label="النجوم">⭐ ${tot()} / ${L.length * 3}</div></div></div>
  <div class="scroll">${stk}${wkc}${L.map((l, i) => `${i === 0 || l.unit !== L[i - 1].unit ? `<h3 class="unit">الوحدة ${l.unit}: ${esc((S.units || {})[l.unit] || '')}</h3>` : ''}<button class="card les ${locked(i) ? 'lock' : ''} ${i === curI ? 'cur' : ''}" data-id="${l.id}" ${locked(i) ? 'disabled' : ''}><span class="ic">${locked(i) ? '🔒' : l.icon}</span><span class="tx"><b class="en">${esc(l.title)}</b><small>${esc(l.ar)}</small></span><span class="st en">${star(S.progress[l.id] || 0)}</span></button>${i === L.length - 1 || L[i + 1].unit !== l.unit ? exCard(l.unit) : ''}`).join('')}</div>`);
  const c = document.querySelector('.les.cur'); if(c) c.scrollIntoView({ block:'center' });
  document.querySelectorAll('.les[data-id]').forEach(b => b.onclick = () => openLesson(b.dataset.id));
  if($('#wk')) $('#wk').onclick = practice;
  document.querySelectorAll('.les[data-u]').forEach(b => b.onclick = () => examIntro(+b.dataset.u));
}
async function openLesson(id){
  S.lid = id; const b = document.querySelector(`.les[data-id="${id}"]`); if(b) b.style.opacity = .6;
  try { S.lesson = await api('lesson'); S.wi = 0; words(); } catch(e){ if(b) b.style.opacity = 1; }
}

function words(){
  const v = S.lesson.vocab, w = v[S.wi], last = S.wi === v.length - 1;
  view(`${bar(S.wi + 1, v.length)}<div class="scroll"><div class="card flash"><button class="spk" id="spk" aria-label="استماع">🔊</button>
  <h2 class="en big">${esc(w.en)}</h2><p class="ar">${esc(w.ar)}</p><p class="ex en">${esc(w.ex)}</p></div></div>
  <div class="foot"><button class="btn alt" id="prev" ${S.wi ? '' : 'disabled'}>السابق</button><button class="btn" id="nx">${last ? 'ابدأ المحادثة' : 'التالي'}</button></div>`);
  $('#home').onclick = home; $('#spk').onclick = () => say(w.en + '. ' + w.ex);
  $('#prev').onclick = () => { S.wi--; words(); };
  $('#nx').onclick = () => { if(last) chat(); else { S.wi++; words(); } };
  setTimeout(() => say(w.en), 150);
}

function chat(){
  S.hist = [{ role:'assistant', content:S.lesson.hello }]; S.turns = 0; S.done = false; S.busy = false;
  view(`<div class="chathead"><button class="x" id="home" aria-label="خروج">✕</button><div class="av">🦉</div><div><b class="en">English Buddy</b><small>معلمك الذكي</small></div></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="dock"><button class="btn y" id="toquiz" hidden>انتقل إلى الاختبار ←</button>
  <div class="comp"><textarea id="msg" rows="1" dir="auto" enterkeyhint="send" placeholder="اكتب بالإنجليزية أو العربية…" aria-label="رسالتك"></textarea><button id="send" aria-label="إرسال">↑</button></div></div>`);
  $('#home').onclick = home; bubble('bot', S.hist[0].content);
  const m = $('#msg');
  m.oninput = () => { m.style.height = 'auto'; m.style.height = Math.min(m.scrollHeight, 120) + 'px'; };
  m.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
  $('#send').onclick = send; $('#toquiz').onclick = startQuiz; m.focus();
}
function add(node){ const log = $('#log'); log.append(node); log.scrollTop = log.scrollHeight; return node; }
function bubble(who, text){
  const d = document.createElement('div'); d.className = 'm ' + who;
  const b = document.createElement('div'); b.className = 'b'; b.dir = 'auto'; if(text === null) b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; else b.textContent = text; d.append(b);
  if(who === 'bot' && text){ const s = document.createElement('button'); s.className = 'say'; s.textContent = '🔊'; s.setAttribute('aria-label', 'استماع'); s.onclick = () => say(text); d.append(s); }
  return add(d);
}
function fix(text){ const d = document.createElement('div'); d.className = 'fix'; const t = document.createElement('b'); t.textContent = '✏️ تصحيح'; d.append(t, document.createTextNode(text)); add(d); }
async function send(){
  const m = $('#msg'), t = m.value.trim(); if(!t || S.busy) return;
  m.value = ''; m.style.height = 'auto'; bubble('me', t); S.hist.push({ role:'user', content:t }); S.turns++;
  S.busy = true; $('#send').disabled = true; const wait = bubble('bot', null);
  try {
    const r = await api('chat', { history:S.hist }); wait.remove();
    bubble('bot', r.reply); S.hist.push({ role:'assistant', content:r.reply });
    if(r.correction_ar) fix(r.correction_ar); if(r.done) S.done = true;
  } catch(e){
    wait.remove(); S.hist.pop(); S.turns--;
    fix(e.error === 'limit' ? 'وصلت إلى حد الرسائل اليوم. أكمل الاختبار أو عد غدًا.' : 'تعذر الاتصال. أعد إرسال رسالتك.');
  }
  S.busy = false; $('#send').disabled = false; m.focus();
  if(S.done || S.turns >= 6) $('#toquiz').hidden = false;
}

function examIntro(u){
  view(`${bar(0, 1)}<div class="scroll"><div class="card" style="margin-top:10px"><h2>اختبار الوحدة ${u}</h2><p style="line-height:2.1;margin-top:8px">• 16 سؤالًا من دروس الوحدة<br>• لا تظهر النتيجة إلا بعد التسليم<br>• درجة النجاح 70%<br>• يمكنك الإعادة بأسئلة مختلفة<br>• لا تخرج أثناء الاختبار</p></div></div><div class="foot"><button class="btn" id="go">ابدأ الاختبار</button></div>`);
  $('#home').onclick = home; $('#go').onclick = () => examStart(u);
}
async function examStart(u){
  try { const r = await api('exam_start', { unit:u }); S.ex = { u, qs:r.questions, i:0, ans:[] }; examQ(); }
  catch(e){ alert(e.error === 'locked' ? 'أكمل جميع دروس الوحدة أولًا' : 'تعذر الاتصال، حاول مرة أخرى'); }
}
function examQ(){
  const x = S.ex, q = x.qs[x.i], n = x.qs.length, last = x.i === n - 1; let pick = null; const built = [];
  const body = q.t === 'order'
    ? `<p class="q" style="direction:rtl;text-align:right">${esc(q.q)}</p><div class="ans" id="ans" aria-live="polite"></div><div class="wb" id="wb">${q.words.map((w, k) => `<button class="wd" data-k="${k}">${esc(w)}</button>`).join('')}</div>`
    : `<p class="q en">${esc(q.q)}</p>${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}`;
  view(`${bar(x.i, n)}<div class="scroll"><p class="mut" style="text-align:right">اختبار الوحدة ${x.u} — سؤال ${x.i + 1} من ${n}</p>${body}</div><div class="foot"><button class="btn" id="nx" disabled>${last ? 'تسليم الاختبار' : 'التالي'}</button></div>`);
  $('#home').onclick = () => { if(confirm('هل تريد الخروج؟ سيضيع تقدمك في هذا الاختبار')) home(); };
  const ready = () => { $('#nx').disabled = q.t === 'order' ? built.length !== q.words.length : pick === null; };
  if(q.t === 'order'){
    const draw = () => { $('#ans').innerHTML = built.map((k, j) => `<button class="wd on" data-j="${j}">${esc(q.words[k])}</button>`).join(''); document.querySelectorAll('#wb .wd').forEach(c => c.style.visibility = built.includes(+c.dataset.k) ? 'hidden' : 'visible'); ready(); };
    $('#wb').onclick = e => { const c = e.target.closest('.wd'); if(c){ built.push(+c.dataset.k); draw(); } };
    $('#ans').onclick = e => { const c = e.target.closest('.wd'); if(c){ built.splice(+c.dataset.j, 1); draw(); } };
    draw();
  } else document.querySelectorAll('.opt').forEach(b => b.onclick = () => { document.querySelectorAll('.opt').forEach(o => o.classList.remove('sel')); b.classList.add('sel'); pick = +b.dataset.i; ready(); });
  $('#nx').onclick = async () => {
    x.ans.push(q.t === 'order' ? built.map(k => q.words[k]).join(' ') : q.options[pick]);
    if(!last){ x.i++; return examQ(); }
    $('#nx').disabled = true;
    try { const r = await api('exam_submit', { answers:x.ans }); const o = (S.exams || {})[x.u] || {}; S.exams = { ...(S.exams || {}), [x.u]: { best:Math.max(o.best || 0, r.pct), passed:r.passed || !!o.passed } }; S.streak = r.streak; S.doneToday = true; examResult(r); }
    catch(e){ x.ans.pop(); $('#nx').disabled = false; $('#nx').textContent = 'تعذر التسليم، اضغط للمحاولة'; }
  };
}
function examResult(r){
  const lv = r.pct >= 90 ? 'ممتاز' : r.pct >= 80 ? 'جيد جدًا' : r.pct >= 70 ? 'جيد' : 'يحتاج مراجعة';
  view(`<div class="scroll"><div style="text-align:center;padding:30px 0 10px"><div class="ring" style="--p:${r.pct}"><b class="en">${r.pct}%</b></div><h2 style="margin-top:14px">${r.passed ? 'نجحت في الاختبار 🎉' : 'لم تصل لدرجة النجاح بعد'}</h2><p class="mut">التقدير: ${lv} · ${r.score} من ${r.total}</p></div>
  ${r.weak.length ? `<div class="card" style="margin:10px 0"><b>راجع هذه الدروس:</b><p style="margin-top:4px">${r.weak.map(esc).join('، ')}</p></div>` : ''}
  ${r.review.map(x => `<div class="rv ${x.ok ? 'ok' : 'no'} en">${x.ok ? '✓' : '✗'} ${esc(x.q)} ${x.ok ? '' : '→ <b>' + esc(x.right) + '</b>'}</div>`).join('')}</div>
  <div class="foot"><button class="btn alt" id="again">${r.passed ? 'أعد الاختبار' : 'حاول مرة أخرى'}</button><button class="btn" id="done">الرئيسية</button></div>`);
  $('#again').onclick = () => examStart(S.ex.u); $('#done').onclick = home;
  if(r.passed) confetti();
}
async function practice(){
  try { const r = await api('review_start'); if(!r.questions.length){ S.weakN = 0; return home(); } S.pr = { qs:r.questions, i:0, fixed:0 }; practiceQ(); }
  catch(e){ alert('تعذر الاتصال، حاول مرة أخرى'); }
}
function practiceQ(){
  const p = S.pr, q = p.qs[p.i], n = p.qs.length; let checked = false, timer = null;
  view(`${bar(p.i, n)}<div class="scroll" id="sc"><p class="mut" style="text-align:right">🎯 تمرين نقاط ضعفي — ${p.i + 1} من ${n}</p><p class="q en">${esc(q.q)}</p>${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb" hidden></div>`);
  $('#home').onclick = home;
  const next = () => { clearTimeout(timer); p.i++; if(p.i < n) practiceQ(); else practiceDone(); };
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if(checked) return; checked = true; const pick = +b.dataset.i; b.classList.add('sel'); $('#sc').classList.add('locked');
    try {
      const r = await api('review_check', { id:q.id, pick }); S.weakN = r.left; if(r.ok){ p.fixed++; S.streak = r.streak; S.doneToday = true; }
      const opts = document.querySelectorAll('.opt'); opts.forEach(o => o.classList.remove('sel')); opts[r.right].classList.add('good'); if(!r.ok) opts[pick].classList.add('bad');
      const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (r.ok ? 'ok' : 'no');
      fb.innerHTML = `<div class="fbmsg"><b>${r.ok ? 'أحسنت! 🎉' : 'ليست صحيحة'}</b>${r.ok ? '' : `<small>الإجابة الصحيحة:</small><span class="en">${esc(q.options[r.right])}</span>`}</div><button class="btn ${r.ok ? '' : 'no'}" id="nx">${p.i === n - 1 ? 'إنهاء' : 'متابعة'}</button>`;
      $('#nx').onclick = next; if(r.ok) timer = setTimeout(next, 900);
    } catch(e){ checked = false; b.classList.remove('sel'); $('#sc').classList.remove('locked'); }
  });
}
function practiceDone(){
  const p = S.pr;
  view(`<div class="scroll"><div style="text-align:center;padding:40px 0 10px"><div class="logo" style="margin-bottom:10px">🎯</div><h2>أحسنت!</h2><p style="margin-top:8px">صحّحت ${p.fixed} من ${p.qs.length} أسئلة</p><p class="mut">${S.weakN ? 'بقي ' + S.weakN + ' سؤالًا للتمرين' : 'لا توجد نقاط ضعف الآن 🎉'}</p></div></div><div class="foot">${S.weakN ? '<button class="btn alt" id="more">تمرين آخر</button>' : ''}<button class="btn" id="done">الرئيسية</button></div>`);
  $('#done').onclick = home; if($('#more')) $('#more').onclick = practice;
  if(!S.weakN) confetti();
}
function startQuiz(){ S.ans = []; S.qi = 0; question(); }
function question(){
  const q = S.lesson.quiz[S.qi], n = S.lesson.quiz.length, last = S.qi === n - 1; let checked = false, timer = null;
  view(`${bar(S.qi, n)}<div class="scroll" id="sc"><p class="mut" style="text-align:right">سؤال ${S.qi + 1} من ${n}</p><p class="q en">${esc(q.q)}</p>
  ${q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="fb" id="fb" hidden></div>`);
  $('#home').onclick = home;
  const next = async () => {
    clearTimeout(timer); S.qi++; if(S.qi < n) return question();
    const nb = $('#nx'); if(nb) nb.disabled = true;
    try { const r = await api('grade', { answers:S.ans }); S.progress[S.lid] = Math.max(S.progress[S.lid] || 0, r.stars); S.streak = r.streak; S.doneToday = true; result(r); }
    catch(e){ S.qi--; if(nb){ nb.disabled = false; nb.textContent = 'تعذر الحفظ، اضغط للمحاولة'; } }
  };
  document.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
    if(checked) return; checked = true; const pick = +b.dataset.i; b.classList.add('sel'); $('#sc').classList.add('locked');
    try {
      const r = await api('check', { qi:S.qi, pick }); S.ans.push(pick); if(!r.ok) S.weakN = (S.weakN || 0) + 1;
      const opts = document.querySelectorAll('.opt'); opts.forEach(o => o.classList.remove('sel')); opts[r.right].classList.add('good'); if(!r.ok) opts[pick].classList.add('bad');
      if(navigator.vibrate) navigator.vibrate(r.ok ? 25 : [40, 40, 40]);
      const fb = $('#fb'); fb.hidden = false; fb.className = 'fb ' + (r.ok ? 'ok' : 'no');
      fb.innerHTML = `<div class="fbmsg"><b>${r.ok ? 'أحسنت! 🎉' : 'ليست صحيحة'}</b>${r.ok ? '' : `<small>الإجابة الصحيحة:</small><span class="en">${esc(q.options[r.right])}</span>`}</div><button class="btn ${r.ok ? '' : 'no'}" id="nx">${last ? 'إنهاء' : 'متابعة'}</button>`;
      $('#nx').onclick = next; if(r.ok) timer = setTimeout(next, 900);
    } catch(e){ checked = false; b.classList.remove('sel'); $('#sc').classList.remove('locked'); }
  });
}
function result(r){
  const msg = r.stars === 3 ? 'ممتاز! أتقنت الدرس 🎉' : r.stars >= 1 ? 'أحسنت! راجع الكلمات للحصول على نجوم أكثر' : 'لا بأس، راجع الكلمات وحاول مرة أخرى';
  view(`<div class="scroll"><div style="padding:34px 0 10px"><div class="stars en" aria-label="${r.stars} من 3">${[0,1,2].map(i => `<span style="animation-delay:${i * .25}s">${i < r.stars ? '★' : '☆'}</span>`).join('')}</div>
  <h2 style="text-align:center;margin-top:12px;font-size:1.8rem">${r.score} / ${r.total}</h2><p style="text-align:center;margin-top:6px">${msg}</p><p style="text-align:center;margin-top:4px">🔥 ${r.streak} ${r.streak === 1 ? 'يوم' : 'أيام'} متتالية</p></div>
  ${r.review.map(x => `<div class="rv ${x.ok ? 'ok' : 'no'} en">${x.ok ? '✓' : '✗'} ${esc(x.q)} ${x.ok ? '' : '→ <b>' + esc(x.right) + '</b>'}</div>`).join('')}</div>
  <div class="foot"><button class="btn alt" id="again">أعد الاختبار</button><button class="btn" id="done">${r.next ? 'الدرس التالي' : 'الرئيسية'}</button></div>`);
  $('#again').onclick = startQuiz; $('#done').onclick = () => r.next ? openLesson(r.next) : home();
  if(r.stars >= 2) confetti();
}
function confetti(){
  const c = document.createElement('div'); c.className = 'conf';
  c.innerHTML = Array.from({ length:40 }, (_, i) => `<i style="left:${Math.random() * 100}%;background:${['#f5b82e','#0f766e','#e2552b','#3b82f6'][i % 4]};animation-delay:${Math.random() * .7}s;--r:${Math.random() * 720}deg"></i>`).join('');
  document.body.append(c); setTimeout(() => c.remove(), 3600);
}
login();
</script>
