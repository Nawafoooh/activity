<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم</title>
<style>body{font-family:Tajawal,Tahoma,sans-serif;margin:0;background:#f3f7f5;color:#12302e}main{max-width:960px;margin:0 auto;padding:16px}h1{font-size:1.4rem}input,button{font:inherit;padding:10px 14px;border-radius:10px;border:2px solid #dbe5e1}button{background:#0f766e;color:#fff;border-color:#0f766e;cursor:pointer}button.alt{background:#fff;color:#0f766e}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.w{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid #eef3f1;font-size:.95rem;white-space:nowrap}th{background:#e0f2ef}tr.top td{background:#fff8e0;font-weight:700}.msg{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:2px solid #dbe5e1}.msg.new{border-color:#f5b82e;background:#fff8e0}.mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#5f7673;font-size:.85rem}.msg p{margin:8px 0;line-height:1.7;white-space:pre-wrap}.msg button{padding:6px 12px;font-size:.9rem}
@media print{.bar{display:none}}</style>
<main><h1>لوحة المعلم — English Buddy</h1><div class="bar" id="k"><input id="key" type="password" placeholder="مفتاح المعلم"><button id="go">عرض</button></div>
<div class="bar" id="tools" hidden><button class="alt" data-s="weekXp">الأسبوع</button><button class="alt" data-s="xp">الإجمالي</button><button class="alt" data-s="days">الالتزام</button><button class="alt" id="tm">📬 الرسائل</button><button class="alt" onclick="print()">طباعة</button></div><div class="w" id="out"></div></main>
<script>
const API='https://europe-west1-naj7-7da9d.cloudfunctions.net/tutor',$=s=>document.querySelector(s);let rows=[],hard=[],sort='weekXp';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const r=[...rows].sort((a,b)=>b[sort]-a[sort]||b.xp-a.xp);
$('#out').innerHTML='<table><tr><th>#</th><th>الطالب</th><th>الصف</th><th>الرمز</th><th>الشهادة</th><th>نقاط الأسبوع</th><th>الإجمالي</th><th>النجوم</th><th>الدروس</th><th>أيام الدخول</th><th>آخر دخول</th></tr>'+r.map((x,i)=>`<tr class="${i<10&&x[sort]>0?'top':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td dir="ltr">${esc(x.code)}</td><td dir="ltr">${esc(x.cert||'—')}</td><td>${x.weekXp}</td><td>${x.xp}</td><td>${x.stars}</td><td>${x.done}</td><td>${x.days}</td><td>${x.last?new Date(x.last).toLocaleDateString('ar-SA'):'—'}</td></tr>`).join('')+'</table><h3>أصعب الدروس (أخطاء لم تُصحَّح بعد)</h3><table><tr><th>الدرس</th><th>عدد الأسئلة الخاطئة</th></tr>'+hard.map(h=>`<tr><td>${esc(h.title)}</td><td>${h.n}</td></tr>`).join('')+'</table>'}
$('#go').onclick=async()=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_board',key:$('#key').value})});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error==='forbidden'?'المفتاح غير صحيح':'تعذر الاتصال');return}rows=j.rows;hard=j.hard||[];$('#tools').hidden=false;draw();post('admin_msgs').then(j=>{msgs=j.msgs;$('#tm').textContent='📬 الرسائل ('+unread()+')'}).catch(()=>{})};
let msgs=[];const post=(a,x={})=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,key:$('#key').value,...x})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j});
const unread=()=>msgs.filter(m=>!m.read).length;
function drawMsgs(){$('#tm').textContent='📬 الرسائل ('+unread()+')';$('#out').innerHTML=msgs.length?msgs.map(m=>`<div class="msg ${m.read?'':'new'}"><div class="mh"><b>${esc(m.name)}</b><span>${m.at?new Date(m.at).toLocaleString('ar-SA'):''}${m.code?' · رمز '+esc(m.code):''}</span></div><p>${esc(m.text)}</p><div><button class="alt" data-act="read" data-id="${m.id}">${m.read?'غير مقروءة':'مقروءة'}</button> <button class="alt" data-act="del" data-id="${m.id}">حذف</button></div></div>`).join(''):'<p>لا توجد رسائل.</p>'}
$('#tm').onclick=async()=>{$('#out').innerHTML='<p>جارٍ تحميل الرسائل…</p>';try{const j=await post('admin_msgs');msgs=j.msgs;drawMsgs()}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر تحميل الرسائل ('+esc(e.error||'اتصال')+'). تأكد من مفتاح المعلم ومن نشر آخر نسخة من الدالة.</p>'}};
$('#out').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;try{if(b.dataset.act==='del'){if(!confirm('حذف الرسالة؟'))return;await post('admin_msg_del',{id});msgs=msgs.filter(m=>m.id!==id)}else{const m=msgs.find(x=>x.id===id);await post('admin_msg_read',{id,read:!m.read});m.read=!m.read}drawMsgs()}catch(x){alert('تعذر التنفيذ')}};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sort=b.dataset.s;draw()});
</script>
