<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم</title>
<style>body{font-family:Tajawal,Tahoma,sans-serif;margin:0;background:#f3f7f5;color:#12302e}main{max-width:960px;margin:0 auto;padding:16px}h1{font-size:1.4rem}input,button{font:inherit;padding:10px 14px;border-radius:10px;border:2px solid #dbe5e1}button{background:#0f766e;color:#fff;border-color:#0f766e;cursor:pointer}button.alt{background:#fff;color:#0f766e}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.w{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid #eef3f1;font-size:.95rem;white-space:nowrap}th{background:#e0f2ef}tr.top td{background:#fff8e0;font-weight:700}@media print{.bar{display:none}}</style>
<main><h1>لوحة المعلم — English Buddy</h1><div class="bar" id="k"><input id="key" type="password" placeholder="مفتاح المعلم"><button id="go">عرض</button></div>
<div class="bar" id="tools" hidden><button class="alt" data-s="weekXp">الأسبوع</button><button class="alt" data-s="xp">الإجمالي</button><button class="alt" data-s="days">الالتزام</button><button class="alt" onclick="print()">طباعة</button></div><div class="w" id="out"></div></main>
<script>
const API='https://europe-west1-naj7-7da9d.cloudfunctions.net/tutor',$=s=>document.querySelector(s);let rows=[],sort='weekXp';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const r=[...rows].sort((a,b)=>b[sort]-a[sort]||b.xp-a.xp);
$('#out').innerHTML='<table><tr><th>#</th><th>الطالب</th><th>الصف</th><th>الرمز</th><th>نقاط الأسبوع</th><th>الإجمالي</th><th>النجوم</th><th>الدروس</th><th>أيام الدخول</th><th>آخر دخول</th></tr>'+r.map((x,i)=>`<tr class="${i<10&&x[sort]>0?'top':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td dir="ltr">${esc(x.code)}</td><td>${x.weekXp}</td><td>${x.xp}</td><td>${x.stars}</td><td>${x.done}</td><td>${x.days}</td><td>${x.last?new Date(x.last).toLocaleDateString('ar-SA'):'—'}</td></tr>`).join('')+'</table>'}
$('#go').onclick=async()=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_board',key:$('#key').value})});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error==='forbidden'?'المفتاح غير صحيح':'تعذر الاتصال');return}rows=j.rows;$('#tools').hidden=false;draw()};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sort=b.dataset.s;draw()});
</script>
