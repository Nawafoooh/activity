<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المعلم</title>
<style>body{font-family:Tajawal,Tahoma,sans-serif;margin:0;background:#f3f7f5;color:#12302e}main{max-width:960px;margin:0 auto;padding:16px}h1{font-size:1.4rem}input,button{font:inherit;padding:10px 14px;border-radius:10px;border:2px solid #dbe5e1}button{background:#0f766e;color:#fff;border-color:#0f766e;cursor:pointer}button.alt{background:#fff;color:#0f766e}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.w{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid #eef3f1;font-size:.95rem;white-space:nowrap}th{background:#e0f2ef}tr.top td{background:#fff8e0;font-weight:700}.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}.st div{background:#fff;border:2px solid #dbe5e1;border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:1.5rem;color:#0f766e}.st small{color:#5f7673}.br{display:flex;align-items:center;gap:8px;margin:5px 0}.br span{width:92px;font-size:.85rem}.br i{display:block;height:20px;border-radius:6px;background:linear-gradient(90deg,#0f766e,#4cc3b8);min-width:3px}.br b{font-size:.85rem}
.lo td{color:#b42318;font-weight:700}.mid td{color:#b45309}
.msg{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:2px solid #dbe5e1}.msg.new{border-color:#f5b82e;background:#fff8e0}.mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#5f7673;font-size:.85rem}.msg p{margin:8px 0;line-height:1.7;white-space:pre-wrap}.msg button{padding:6px 12px;font-size:.9rem}
#awards{display:none}.aw{page-break-after:always}
@media print{body>*:not(#awards){display:none!important}#awards{display:block}.aw{height:188mm;display:grid;place-items:center;page-break-after:always}.awi{border:5px double #c9962b;width:100%;padding:28px;text-align:center;background:#fffdf7;-webkit-print-color-adjust:exact;print-color-adjust:exact}.awi h1{font-size:2.6rem;color:#0f766e;margin:8px 0}.awi h2{font-size:2.2rem;color:#0f766e;border-bottom:2px dashed #c9962b;display:inline-block;padding:0 24px 6px;margin:10px 0}.awi p{line-height:2.1;font-size:1.2rem}.awi .k{color:#7a5a12;font-weight:800}.awi .f{margin-top:22px}@page{size:A4 landscape;margin:8mm}}</style>
<main><h1>لوحة المعلم — English Buddy</h1><div class="bar" id="k"><input id="key" type="password" placeholder="مفتاح المعلم"><button id="go">عرض</button></div>
<div class="bar" id="tools" hidden><button class="alt" data-s="weekXp">الأسبوع</button><button class="alt" data-s="xp">الإجمالي</button><button class="alt" data-s="days">الالتزام</button><button class="alt" id="tc">🎯 تحدي الأسبوع</button><button class="alt" id="tr">🚩 البلاغات</button><button class="alt" id="tp">📈 التقدم</button><button class="alt" id="tq">📊 جودة المحتوى</button><button class="alt" id="ta">📢 الإعلانات</button><button class="alt" id="tw">🏆 التميز الأسبوعي</button><button class="alt" id="tm">📬 الرسائل</button><button class="alt" onclick="print()">طباعة</button></div><div class="w" id="out"></div></main>
<script>
const API='https://europe-west1-naj7-7da9d.cloudfunctions.net/tutor',$=s=>document.querySelector(s);let rows=[],hard=[],sort='weekXp';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const r=[...rows].sort((a,b)=>b[sort]-a[sort]||b.xp-a.xp);
$('#out').innerHTML='<table><tr><th>#</th><th>الطالب</th><th>الصف</th><th>الرمز</th><th>الشهادة</th><th>نقاط الأسبوع</th><th>الإجمالي</th><th>النجوم</th><th>الدروس</th><th>أيام الدخول</th><th>آخر دخول</th></tr>'+r.map((x,i)=>`<tr class="${i<10&&x[sort]>0?'top':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td dir="ltr">${esc(x.code)}</td><td dir="ltr">${esc(x.cert||'—')}</td><td>${x.weekXp}</td><td>${x.xp}</td><td>${x.stars}</td><td>${x.done}</td><td>${x.days}</td><td>${x.last?new Date(x.last).toLocaleDateString('ar-SA'):'—'}</td></tr>`).join('')+'</table><h3>أصعب الدروس (أخطاء لم تُصحَّح بعد)</h3><table><tr><th>الدرس</th><th>عدد الأسئلة الخاطئة</th></tr>'+hard.map(h=>`<tr><td>${esc(h.title)}</td><td>${h.n}</td></tr>`).join('')+'</table>'}
$('#go').onclick=async()=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_board',key:$('#key').value})});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error==='forbidden'?'المفتاح غير صحيح':'تعذر الاتصال');return}rows=j.rows;hard=j.hard||[];prevWeek=j.prevWeek||'';$('#tools').hidden=false;draw();post('admin_msgs').then(j=>{msgs=j.msgs;$('#tm').textContent='📬 الرسائل ('+unread()+')'}).catch(()=>{})};
let prevWeek='',anns=[];let msgs=[];const post=(a,x={})=>fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,key:$('#key').value,...x})}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j});
const unread=()=>msgs.filter(m=>!m.read).length;
function drawMsgs(){$('#tm').textContent='📬 الرسائل ('+unread()+')';$('#out').innerHTML=msgs.length?msgs.map(m=>`<div class="msg ${m.read?'':'new'}"><div class="mh"><b>${esc(m.name)}</b><span>${m.at?new Date(m.at).toLocaleString('ar-SA'):''}${m.code?' · رمز '+esc(m.code):''}</span></div><p>${esc(m.text)}</p><div><button class="alt" data-act="read" data-id="${m.id}">${m.read?'غير مقروءة':'مقروءة'}</button> <button class="alt" data-act="del" data-id="${m.id}">حذف</button></div></div>`).join(''):'<p>لا توجد رسائل.</p>'}
async function drawAnns(){
$('#out').innerHTML='<p>جارٍ التحميل…</p>';
try{anns=(await post('admin_anns')).anns}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر تحميل الإعلانات ('+esc(e.error||'تعذر الاتصال بالخادم')+')</p><p>forbidden = مفتاح المعلم غير صحيح · bad_action = الدالة المنشورة قديمة · server = خطأ داخل الدالة</p>';return}
$('#out').innerHTML=`<div class="msg"><b>📢 إعلان جديد للطلاب</b><div style="margin:8px 0"><select id="ak" style="font:inherit;padding:8px;border-radius:10px">${['إعلان','إجابة','تهنئة'].map(k=>`<option>${k}</option>`).join('')}</select></div><textarea id="at2" rows="4" style="width:100%;font:inherit;padding:10px;border:2px solid #dbe5e1;border-radius:10px" placeholder="اكتب إعلانًا أو جوابًا على استفسارات الطلاب… (حتى 600 حرف)" maxlength="600"></textarea><button id="apub" style="margin-top:8px">نشر</button></div>`+anns.map(a=>`<div class="msg"><div class="mh"><b>${esc(a.kind)}</b><span>${a.at?new Date(a.at).toLocaleString('ar-SA'):''}</span></div><p>${esc(a.text)}</p><button class="alt" data-act="annDel" data-id="${a.id}">حذف</button></div>`).join('');
$('#apub').onclick=async()=>{const text=$('#at2').value.trim();if(!text)return;try{await post('admin_ann_add',{text,kind:$('#ak').value});drawAnns()}catch(e){alert('تعذر النشر')}}}
function drawAwards(){
const r=[...rows].filter(x=>x.lastWeekXp>0).sort((a,b)=>b.lastWeekXp-a.lastWeekXp).slice(0,10);
if(!r.length){$('#out').innerHTML='<div class="msg"><p>لا توجد نقاط للأسبوع الماضي ('+esc(prevWeek)+') بعد. تُحسب النقاط ابتداءً من هذا التحديث.</p></div>';return}
const draft='🎉 مبروك لأوائل الأسبوع الماضي:\n'+r.map((x,i)=>(i+1)+'. '+x.name).join('\n')+'\nنفتخر بكم، ومن يجتهد هذا الأسبوع قد يكون اسمه التالي 🌟';
$('#out').innerHTML=`<div class="msg"><b>🏆 أوائل الأسبوع الذي بدأ في ${esc(prevWeek)}</b><table style="margin-top:8px"><tr><th>#</th><th>الطالب</th><th>الصف</th><th>النقاط</th></tr>${r.map((x,i)=>`<tr class="top"><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td>${x.lastWeekXp}</td></tr>`).join('')}</table><p style="margin-top:12px"><b>نص التهنئة (يمكنك تعديله):</b></p><textarea id="awt" rows="7" style="width:100%;font:inherit;padding:10px;border:2px solid #dbe5e1;border-radius:10px" maxlength="600">${esc(draft)}</textarea><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button id="awp" class="alt">🖨️ طباعة شهادات التميز</button><button id="awn">📢 نشر التهنئة للطلاب</button></div></div>`;
$('#awp').onclick=()=>printAwards(r);
$('#awn').onclick=async()=>{if(!confirm('نشر التهنئة وإظهار بطاقة «مبروك» لكل فائز في صفحته؟'))return;try{await post('admin_award_publish',{week:prevWeek,winners:r.map((x,i)=>({code:x.code,rank:i+1,xp:x.lastWeekXp,name:x.name})),text:$('#awt').value});alert('تم النشر ✅')}catch(e){alert('تعذر النشر')}}}
function printAwards(r){
const rk=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'],school='متوسطة المنذر بن عمرو الأنصاري',sign='الأستاذ نواف الصبحي';
let box=$('#awards');if(!box){box=document.createElement('div');box.id='awards';document.body.append(box)}
box.innerHTML=r.map((x,i)=>`<div class="aw"><div class="awi"><p class="k">${school}</p><h1>شهادة تميّز</h1><p>تُمنح هذه الشهادة للطالب</p><h2>${esc(x.name)}</h2><p>لحصوله على المركز <b>${rk[i]}</b> في لوحة المتصدرين الأسبوعية لمنصة English Buddy<br>للأسبوع الذي بدأ في ${esc(prevWeek)}، بمجموع <b>${x.lastWeekXp}</b> نقطة</p><p class="f">وكيل شؤون الطلاب<br><b>${sign}</b></p></div></div>`).join('');
print()}
async function drawQ(){
$('#out').innerHTML='<p>جارٍ التحميل…</p>';
let r;try{r=(await post('admin_qstats')).rows}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر تحميل الإحصاءات ('+esc(e.error||'اتصال')+')</p>';return}
$('#out').innerHTML='<div class="msg"><b>📊 الأسئلة الأقل نجاحًا</b><p>تُعرض الأسئلة التي حاول الإجابة عنها 3 طلاب فأكثر منذ بدء تسجيل المحاولات. النسبة الصغيرة تعني سؤالًا صعبًا أو غامضًا أو يختبر ما لم يُدرَّس.</p></div>'+(r.length?'<table><tr><th>الدرس</th><th>السؤال</th><th>المحاولات</th><th>الصحيحة</th></tr>'+r.map(x=>{const p=Math.round(100*x.c/x.a);return `<tr class="${p<50?'lo':p<70?'mid':''}"><td>${esc(x.title)} #${x.qi}</td><td style="white-space:pre-line;direction:ltr;text-align:left">${esc(x.q)}</td><td>${x.a}</td><td>${p}%</td></tr>`}).join('')+'</table>':'<p>لا توجد بيانات كافية بعد. تبدأ المحاولات بالتسجيل من هذا التحديث.</p>');}
async function drawProgress(){
$('#out').innerHTML='<p>جارٍ التحميل…</p>';
let r;try{r=await post('admin_progress')}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر تحميل التقرير ('+esc(e.error||'اتصال')+'). تأكد من نشر آخر نسخة من الدالة.</p>';return}
const keys=Object.keys(r.unitDist).filter(k=>k!=='done').map(Number),mx=keys.length?Math.max(...keys):1,fin=r.unitDist.done||0;
const warn=fin>0?`<div class="msg" style="border-color:#c2410c;background:#fff1ec"><b>⚠️ أنهى ${fin} طالبًا المسار كاملًا</b><p>لا يجدون محتوى جديدًا. اكتب وحدات جديدة الآن.</p></div>`:mx>=(r.maxUnit||10)-2?`<div class="msg" style="border-color:#c2410c;background:#fff1ec"><b>⚠️ حان وقت كتابة وحدات جديدة</b><p>أسرع الطلاب في الوحدة ${mx} وبقي له ${(r.maxUnit||10)-mx} وحدات فقط.</p></div>`:`<div class="msg"><b>🧭 أسرع الطلاب في الوحدة ${mx}</b><p>نكتب الوحدات الجديدة حين يبلغ أحدهم الوحدة ${(r.maxUnit||10)-2} (تبقى ${(r.maxUnit||10)-2-mx}).</p></div>`;
const rows=[...Array(r.maxUnit||10).keys()].map(i=>i+1).concat(['done']).map(u=>{const n=r.unitDist[u]||0;return `<div class="br"><span>${u==='done'?'أنهوا المسار':'الوحدة '+u}</span><i style="width:${r.total?Math.max(n?3:0,100*n/r.total*.7):0}%"></i><b>${n}</b></div>`}).join('');
$('#out').innerHTML=warn+`<div class="st"><div><b>${r.total}</b><small>مسجّلون</small></div><div><b>${r.activeToday}</b><small>نشطون اليوم</small></div><div><b>${r.active7}</b><small>نشطون آخر 7 أيام</small></div><div><b>${r.avgLessons}</b><small>متوسط الدروس المنجزة</small></div><div><b>${r.maxLessons}</b><small>أكثر دروس أنجزها طالب</small></div><div><b>${r.notStarted}</b><small>لم يبدأوا أي درس</small></div><div><b>${r.streak3}</b><small>سلسلة 3 أيام فأكثر</small></div><div><b>${r.certs}</b><small>شهادات إتمام</small></div></div><div class="msg"><b>توزيع الطلاب حسب وحدتهم الحالية</b><div style="margin-top:8px">${rows}</div></div><div class="msg"><b>غير نشطين منذ أسبوع (${r.inactive.length})</b></div>`+(r.inactive.length?'<table><tr><th>الطالب</th><th>الرمز</th><th>دروس</th><th>آخر دخول</th></tr>'+r.inactive.map(x=>`<tr><td>${esc(x.name)}</td><td dir="ltr">${esc(x.code)}</td><td>${x.done}</td><td>${x.last?new Date(x.last).toLocaleDateString('ar-SA'):'—'}</td></tr>`).join('')+'</table>':'')}
async function drawReports(){
$('#out').innerHTML='<p>جارٍ التحميل…</p>';
let r;try{r=(await post('admin_reports')).reports}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر تحميل البلاغات ('+esc(e.error||'اتصال')+')</p>';return}
$('#out').innerHTML='<div class="msg"><b>🚩 بلاغات الطلاب عن أسئلة يظنونها خاطئة</b><p>الإجابة الصحيحة في كل سؤال مؤشَّرة بـ ✓. راجعها، فإن كان السؤال سليمًا فاحذف البلاغ، وإن كان خاطئًا فأرسل لي رقمه ونصه لأصححه.</p></div>'+(r.length?r.map(x=>`<div class="msg ${x.n>=3?'new':''}"><div class="mh"><b>${esc(x.title)} #${x.qi}</b><span>🚩 ${x.n} بلاغ</span></div>${x.passage?`<p style="color:#5f7673;direction:ltr;text-align:left">📖 ${esc(x.passage)}</p>`:''}<p style="direction:ltr;text-align:left">${esc(x.q)}</p><p style="direction:ltr;text-align:left">${x.options.map((o,i)=>(i===x.answer?'✓ ':'• ')+esc(o)).join('<br>')}</p>${x.note?`<p>💬 ${esc(x.note)}</p>`:''}<button class="alt" data-act="repDel" data-id="${x.id}">حذف البلاغ</button></div>`).join(''):'<p>لا توجد بلاغات 🎉</p>');}
async function drawChal(){
$('#out').innerHTML='<p>جارٍ التحميل…</p>';
let r;try{r=await post('admin_challenge_get')}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر التحميل ('+esc(e.error||'اتصال')+')</p>';return}
const c=r.c||{title:'',metric:'lessons',target:300,reward:''},nm={lessons:'دروس منجزة',xp:'نقاط',words:'كلمات اليوم'};
$('#out').innerHTML=`<div class="msg"><b>🎯 تحدي الأسبوع الجماعي</b><p>هدف واحد للمدرسة كلها يظهر لكل طالب بشريط تقدم. يتجدد العدّاد كل أحد، وتبقى الإعدادات حتى تغيّرها. اجعل الهدف أعلى من إنجاز الأسبوع الماضي بنحو 30%.</p></div>
<div class="msg"><b>إنجاز هذا الأسبوع (${esc(r.week)})</b><p>دروس: ${r.now.lessons} · نقاط: ${r.now.xp} · كلمات: ${r.now.words}</p><b>الأسبوع الماضي</b><p>دروس: ${r.prev.lessons} · نقاط: ${r.prev.xp} · كلمات: ${r.prev.words}</p></div>
<div class="msg"><b>إعدادات التحدي</b><p>العنوان:</p><input id="cht" style="width:100%;font:inherit;padding:10px;border:2px solid #dbe5e1;border-radius:10px" maxlength="80" value="${esc(c.title)}" placeholder="مثال: نُنهي معًا 300 درس هذا الأسبوع!">
<p>المقياس:</p><select id="chm" style="font:inherit;padding:8px;border-radius:10px">${Object.entries(nm).map(([k,v])=>`<option value="${k}" ${k===c.metric?'selected':''}>${v}</option>`).join('')}</select>
<p>الهدف (رقم):</p><input id="chg" type="number" min="1" style="font:inherit;padding:10px;border:2px solid #dbe5e1;border-radius:10px;width:140px" value="${c.target}">
<p>الجائزة (تظهر عند تحقق الهدف):</p><input id="chr" style="width:100%;font:inherit;padding:10px;border:2px solid #dbe5e1;border-radius:10px" maxlength="120" value="${esc(c.reward||'')}" placeholder="مثال: إعلان أسماء المتميزين في الإذاعة">
<button id="chs" style="margin-top:10px">حفظ التحدي</button></div>`;
$('#chs').onclick=async()=>{try{await post('admin_challenge_set',{title:$('#cht').value,metric:$('#chm').value,target:$('#chg').value,reward:$('#chr').value});alert('تم الحفظ ✅');drawChal()}catch(e){alert('تعذر الحفظ')}}}
$('#tc').onclick=drawChal;
$('#tr').onclick=drawReports;
$('#tp').onclick=drawProgress;
$('#tq').onclick=drawQ;
$('#ta').onclick=drawAnns;$('#tw').onclick=drawAwards;
$('#tm').onclick=async()=>{$('#out').innerHTML='<p>جارٍ تحميل الرسائل…</p>';try{const j=await post('admin_msgs');msgs=j.msgs;drawMsgs()}catch(e){$('#out').innerHTML='<p style="color:#c2410c">تعذر تحميل الرسائل ('+esc(e.error||'اتصال')+'). تأكد من مفتاح المعلم ومن نشر آخر نسخة من الدالة.</p>'}};
$('#out').onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;try{if(b.dataset.act==='repDel'){await post('admin_report_del',{id});return drawReports()}if(b.dataset.act==='annDel'){if(!confirm('حذف الإعلان؟'))return;await post('admin_ann_del',{id});return drawAnns()}if(b.dataset.act==='del'){if(!confirm('حذف الرسالة؟'))return;await post('admin_msg_del',{id});msgs=msgs.filter(m=>m.id!==id)}else{const m=msgs.find(x=>x.id===id);await post('admin_msg_read',{id,read:!m.read});m.read=!m.read}drawMsgs()}catch(x){alert('تعذر التنفيذ')}};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sort=b.dataset.s;draw()});
</script>
